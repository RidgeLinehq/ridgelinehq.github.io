<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b141d">
<title>Ridgeline AI Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b141d;--surface:#121f2d;--raised:#182a3b;--sunk:#08111a;--line:rgba(159,176,192,.16);--line2:rgba(159,176,192,.32);--text:#eef3f7;--mist:#a7b6c4;--dim:#7b8b9a;--ember:#ff8a2a;--ember2:#ffa857;--ember-ink:#1a1008;--ember-soft:rgba(255,138,42,.14);--signal:#7dd3ff;--signal-soft:rgba(125,211,255,.14);--good:#4fd18b;--good-soft:rgba(79,209,139,.14);--warn:#ffb020;--warn-soft:rgba(255,176,32,.16);--bad:#ff6b6b;--bad-soft:rgba(255,107,107,.16);--display:Archivo,"Arial Narrow",Arial,sans-serif;--body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;--floor:#0d1823;--floor-line:rgba(159,176,192,.07);--desk:#1d3144;--desk2:#243b52;--wood:#2b3e52;--ease:cubic-bezier(.16,1,.3,1)}
@media(prefers-color-scheme:light){:root{color-scheme:light;--bg:#f1f4f7;--surface:#fff;--raised:#f6f8fa;--sunk:#e4e9ee;--line:rgba(21,33,44,.12);--line2:rgba(21,33,44,.24);--text:#15212c;--mist:#4b5b6b;--dim:#75848f;--ember:#e8731a;--ember2:#f0893a;--ember-ink:#fff8f2;--ember-soft:rgba(232,115,26,.12);--signal:#1f7fc4;--signal-soft:rgba(31,127,196,.12);--good:#1f9a5c;--good-soft:rgba(31,154,92,.12);--warn:#c77a00;--warn-soft:rgba(199,122,0,.14);--bad:#d23c3c;--bad-soft:rgba(210,60,60,.12);--floor:#e3e9ef;--floor-line:rgba(21,33,44,.07);--desk:#cfd9e3;--desk2:#bfccd8;--wood:#b9c6d2}}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,p,ul{margin:0}h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.02em;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}
:where(a,button,input,select,textarea):focus-visible{outline:3px solid var(--signal);outline-offset:2px;border-radius:6px}
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:900;font-size:17px;white-space:nowrap;text-decoration:none}
.brand svg{width:30px;height:30px}.brand small{display:block;font-family:var(--body);font-weight:600;font-size:11px;color:var(--dim);line-height:1}
.lights{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.light{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;font-size:11px;font-weight:700;color:var(--mist);background:var(--surface)}
.light i{width:8px;height:8px;border-radius:50%;background:var(--dim)}.light[data-l="green"] i{background:var(--good)}.light[data-l="yellow"] i{background:var(--warn)}.light[data-l="red"] i{background:var(--bad)}
.mode{padding:5px 10px;border-radius:999px;font-family:var(--display);font-weight:800;font-size:11px;letter-spacing:.04em;border:1px solid var(--line2);background:var(--raised);white-space:nowrap}
.mode[data-m="dry"]{color:var(--warn)}.mode[data-m="live"]{color:var(--good)}.mode[data-m="paused"]{color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:8px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--raised);font-family:var(--display);font-weight:800;font-size:14px;white-space:nowrap}
.btn.p{background:linear-gradient(135deg,var(--ember2),var(--ember));color:var(--ember-ink);border-color:transparent}.btn.good{color:var(--good);background:var(--good-soft);border-color:transparent}.btn.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.btn.sm{min-height:32px;padding:5px 10px;font-size:12.5px;border-radius:8px}.btn.block{width:100%}.btn:disabled{opacity:.45}
.body{display:grid;grid-template-columns:220px 1fr;min-width:0}
.rail{border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:60px;align-self:start;height:calc(100vh - 60px);overflow:auto}
.rail a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-weight:700;font-size:14px;color:var(--mist);text-decoration:none}
.rail a.on{background:var(--ember-soft);color:var(--text)}.rail .cnt{margin-left:auto;font-size:11px;font-weight:800;background:var(--ember);color:var(--ember-ink);border-radius:999px;padding:1px 7px}
.main{min-width:0;padding:18px max(16px,env(safe-area-inset-right,0px)) 100px max(16px,env(safe-area-inset-left,0px))}
.page{display:none;max-width:1120px;margin:auto}.page.on{display:block}
.tabs{display:none}
@media(max-width:860px){.body{grid-template-columns:1fr}.rail{display:none}.lights{display:none}
 .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
 .tabs button{background:none;border:0;padding:6px 2px;font-size:10.5px;font-weight:700;color:var(--dim);border-radius:10px}.tabs button.on{color:var(--ember)}}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}.head h2{font-size:clamp(22px,3vw,28px)}.head p{color:var(--mist);font-size:14px;margin-top:4px;max-width:62ch}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}.card h3{font-size:15px;margin-bottom:10px;display:flex;gap:8px;align-items:center}.card h3 .sp{margin-left:auto;font-family:var(--body);font-weight:600;font-size:12px;color:var(--dim)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}.tile b{display:block;font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}.tile span{display:block;color:var(--mist);font-size:12.5px;font-weight:600;margin-top:4px}.tile.hot{border-color:rgba(255,138,42,.45)}.tile.hot b{color:var(--ember2)}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row .t{flex:1;min-width:0}.row .t b{display:block;font-weight:700}.row .t small{display:block;color:var(--dim);font-size:12px}
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:800;background:var(--raised);color:var(--mist);border:1px solid var(--line);white-space:nowrap}
.pill.good{color:var(--good);background:var(--good-soft);border-color:transparent}.pill.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}.pill.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent}.pill.ember{color:var(--ember2);background:var(--ember-soft);border-color:transparent}.pill.signal{color:var(--signal);background:var(--signal-soft);border-color:transparent}
.empty{padding:22px 14px;text-align:center;color:var(--mist);font-size:14px;border:1px dashed var(--line2);border-radius:12px}.empty b{display:block;color:var(--text);font-family:var(--display)}
.field{margin-top:10px}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;min-height:42px;padding:9px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--sunk);color:var(--text)}.field textarea{min-height:90px;resize:vertical}
.note{padding:10px 12px;border-radius:10px;font-size:13px;background:var(--raised);border:1px solid var(--line);margin-bottom:12px}.note.warn{background:var(--warn-soft)}.note.bad{background:var(--bad-soft)}
pre.body{white-space:pre-wrap;font:inherit;margin:8px 0 0;padding:12px;border-radius:10px;background:var(--sunk);border:1px solid var(--line);font-size:14px;max-height:320px;overflow:auto}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chip{padding:5px 10px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font-size:12.5px;font-weight:700;color:var(--mist)}.chip.on{background:var(--ember-soft);color:var(--text)}
.score{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;font-family:var(--display);font-weight:900;background:var(--raised);border:1px solid var(--line);flex:none}.score.hi{color:var(--good)}.score.mid{color:var(--warn)}.score.lo{color:var(--dim)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.sw .t b{display:block}.sw .t small{display:block;color:var(--dim);font-size:12px;max-width:52ch}
.toggle{width:50px;height:30px;border-radius:999px;border:1px solid var(--line2);background:var(--sunk);position:relative;flex:none}.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--dim);transition:transform .2s}.toggle[aria-checked="true"]{background:var(--ember)}.toggle[aria-checked="true"]::after{transform:translateX(20px);background:#fff}
.floor{position:relative;border:1px solid var(--line2);border-radius:18px;padding:18px 14px 14px;overflow:hidden;background:radial-gradient(600px 300px at 50% 0%,rgba(255,138,42,.08),transparent 70%),linear-gradient(var(--floor-line) 1px,transparent 1px),linear-gradient(90deg,var(--floor-line) 1px,transparent 1px),var(--floor);background-size:auto,34px 34px,34px 34px,auto}
.floor-head{display:flex;justify-content:space-between;margin-bottom:12px;font-size:12px;color:var(--dim);font-weight:700}.floor-head b{font-family:var(--display);color:var(--text);letter-spacing:.04em}
.desks{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}@media(max-width:860px){.desks{grid-template-columns:repeat(2,1fr)}}
.desk{background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;display:grid;gap:6px}.desk[data-state="working"]{border-color:rgba(255,176,32,.5)}.desk[data-state="error"]{border-color:rgba(255,107,107,.55)}.desk[data-state="paused"]{opacity:.6}
.desk svg{width:100%;height:auto;display:block}.desk .nm{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:900;font-size:14px}.desk .nm i{width:8px;height:8px;border-radius:50%;background:var(--dim)}.desk[data-state="idle"] .nm i{background:var(--good)}.desk[data-state="working"] .nm i{background:var(--warn);animation:blink 1.1s steps(2) infinite}.desk[data-state="error"] .nm i{background:var(--bad)}
.desk .rl{font-size:11px;color:var(--ember2);font-weight:700;margin-top:-4px}.desk .tk{font-size:12px;color:var(--mist);min-height:34px}
.desk .scr{fill:var(--sunk)}.desk[data-state="working"] .scr{fill:url(#scrOn)}.desk .ln{opacity:0}.desk[data-state="working"] .ln{opacity:1;animation:typeln 1.6s ease-in-out infinite}.desk .lamp{fill:var(--dim)}.desk[data-state="working"] .lamp{fill:var(--warn)}.desk[data-state="idle"] .lamp{fill:var(--good)}.desk[data-state="error"] .lamp{fill:var(--bad)}.desk .glow{opacity:0}.desk[data-state="working"] .glow{opacity:.55;animation:pulse 2.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}@keyframes typeln{0%{transform:scaleX(.2)}50%{transform:scaleX(1)}100%{transform:scaleX(.3)}}@keyframes pulse{50%{opacity:.25}}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--raised);border:1px solid var(--line2);padding:10px 14px;border-radius:12px;font-weight:700;font-size:13.5px;opacity:0;transition:opacity .2s;z-index:60;pointer-events:none}.toast.on{opacity:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}.kv dt{color:var(--dim);font-weight:600}.kv dd{margin:0;overflow-wrap:anywhere}
.small{font-size:12.5px}.dim{color:var(--dim)}.muted{color:var(--mist)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="scrOn" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#7dd3ff" stop-opacity=".55"/><stop offset="1" stop-color="#ff8a2a" stop-opacity=".35"/></linearGradient></defs><symbol id="i-logo" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#ff8a2a"/><path d="M5 24 L12.5 11.5 L17 18 L22 9.5 L27 24 Z" fill="#0b141d"/></symbol></svg>
<header class="top"><div class="top-in"><a class="brand" href="#today"><svg><use href="#i-logo"/></svg><span>Ridgeline AI Office<small id="sub">server edition</small></span></a><div class="lights" id="lights"></div><span class="mode" id="mode">LOADING</span><button class="btn bad sm" id="pauseBtn" type="button">Pause all</button></div></header>
<div class="body"><nav class="rail" id="rail"></nav><main class="main" id="main">
<section class="page" id="p-today"></section><section class="page" id="p-leads"></section><section class="page" id="p-floor"></section><section class="page" id="p-outreach"></section><section class="page" id="p-studio"></section><section class="page" id="p-learning"></section><section class="page" id="p-analytics"></section><section class="page" id="p-settings"></section>
</main></div>
<nav class="tabs" id="tabs"></nav>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
"use strict";
const PAGES=[["today","Command Center","Today"],["leads","Lead Desk","Leads"],["floor","Agent Floor","Floor"],["outreach","Outreach Center","Outreach"],["studio","Content Studio","Studio"],["learning","Learning Log","Learning"],["analytics","Analytics","Analytics"],["settings","Settings & Safety","Settings"]];
const AGENT_DESC={mara:"Runs the day, prioritizes, reports.",scout:"Finds businesses with weak online signals.",quinn:"Scores every lead 0 to 100 and says why.",parker:"Picks the angle and the hook for each lead.",echo:"Writes the emails, runs the QA gate, sends only through the gates.",nova:"Writes video briefs and captions.",sage:"Turns verified outcomes into lessons.",patch:"Site, database, failed tasks, backups."};
const DESK='<svg viewBox="0 0 120 70" aria-hidden="true"><rect class="glow" x="28" y="4" width="64" height="40" rx="10" fill="#7dd3ff"/><rect x="12" y="38" width="96" height="10" rx="3" fill="var(--wood)"/><rect x="18" y="48" width="6" height="16" rx="2" fill="var(--desk)"/><rect x="96" y="48" width="6" height="16" rx="2" fill="var(--desk)"/><rect x="38" y="8" width="44" height="28" rx="4" fill="var(--desk2)"/><rect class="scr" x="41" y="11" width="38" height="22" rx="2"/><g fill="#eef3f7" opacity=".8"><rect class="ln" x="45" y="15" width="22" height="2" rx="1" style="transform-origin:45px 16px"/><rect class="ln" x="45" y="20" width="28" height="2" rx="1" style="transform-origin:45px 21px"/><rect class="ln" x="45" y="25" width="16" height="2" rx="1" style="transform-origin:45px 26px"/></g><rect x="56" y="36" width="8" height="4" fill="var(--desk)"/><circle class="lamp" cx="100" cy="30" r="3.5"/><rect x="99" y="33" width="2" height="6" fill="var(--desk)"/><rect x="48" y="54" width="24" height="12" rx="4" fill="var(--desk2)"/><rect x="52" y="50" width="16" height="5" rx="2" fill="var(--desk)"/></svg>';
const S={page:"today",status:null,agents:[],leads:[],drafts:[],tasks:[],lessons:[],workflow:[],runs:[],settings:null,health:null,suppression:[],clients:[],usage:null,leadFilter:"all",otab:"ready",err:""};
const $=s=>document.querySelector(s);const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),2200)}
function token(){try{return localStorage.getItem("ro.token")||""}catch(e){return ""}}
async function api(path,opts){opts=opts||{};const h=Object.assign({"Content-Type":"application/json"},opts.headers||{});const tk=token();if(tk)h["Authorization"]="Bearer "+tk;const r=await fetch(path,Object.assign({},opts,{headers:h}));let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.detail||("Request failed ("+r.status+")"));return d}
async function refresh(){try{const [status,agents,leads,drafts,tasks,lessons,workflow,runs,settings,health,sup,clients,usage]=await Promise.all([api("/api/status"),api("/api/agents"),api("/api/leads"),api("/api/drafts"),api("/api/tasks"),api("/api/lessons"),api("/api/workflow"),api("/api/runs"),api("/api/settings"),api("/api/health"),api("/api/suppression"),api("/api/clients"),api("/api/usage")]);Object.assign(S,{status,agents,leads,drafts,tasks,lessons,workflow,runs,settings,health,suppression:sup,clients,usage,err:""})}catch(e){S.err=e.message}render()}
function go(p){S.page=p;render();window.scrollTo(0,0)}
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(PAGES.some(x=>x[0]===h))go(h)});
function render(){renderChrome();const el=$("#p-"+S.page);document.querySelectorAll(".page").forEach(p=>p.classList.toggle("on",p.id==="p-"+S.page));el.innerHTML=({today:rToday,leads:rLeads,floor:rFloor,outreach:rOutreach,studio:rStudio,learning:rLearning,analytics:rAnalytics,settings:rSettings})[S.page]()}
function lights(){const st=S.status,h=S.health;if(!st)return[];const w=h&&h.worker==="running";return[["worker",w?"green":"red"],["ai",st.providers.ai.configured?"green":"yellow"],["research",st.providers.research.configured?"green":"yellow"],["email",st.providers.email.configured?"green":"yellow"],["site",h&&h.database==="connected"?"green":"red"]]}
function renderChrome(){const st=S.status;const m=$("#mode");if(!st){m.textContent=S.err?"API ERROR":"LOADING";m.dataset.m=""}else{m.textContent=st.mode;m.dataset.m=st.paused?"paused":st.dry_run?"dry":"live"}
 $("#lights").innerHTML=lights().map(l=>'<span class="light" data-l="'+l[1]+'"><i></i>'+l[0]+'</span>').join("");
 const pb=$("#pauseBtn");pb.textContent=st&&st.paused?"Resume":"Pause all";pb.className="btn sm "+(st&&st.paused?"good":"bad");
 const ready=st?st.drafts_ready:0;$("#rail").innerHTML=PAGES.map(p=>'<a href="#'+p[0]+'" class="'+(S.page===p[0]?"on":"")+'">'+esc(p[1])+(p[0]==="outreach"&&ready?'<span class="cnt">'+ready+'</span>':'')+'</a>').join("");
 $("#tabs").innerHTML=PAGES.slice(0,4).map(p=>'<button type="button" data-go="'+p[0]+'" class="'+(S.page===p[0]?"on":"")+'">'+esc(p[2])+'</button>').join("")+'<button type="button" data-go="settings" class="'+(["studio","learning","analytics","settings"].includes(S.page)?"on":"")+'">More</button>'}
function tile(n,l,s,c){return '<div class="tile '+(c||"")+'"><b>'+esc(n)+'</b><span>'+esc(l)+'</span>'+(s?'<small class="dim">'+esc(s)+'</small>':'')+'</div>'}
function head(id,sub,right){const p=PAGES.find(x=>x[0]===id);return '<div class="head"><div><h2>'+esc(p[1])+'</h2>'+(sub?'<p>'+esc(sub)+'</p>':'')+'</div>'+(right||'')+'</div>'}
function errNote(){if(S.err)return '<div class="note bad">'+esc(S.err)+(S.err.includes("token")?' · set your token in Settings.':'')+'</div>';if(S.status&&!S.status.worker.alive&&S.status.worker.enabled)return '<div class="note warn">The worker thread is not running; tasks stay queued.</div>';return ""}
function statusPill(s){const m={Qualified:"signal",Contacted:"warn",Replied:"ember",Meeting:"ember",Client:"good",Suppressed:"bad"};return '<span class="pill '+(m[s]||"")+'">'+esc(s)+'</span>'}
function floorHtml(compact){const paused=S.status&&S.status.paused;return '<div class="floor"><div class="floor-head"><b>RIDGELINE OFFICE · FLOOR 1</b><span>'+(paused?"paused":S.agents.some(a=>a.status==="working")?"crew working":"crew idle")+'</span></div><div class="desks">'+S.agents.map(a=>'<div class="desk" data-state="'+esc(paused?"paused":a.status)+'">'+DESK+'<span class="nm"><i></i>'+esc(a.name)+'</span><span class="rl">'+esc(a.role)+'</span>'+(compact?'':'<span class="tk">'+esc(a.current_task)+(a.last_error?' · '+esc(a.last_error):'')+'</span>')+'</div>').join("")+'</div></div>'}
function rToday(){const st=S.status;if(!st)return head("today")+errNote()+'<div class="empty"><b>Connecting…</b></div>';const c=st.leads_by_status;let h=head("today",(S.runs[0]?"Last run "+S.runs[0].started_at+" · "+S.runs[0].status:"No Day Shift has run yet; it runs weekdays at "+st.scheduler.day_shift_time+" ("+(st.scheduler.alive?"scheduler running":"scheduler off")+")."));h+=errNote();
 h+='<div class="grid g4">'+tile(c.Qualified,"Qualified leads")+tile(st.drafts_ready,"Awaiting your OK","",st.drafts_ready?"hot":"")+tile(c.Contacted,"Contacted")+tile(c.Replied+c.Meeting,"Replies")+'</div>';
 h+='<div class="grid g2" style="margin-top:12px"><div class="card"><h3>Needs you <span class="sp">'+st.needs_you.length+'</span></h3>'+(st.needs_you.length?st.needs_you.map(n=>'<div class="row"><div class="t"><b>'+esc(n.t)+'</b><small>'+esc(n.s)+'</small></div></div>').join(""):'<div class="empty"><b>Nothing waiting on you</b></div>')+'</div>';
 h+='<div class="card"><h3>Integrations <span class="sp">honest status</span></h3>'+["ai","research","email"].map(k=>'<div class="row"><div class="t"><b>'+k+'</b><small>'+esc(st.providers[k].name)+'</small></div><span class="pill '+(st.providers[k].configured?"good":"warn")+'">'+(st.providers[k].configured?"configured":"not configured")+'</span></div>').join("")+'<div class="row"><div class="t"><b>worker</b><small>'+esc(st.worker.heartbeat||"")+'</small></div><span class="pill '+(st.worker.alive?"good":"bad")+'">'+(st.worker.alive?"running":"off")+'</span></div></div></div>';
 h+='<div class="card" style="margin-top:12px"><h3>Agent floor</h3>'+floorHtml(true)+'</div>';
 h+='<div class="grid g2" style="margin-top:12px"><div class="card"><h3>Recent runs</h3>'+(S.runs.length?S.runs.slice(0,6).map(r=>'<div class="row"><div class="t"><b>'+esc(r.day)+' · '+esc(r.town||"")+'</b><small>'+esc(r.summary||"")+'</small></div><span class="pill '+(r.status==="done"?"good":"warn")+'">'+esc(r.status)+'</span></div>').join(""):'<div class="empty"><b>No runs yet</b></div>')+'<div class="inline" style="margin-top:10px"><button class="btn sm p" data-act="run">Run the Day Shift now</button></div></div>';
 h+='<div class="card"><h3>Recent tasks</h3>'+(S.tasks.length?S.tasks.slice(0,8).map(t=>'<div class="row"><span class="pill">'+esc(t.agent_id)+'</span><div class="t"><b>'+esc(t.title)+'</b><small>'+esc(t.result||t.error||"")+'</small></div><span class="pill '+(t.status==="done"?"good":t.status==="failed"?"bad":"warn")+'">'+esc(t.status)+'</span></div>').join(""):'<div class="empty"><b>No tasks yet</b></div>')+'</div></div>';return h}
function rLeads(){const st=S.settings||{};let h=head("leads","Every business with its proof. Research runs only when a research provider is configured; you can always add leads by hand.",'<button class="btn sm" data-act="addlead">+ Add lead</button>');h+=errNote();
 const by={};S.leads.forEach(l=>by[l.status]=(by[l.status]||0)+1);h+='<div class="chips">'+[["all","All",S.leads.length]].concat(Object.keys(by).map(k=>[k,k,by[k]])).map(f=>'<button class="chip '+(S.leadFilter===f[0]?"on":"")+'" data-filter="'+esc(f[0])+'">'+esc(f[1])+' '+f[2]+'</button>').join("")+'</div>';
 const list=S.leads.filter(l=>S.leadFilter==="all"||l.status===S.leadFilter);
 h+=list.length?'<div class="card">'+list.map(l=>'<div class="row"><span class="score '+(l.score>=(st.score_gate||60)?"hi":l.score>=40?"mid":"lo")+'">'+esc(l.score)+'</span><div class="t"><b>'+esc(l.business_name)+'</b><small>'+esc(l.trade||"")+' · '+esc(l.town||"")+', '+esc(l.state||"")+(l.contact_email?" · "+esc(l.contact_email):" · no email")+(l.phone?" · "+esc(l.phone):"")+'</small>'+((l.score_why||[]).length?'<small>'+esc((l.score_why||[]).join(" · "))+'</small>':'')+'</div><select data-leadstatus="'+esc(l.id)+'">'+["New","Researching","Qualified","Contacted","Replied","Meeting","Client","Not a fit","Suppressed"].map(s=>'<option '+(l.status===s?"selected":"")+'>'+s+'</option>').join("")+'</select></div>').join("")+'</div>':'<div class="empty"><b>No leads yet</b>Add one, or configure BRAVE_API_KEY so Scout can search.</div>';
 h+='<div class="card" id="addLeadCard" style="margin-top:12px;display:none"><h3>Add a lead</h3><form id="leadForm"><div class="field"><label>Business name</label><input name="business_name" required minlength="2"></div><div class="grid g2"><div class="field"><label>Trade</label><select name="trade"><option>roofing</option><option>tree service</option><option>other</option></select></div><div class="field"><label>Town</label><input name="town" required></div><div class="field"><label>State (2 letters)</label><input name="state" maxlength="2"></div><div class="field"><label>Website</label><input name="website"></div><div class="field"><label>Email (only if published)</label><input name="contact_email" type="email"></div><div class="field"><label>Phone</label><input name="phone"></div></div><div class="field"><label>Source URL (where you verified it)</label><input name="source_url"></div><div class="field"><label>Notes</label><textarea name="notes"></textarea></div><button class="btn p" type="submit" style="margin-top:10px">Save lead</button></form></div>';return h}
function rFloor(){let h=head("floor","Each desk shows the agent's real state from the database. Animation means a task is running; it is not proof of work.")+errNote()+floorHtml(false);
 h+='<div class="grid g2" style="margin-top:12px"><div class="card"><h3>Task queue</h3>'+(S.tasks.length?S.tasks.slice(0,30).map(t=>'<div class="row"><span class="pill">'+esc(t.agent_id)+'</span><div class="t"><b>'+esc(t.title)+'</b><small>'+esc(t.result||t.error||t.details||"")+' · attempts '+esc(t.attempts)+'</small></div><span class="pill '+(t.status==="done"?"good":t.status==="failed"?"bad":"warn")+'">'+esc(t.status)+'</span>'+(t.status==="failed"?'<button class="btn sm" data-retry="'+esc(t.id)+'">Retry</button>':'')+'</div>').join(""):'<div class="empty"><b>No tasks queued</b></div>')+'</div>';
 h+='<div class="card"><h3>Assign a task</h3><form id="taskForm"><div class="field"><label>Agent</label><select name="agent_id">'+S.agents.map(a=>'<option value="'+a.id+'">'+esc(a.name+" — "+a.role)+'</option>').join("")+'</select></div><div class="field"><label>Title</label><input name="title" required minlength="2"></div><div class="field"><label>Details</label><textarea name="details"></textarea></div><button class="btn p" type="submit" style="margin-top:10px">Queue task</button><p class="dim small" style="margin-top:8px">The worker claims it within seconds. Agents without a configured provider report "not configured" instead of pretending.</p></form></div></div>';return h}
function rOutreach(){const st=S.status||{},se=S.settings||{};let h=head("outreach","Every email waits here for your OK unless autosend is on. The sending gates run again at send time.");h+=errNote();
 h+='<div class="grid g4">'+tile((st.sent_today||0)+" / "+(st.daily_email_cap||0),"Sent today")+tile(st.drafts_ready||0,"Ready for OK","",st.drafts_ready?"hot":"")+tile(st.drafts_approved||0,"Approved, waiting")+tile(se.auto_send?"ON":"OFF","Autosend")+'</div>';
 if(!se.mailing_address)h+='<div class="note bad" style="margin-top:12px"><b>Nothing can be sent yet:</b> add a mailing address in Settings.</div>';
 if(se.dry_run)h+='<div class="note warn" style="margin-top:12px"><b>Dry run is on.</b> Drafts are written and stored; nothing is sent.</div>';
 const tabs=[["ready","Ready"],["approved","Approved"],["sent","Sent"],["draft","Drafts"],["rejected","Rejected"],["failed","Failed"],["suppression","Suppression"]];
 h+='<div class="chips" style="margin-top:12px">'+tabs.map(t=>'<button class="chip '+(S.otab===t[0]?"on":"")+'" data-otab="'+t[0]+'">'+t[1]+'</button>').join("")+'</div>';
 if(S.otab==="suppression"){h+='<div class="card"><form id="supForm" class="inline"><input name="value" placeholder="email or business" required style="flex:1;min-width:200px;min-height:40px;padding:8px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--sunk);color:var(--text)"><button class="btn sm" type="submit">Never contact</button></form>'+(S.suppression.length?S.suppression.map(s=>'<div class="row"><div class="t"><b>'+esc(s.email||s.business_name)+'</b><small>'+esc(s.reason)+' · '+esc(s.by_who)+'</small></div><button class="btn sm" data-unsup="'+esc(s.id)+'">Remove</button></div>').join(""):'<div class="empty" style="margin-top:10px"><b>Empty</b></div>')+'</div>';return h}
 const list=S.drafts.filter(d=>["outreach","followup","breakup","content"].includes(d.kind)&&d.status===S.otab);
 h+=list.length?list.map(d=>{const lead=S.leads.find(l=>l.id===d.lead_id)||{};const qa=d.qa||{};return '<div class="card" style="margin-bottom:12px"><h3>'+esc(d.title)+'<span class="sp">'+esc(d.kind)+(qa.score!=null?' · QA '+qa.score:'')+' · '+esc(d.workflow_version||"")+'</span></h3><div class="kv"><dt>To</dt><dd>'+esc(lead.contact_email||"(no email)")+'</dd><dt>Subject</dt><dd><b>'+esc(d.subject)+'</b></dd></div><pre class="body">'+esc(d.body)+'</pre>'+((qa.levers||[]).length||(qa.flags||[]).length?'<div class="inline" style="margin-top:8px">'+(qa.levers||[]).map(l=>'<span class="pill signal">'+esc(l)+'</span>').join("")+(qa.flags||[]).map(f=>'<span class="pill warn">'+esc(f)+'</span>').join("")+'</div>':'')+(d.error?'<div class="note bad" style="margin-top:8px">'+esc(d.error)+'</div>':'')+(d.evidence&&d.evidence.message_id?'<p class="small dim" style="margin-top:8px">Sent '+esc(d.evidence.sent_at)+' · message id '+esc(d.evidence.message_id)+'</p>':'')+'<div class="inline" style="margin-top:10px">'+(d.status==="ready"||d.status==="draft"?'<button class="btn sm good" data-approve="'+esc(d.id)+'">Approve</button><button class="btn sm bad" data-reject="'+esc(d.id)+'">Reject</button>':'')+(d.status==="approved"?'<button class="btn sm" data-sendnow="'+esc(d.id)+'">Try to send now</button>':'')+'</div></div>'}).join(""):'<div class="empty"><b>Nothing here</b></div>';return h}
function rStudio(){const briefs=S.drafts.filter(d=>d.kind==="script");let h=head("studio","Nova's briefs. You film; nothing is published by the server.")+errNote();h+=briefs.length?briefs.map(d=>'<div class="card" style="margin-bottom:12px"><h3>'+esc(d.title)+'<span class="sp">'+esc(d.status)+'</span></h3><pre class="body">'+esc(d.body)+'</pre></div>').join(""):'<div class="empty"><b>No briefs yet</b>Nova writes one on Monday and Thursday runs when an AI provider is configured.</div>';return h}
function rLearning(){let h=head("learning","Lessons with numbers, and workflow versions tested against real sends.")+errNote();
 h+='<div class="grid g2"><div class="card"><h3>Lessons</h3>'+(S.lessons.length?S.lessons.map(l=>'<div class="row"><div class="t"><b>'+esc(l.title)+'</b><small>'+esc(l.observation)+(l.evidence?' · '+esc(l.evidence):'')+'</small></div><span class="pill">'+esc(l.confidence)+'</span></div>').join(""):'<div class="empty"><b>No lessons yet</b>They start after 20 real sends.</div>')+'<form id="lessonForm" style="margin-top:10px"><div class="field"><label>Lesson</label><input name="title" required minlength="2"></div><div class="field"><label>What happened</label><textarea name="observation" required></textarea></div><div class="field"><label>The number</label><input name="evidence"></div><div class="field"><label>Confidence</label><input name="confidence" type="number" min="0" max="100" value="60"></div><button class="btn p" type="submit" style="margin-top:10px">Save lesson</button></form></div>';
 h+='<div class="card"><h3>Workflow versions <span class="sp">active '+esc((S.settings||{}).workflow_version||"v1")+'</span></h3>'+(S.workflow.length?S.workflow.map(w=>'<div class="row"><div class="t"><b>'+esc(w.version)+' · '+esc(w.stage)+'</b><small>'+esc(w.change)+' · predicted: '+esc(w.prediction||"")+(w.result&&w.result.current?' · observed '+esc(w.result.current.rate)+'% vs '+esc(w.result.baseline.rate)+'%':'')+'</small></div><span class="pill '+(w.verdict==="adopted"?"good":w.verdict==="rolled back"?"bad":"warn")+'">'+esc(w.verdict)+'</span>'+(w.verdict==="testing"?'<button class="btn sm" data-eval="'+esc(w.version)+'">Evaluate</button><button class="btn sm bad" data-rollback="'+esc(w.version)+'">Roll back</button>':'')+'</div>').join(""):'<div class="empty"><b>No versions proposed</b></div>')+'<form id="wfForm" style="margin-top:10px"><div class="field"><label>Stage</label><input name="stage" required placeholder="echo"></div><div class="field"><label>Change</label><textarea name="change" required></textarea></div><div class="field"><label>Prediction</label><input name="prediction" placeholder="reply rate +3 points"></div><button class="btn" type="submit" style="margin-top:10px">Propose and start testing</button></form></div></div>';return h}
function rAnalytics(){const st=S.status||{leads_by_status:{}};const sent=S.drafts.filter(d=>d.status==="sent").length;const rep=S.leads.filter(l=>["Replied","Meeting","Client"].includes(l.status)).length;let h=head("analytics","Counts from the database. Revenue is active clients times plan.")+errNote();
 h+='<div class="grid g4">'+tile(st.leads||0,"Leads")+tile(sent,"Emails sent","with message ids")+tile(sent?Math.round(rep/sent*1000)/10+"%":"–","Reply rate",sent<20?"needs 20+ sends":"")+tile("$"+(st.monthly_revenue||0),"Monthly revenue",(st.clients||0)+" clients")+'</div>';
 h+='<div class="card" style="margin-top:12px"><h3>Pipeline</h3>'+Object.keys(st.leads_by_status||{}).map(k=>'<div class="row"><div class="t"><small>'+esc(k)+'</small></div><b>'+esc(st.leads_by_status[k])+'</b></div>').join("")+'</div>';
 if(S.usage)h+='<div class="card" style="margin-top:12px"><h3>AI usage</h3><div class="kv"><dt>Calls</dt><dd>'+esc(S.usage.calls)+'</dd><dt>Tokens in / out</dt><dd>'+esc(S.usage.input_tokens)+' / '+esc(S.usage.output_tokens)+'</dd><dt>Estimated cost</dt><dd>'+(S.usage.estimated_cost_usd==null?"unknown (set the price env vars)":"$"+S.usage.estimated_cost_usd)+'</dd></div></div>';return h}
function sw(k,l,on,d){return '<div class="sw"><div class="t"><b>'+l+'</b><small>'+d+'</small></div><button class="toggle" role="switch" aria-checked="'+(!!on)+'" data-sw="'+k+'" aria-label="'+l+'"></button></div>'}
function rSettings(){const se=S.settings||{};const st=S.status||{providers:{ai:{},research:{},email:{}}};let h=head("settings","Switches only you flip, caps the worker obeys, and what is actually connected.")+errNote();
 h+='<div class="grid g2"><div class="card"><h3>Operating mode</h3>'+sw("paused","Pause all",se.paused,"The worker stops claiming tasks. Nothing is sent or researched.")+sw("dry_run","Dry run",se.dry_run,"On: drafts only, nothing sent. Turning it off needs an email provider.")+sw("auto_send","Autosend",se.auto_send,"On: QA-passed emails go out by themselves inside the cap and window. Needs dry run off and a mailing address.")+'</div>';
 h+='<div class="card"><h3>Access token</h3><p class="small muted">State-changing calls need the server\'s RIDGELINE_TOKEN once the office is exposed beyond localhost. Stored only in this browser.</p><form id="tokenForm"><div class="field"><label>Token</label><input name="token" type="password" value="'+esc(token())+'"></div><button class="btn" type="submit" style="margin-top:10px">Save in this browser</button></form></div></div>';
 h+='<div class="card" style="margin-top:12px"><h3>Caps and voice</h3><form id="settingsForm"><div class="grid g4"><div class="field"><label>Emails a day (1-20)</label><input name="daily_email_cap" type="number" min="1" max="20" value="'+esc(se.daily_email_cap)+'"></div><div class="field"><label>Days between touches</label><input name="follow_up_days" type="number" min="2" max="14" value="'+esc(se.follow_up_days)+'"></div><div class="field"><label>Max touches</label><input name="max_touches" type="number" min="1" max="3" value="'+esc(se.max_touches)+'"></div><div class="field"><label>Score gate</label><input name="score_gate" type="number" min="0" max="100" value="'+esc(se.score_gate)+'"></div><div class="field"><label>Founding spots left</label><input name="founding_spots" type="number" min="0" value="'+esc(se.founding_spots)+'"></div><div class="field"><label>Day Shift time</label><input name="day_shift_time" value="'+esc(se.day_shift_time)+'"></div><div class="field"><label>Send window</label><input name="send_window" value="'+esc(se.send_window)+'"></div><div class="field"><label>From name</label><input name="from_name" value="'+esc(se.from_name)+'"></div></div><div class="grid g2"><div class="field"><label>Signature</label><textarea name="signature">'+esc(se.signature)+'</textarea></div><div class="field"><label>Opt-out line</label><textarea name="opt_out_line">'+esc(se.opt_out_line)+'</textarea></div></div><div class="field"><label>Mailing address (required by law in every email)</label><input name="mailing_address" value="'+esc(se.mailing_address)+'"></div><div class="field"><label>Targets (JSON list)</label><textarea name="targets">'+esc(JSON.stringify(se.targets||[]))+'</textarea></div><button class="btn p" type="submit" style="margin-top:10px">Save</button></form></div>';
 h+='<div class="card" style="margin-top:12px"><h3>Health</h3><div class="kv"><dt>Database</dt><dd>'+esc((S.health||{}).database||"")+'</dd><dt>Worker</dt><dd>'+esc((S.health||{}).worker||"")+'</dd><dt>Scheduler</dt><dd>'+esc((S.health||{}).scheduler||"")+'</dd><dt>AI</dt><dd>'+esc(st.providers.ai.name)+' · '+(st.providers.ai.configured?"configured":"not configured")+'</dd><dt>Research</dt><dd>'+esc(st.providers.research.name)+' · '+(st.providers.research.configured?"configured":"not configured")+'</dd><dt>Email</dt><dd>'+esc(st.providers.email.name)+' · '+(st.providers.email.configured?"configured":"not configured")+'</dd><dt>Backups</dt><dd>'+esc(((S.health||{}).backups||[]).slice(-3).join(", ")||"none yet")+'</dd></div><div class="inline" style="margin-top:10px"><button class="btn sm" data-act="backup">Back up now</button></div></div>';return h}
document.addEventListener("click",async e=>{const b=e.target.closest("button,a");if(!b)return;try{
 if(b.matches(".rail a,.brand")){e.preventDefault();go(b.getAttribute("href").slice(1));return}
 if(b.dataset.go){go(b.dataset.go);return}
 if(b.id==="pauseBtn"){await api(S.status&&S.status.paused?"/api/resume":"/api/pause",{method:"POST"});toast(S.status&&S.status.paused?"Resumed":"Paused");return refresh()}
 if(b.dataset.filter){S.leadFilter=b.dataset.filter;return render()}
 if(b.dataset.otab){S.otab=b.dataset.otab;return render()}
 if(b.dataset.act==="addlead"){const c=$("#addLeadCard");c.style.display=c.style.display==="none"?"block":"none";return}
 if(b.dataset.act==="run"){const r=await api("/api/run-day-shift",{method:"POST"});toast("Started "+r.run_id);return refresh()}
 if(b.dataset.act==="backup"){const r=await api("/api/backup",{method:"POST"});toast("Backup "+r.file);return refresh()}
 if(b.dataset.approve){const r=await api("/api/drafts/"+b.dataset.approve+"/approve",{method:"POST"});toast(r.note||"Approved");return refresh()}
 if(b.dataset.reject){await api("/api/drafts/"+b.dataset.reject+"/reject",{method:"POST"});toast("Rejected");return refresh()}
 if(b.dataset.sendnow){const r=await api("/api/drafts/"+b.dataset.sendnow+"/send-now",{method:"POST"});toast(r.sent?"Sent":"Blocked: "+r.reasons.join("; "));return refresh()}
 if(b.dataset.retry){await api("/api/tasks/"+b.dataset.retry+"/retry",{method:"POST"});toast("Queued again");return refresh()}
 if(b.dataset.unsup){await api("/api/suppression/"+b.dataset.unsup,{method:"DELETE"});toast("Removed");return refresh()}
 if(b.dataset.eval){const r=await api("/api/workflow/"+b.dataset.eval+"/evaluate",{method:"POST"});toast(r.verdict+(r.note?" · "+r.note:""));return refresh()}
 if(b.dataset.rollback){await api("/api/workflow/"+b.dataset.rollback+"/rollback",{method:"POST"});toast("Rolled back");return refresh()}
 if(b.dataset.sw){const k=b.dataset.sw;const v=b.getAttribute("aria-checked")!=="true";await api("/api/settings",{method:"POST",body:JSON.stringify({key:k,value:v?"true":"false"})});toast("Saved");return refresh()}
}catch(err){toast(err.message)}});
document.addEventListener("change",async e=>{const t=e.target;if(t.dataset.leadstatus){try{await api("/api/leads/"+t.dataset.leadstatus+"/status?status_value="+encodeURIComponent(t.value),{method:"PATCH"});toast("Status: "+t.value);refresh()}catch(err){toast(err.message)}}});
document.addEventListener("submit",async e=>{e.preventDefault();const f=e.target;const d=Object.fromEntries(new FormData(f).entries());try{
 if(f.id==="leadForm"){await api("/api/leads",{method:"POST",body:JSON.stringify(d)});toast("Lead saved");f.reset();return refresh()}
 if(f.id==="taskForm"){const r=await api("/api/tasks",{method:"POST",body:JSON.stringify(d)});toast(r.note||"Queued");f.reset();return refresh()}
 if(f.id==="lessonForm"){d.confidence=Number(d.confidence||50);await api("/api/lessons",{method:"POST",body:JSON.stringify(d)});toast("Lesson saved");f.reset();return refresh()}
 if(f.id==="wfForm"){const r=await api("/api/workflow",{method:"POST",body:JSON.stringify(d)});toast(r.note||"Proposed");f.reset();return refresh()}
 if(f.id==="supForm"){await api("/api/suppression",{method:"POST",body:JSON.stringify({value:d.value})});toast("Added");f.reset();return refresh()}
 if(f.id==="tokenForm"){try{localStorage.setItem("ro.token",d.token||"")}catch(err){}toast("Token saved in this browser");return refresh()}
 if(f.id==="settingsForm"){for(const k of Object.keys(d)){await api("/api/settings",{method:"POST",body:JSON.stringify({key:k,value:String(d[k])})})}toast("Saved");return refresh()}
}catch(err){toast(err.message)}});
const h=location.hash.slice(1);if(PAGES.some(x=>x[0]===h))S.page=h;render();refresh();setInterval(refresh,10000);
})();
</script>
</body>
