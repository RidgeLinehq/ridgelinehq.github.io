<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ridgeline Office</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: an ops console. Fixed header with the five lights, a left rail on desktop / bottom bar on
   phone, pages that scroll. The office floor is a CSS grid of SVG desks over a marked floor. */
:root{
  color-scheme:dark;
  --bg:#0b141d; --bg2:#0e1a26; --surface:#121f2d; --raised:#182a3b; --sunk:#08111a;
  --line:rgba(159,176,192,.16); --line2:rgba(159,176,192,.32);
  --text:#eef3f7; --mist:#a7b6c4; --dim:#7b8b9a;
  --ember:#ff8a2a; --ember2:#ffa857; --ember-ink:#1a1008; --ember-soft:rgba(255,138,42,.14);
  --signal:#7dd3ff; --signal-soft:rgba(125,211,255,.14);
  --good:#4fd18b; --good-soft:rgba(79,209,139,.14);
  --warn:#ffb020; --warn-soft:rgba(255,176,32,.16);
  --bad:#ff6b6b; --bad-soft:rgba(255,107,107,.16);
  --display:Archivo,"Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:12px; --r2:18px; --ease:cubic-bezier(.16,1,.3,1);
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --floor:#0d1823; --floor-line:rgba(159,176,192,.07); --desk:#1d3144; --desk2:#243b52; --wood:#2b3e52;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#f1f4f7; --bg2:#e9eef3; --surface:#ffffff; --raised:#f6f8fa; --sunk:#e4e9ee;
  --line:rgba(21,33,44,.12); --line2:rgba(21,33,44,.24);
  --text:#15212c; --mist:#4b5b6b; --dim:#75848f;
  --ember:#e8731a; --ember2:#f0893a; --ember-ink:#fff8f2; --ember-soft:rgba(232,115,26,.12);
  --signal:#1f7fc4; --signal-soft:rgba(31,127,196,.12);
  --good:#1f9a5c; --good-soft:rgba(31,154,92,.12);
  --warn:#c77a00; --warn-soft:rgba(199,122,0,.14);
  --bad:#d23c3c; --bad-soft:rgba(210,60,60,.12);
  --shadow:0 14px 40px rgba(21,33,44,.14);
  --floor:#e3e9ef; --floor-line:rgba(21,33,44,.07); --desk:#cfd9e3; --desk2:#bfccd8; --wood:#b9c6d2;
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f1f4f7; --bg2:#e9eef3; --surface:#ffffff; --raised:#f6f8fa; --sunk:#e4e9ee;
  --line:rgba(21,33,44,.12); --line2:rgba(21,33,44,.24);
  --text:#15212c; --mist:#4b5b6b; --dim:#75848f;
  --ember:#e8731a; --ember2:#f0893a; --ember-ink:#fff8f2; --ember-soft:rgba(232,115,26,.12);
  --signal:#1f7fc4; --signal-soft:rgba(31,127,196,.12);
  --good:#1f9a5c; --good-soft:rgba(31,154,92,.12);
  --warn:#c77a00; --warn-soft:rgba(199,122,0,.14);
  --bad:#d23c3c; --bad-soft:rgba(210,60,60,.12);
  --shadow:0 14px 40px rgba(21,33,44,.14);
  --floor:#e3e9ef; --floor-line:rgba(21,33,44,.07); --desk:#cfd9e3; --desk2:#bfccd8; --wood:#b9c6d2;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3,h4,p,ul{margin:0}
h1,h2,h3,h4,.display{font-family:var(--display);font-weight:800;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:where(a,button,summary,input,select,textarea,[tabindex]):focus-visible{outline:3px solid var(--signal);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-variant-numeric:tabular-nums}

/* ---------- app frame ---------- */
.app{min-height:100%;display:grid;grid-template-rows:auto 1fr auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;min-height:60px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:900;font-size:17px;letter-spacing:-.02em;white-space:nowrap}
.brand svg{width:30px;height:30px;flex:none}
.brand small{display:block;font-family:var(--body);font-weight:600;font-size:11px;color:var(--dim);letter-spacing:.02em;line-height:1}
.lights{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.light{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;font-size:11px;font-weight:700;color:var(--mist);background:var(--surface)}
.light i{width:8px;height:8px;border-radius:50%;background:var(--dim);box-shadow:0 0 0 3px transparent;flex:none}
.light[data-l="green"] i{background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.light[data-l="yellow"] i{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.light[data-l="red"] i{background:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.mode{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-family:var(--display);font-weight:800;font-size:11px;letter-spacing:.04em;border:1px solid var(--line2);background:var(--raised);white-space:nowrap}
.mode[data-m="dry"]{color:var(--warn);border-color:rgba(255,176,32,.5)}
.mode[data-m="live"]{color:var(--good);border-color:rgba(79,209,139,.5)}
.mode[data-m="paused"]{color:var(--bad);border-color:rgba(255,107,107,.5)}
.mode[data-m="off"]{color:var(--dim)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:8px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--raised);font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:-.01em;transition:transform .15s var(--ease),background .15s,border-color .15s;white-space:nowrap}
.btn:hover{border-color:var(--line2);background:color-mix(in srgb,var(--raised) 80%,var(--text) 6%)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.p{background:linear-gradient(135deg,var(--ember2),var(--ember));color:var(--ember-ink);border-color:transparent;box-shadow:0 8px 22px rgba(255,138,42,.25)}
.btn.good{color:var(--good);border-color:rgba(79,209,139,.45);background:var(--good-soft)}
.btn.bad{color:var(--bad);border-color:rgba(255,107,107,.45);background:var(--bad-soft)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.block{width:100%}
.btn svg{width:16px;height:16px;flex:none}

.body{display:grid;grid-template-columns:220px 1fr;min-width:0}
.rail{border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:calc(60px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 60px - env(safe-area-inset-top,0px));overflow:auto;padding-left:max(10px,env(safe-area-inset-left,0px))}
.rail a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-weight:700;font-size:14px;color:var(--mist);text-decoration:none}
.rail a svg{width:18px;height:18px;flex:none;color:var(--dim)}
.rail a[aria-current="page"]{background:var(--ember-soft);color:var(--text)}
.rail a[aria-current="page"] svg{color:var(--ember)}
.rail .cnt{margin-left:auto;font-size:11px;font-weight:800;background:var(--ember);color:var(--ember-ink);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.main{min-width:0;padding-block:18px 100px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{display:none;max-width:1120px;margin-inline:auto}
.page.on{display:block}
.tabs{display:none}
@media(max-width:860px){
  .body{grid-template-columns:1fr}
  .rail{display:none}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:6px 2px;font-size:10.5px;font-weight:700;color:var(--dim);border-radius:10px;position:relative}
  .tabs button svg{width:22px;height:22px}
  .tabs button[aria-current="page"]{color:var(--ember)}
  .tabs .cnt{position:absolute;top:2px;right:calc(50% - 20px);font-size:10px;font-weight:800;background:var(--ember);color:var(--ember-ink);border-radius:999px;padding:0 5px;min-width:16px;text-align:center}
  .lights{display:none}
  .top .btn.pause{display:none}
}
.sheet-nav{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.45);display:none;align-items:flex-end}
.sheet-nav.on{display:flex}
.sheet-nav .in{width:100%;background:var(--surface);border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line2)}
.sheet-nav a{display:flex;align-items:center;gap:12px;padding:14px 6px;border-bottom:1px solid var(--line);font-family:var(--display);font-weight:800;font-size:17px;text-decoration:none}
.sheet-nav a svg{width:20px;height:20px;color:var(--ember)}
.sheet-nav .lights{display:flex;margin:10px 0 4px;justify-content:flex-start}

/* ---------- page bits ---------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h2{font-size:clamp(22px,3vw,28px)}
.head p{color:var(--mist);font-size:14px;margin-top:4px;max-width:62ch}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.g3,.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
@media(max-width:420px){.g3,.g4{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:16px;min-width:0}
.card h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .sp{margin-left:auto;font-family:var(--body);font-weight:600;font-size:12px;color:var(--dim)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px;min-width:0}
.tile b{display:block;font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.tile span{display:block;color:var(--mist);font-size:12.5px;font-weight:600;margin-top:4px}
.tile small{display:block;color:var(--dim);font-size:11.5px;margin-top:3px}
.tile.hot{border-color:rgba(255,138,42,.45);background:linear-gradient(160deg,var(--ember-soft),var(--surface) 70%)}
.tile.hot b{color:var(--ember2)}
.list{display:grid;gap:0}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .t small{display:block;color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row>small,.row>.pill,.row>.btn,.row>.copy{flex:none}
.row.click{cursor:pointer}
.row.click:hover .t b{color:var(--ember2)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.02em;background:var(--raised);color:var(--mist);border:1px solid var(--line);white-space:nowrap}
.pill.good{color:var(--good);background:var(--good-soft);border-color:transparent}
.pill.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.pill.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.pill.ember{color:var(--ember2);background:var(--ember-soft);border-color:transparent}
.pill.signal{color:var(--signal);background:var(--signal-soft);border-color:transparent}
.empty{padding:22px 14px;text-align:center;color:var(--mist);font-size:14px;border:1px dashed var(--line2);border-radius:var(--r)}
.empty b{display:block;color:var(--text);font-family:var(--display);font-size:15px;margin-bottom:4px}
.muted{color:var(--mist)}.dim{color:var(--dim)}.small{font-size:12.5px}
.score{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;font-family:var(--display);font-weight:900;font-size:15px;background:var(--raised);border:1px solid var(--line);flex:none;font-variant-numeric:tabular-nums}
.score[data-s="hi"]{color:var(--good);border-color:rgba(79,209,139,.4)}
.score[data-s="mid"]{color:var(--warn);border-color:rgba(255,176,32,.4)}
.score[data-s="lo"]{color:var(--dim)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 10px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font-size:12.5px;font-weight:700;color:var(--mist)}
.chip[aria-pressed="true"]{background:var(--ember-soft);color:var(--text);border-color:rgba(255,138,42,.5)}
.chip .n{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.field{margin-top:10px}
.field label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;min-height:42px;padding:9px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--sunk);color:var(--text)}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--ember);box-shadow:0 0 0 4px var(--ember-soft)}
.field .hint{color:var(--dim);font-size:12px;margin-top:4px}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.sw .t b{display:block;font-weight:700}.sw .t small{display:block;color:var(--dim);font-size:12px;max-width:52ch}
.toggle{width:50px;height:30px;border-radius:999px;border:1px solid var(--line2);background:var(--sunk);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--dim);transition:transform .2s var(--ease),background .2s}
.toggle[aria-checked="true"]{background:var(--ember);border-color:var(--ember)}
.toggle[aria-checked="true"]::after{transform:translateX(20px);background:#fff}
.toggle:disabled{opacity:.5;cursor:not-allowed}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--warn-soft);border:1px solid rgba(255,176,32,.4);font-size:13px;margin-top:8px}
.note{padding:10px 12px;border-radius:10px;font-size:13px;background:var(--raised);border:1px solid var(--line)}
.note.warn{background:var(--warn-soft);border-color:rgba(255,176,32,.35)}
.note.bad{background:var(--bad-soft);border-color:rgba(255,107,107,.35)}
.note.good{background:var(--good-soft);border-color:rgba(79,209,139,.35)}
pre.body{white-space:pre-wrap;font:inherit;margin:8px 0 0;padding:12px;border-radius:10px;background:var(--sunk);border:1px solid var(--line);font-size:14px;line-height:1.55;max-height:320px;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--raised);border:1px solid var(--line2);color:var(--text);padding:10px 14px;border-radius:12px;font-weight:700;font-size:13.5px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .25s var(--ease);z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.copy{min-height:30px;padding:3px 9px;border-radius:7px;border:1px solid var(--line2);background:var(--raised);font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.copy svg{width:13px;height:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.kv dt{color:var(--dim);font-weight:600}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.why{list-style:none;padding:0;display:grid;gap:4px;font-size:13px}
.why li{display:flex;gap:8px;align-items:flex-start}.why li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--good);flex:none;margin-top:7px}
.why li.neg::before{background:var(--bad)}
.stripe{border-left:3px solid var(--line2);padding-left:10px}
.stripe.ready{border-color:var(--warn)}.stripe.sent{border-color:var(--good)}.stripe.rej{border-color:var(--bad)}.stripe.draft{border-color:var(--dim)}

/* ---------- calls (V8) ---------- */
.callcta{width:100%;text-align:left;background:var(--surface);border:1px solid rgba(79,209,139,.45);border-radius:var(--r2);padding:14px 16px;margin-top:12px;gap:12px}
.crow .crank{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:13px;background:var(--raised);border:1px solid var(--line);flex:none}
.crow .t small.ai-bad{color:var(--ember2);font-weight:600}
.crow .t small.ai-unk{color:var(--dim)}
.tel{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--good-soft);color:var(--good);border:1px solid rgba(79,209,139,.45);text-decoration:none}
.tel svg{width:20px;height:20px}
a.tel-big{min-height:54px;font-size:17px;text-decoration:none;background:linear-gradient(135deg,#3fc47f,var(--good));color:#06140b;border-color:transparent;box-shadow:0 8px 22px rgba(79,209,139,.25)}
a.tel-big svg{width:18px;height:18px}
.say p{margin:0 0 8px;padding:12px 14px;border-radius:12px;background:var(--raised);border:1px solid var(--line);font-size:15.5px;line-height:1.5}
.say p:last-child{margin-bottom:0}
.obj{border-bottom:1px solid var(--line)}
.obj summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px;font-weight:700;font-size:14px}
.obj summary::-webkit-details-marker{display:none}
.obj summary::after{content:"+";color:var(--dim);font-size:18px;flex:none}
.obj[open] summary::after{content:"\2212"}
.obj p{padding:0 0 12px;color:var(--mist);font-size:14px;line-height:1.5}
.outc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.outc .btn{min-height:52px;white-space:normal;line-height:1.2;text-align:center}
.cbpick{display:grid;gap:8px;margin-top:10px;padding:12px;border-radius:12px;background:var(--raised);border:1px solid var(--line)}
.cbpick .chips .chip{min-height:40px;display:inline-flex;align-items:center}
.then{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:3px;font-size:12px;color:var(--dim)}
.then li b{color:var(--mist);font-weight:700}

/* ---------- office floor ---------- */
.floor{position:relative;border:1px solid var(--line2);border-radius:var(--r2);padding:18px 14px 14px;overflow:hidden;
  background:
    radial-gradient(600px 300px at 50% 0%,rgba(255,138,42,.08),transparent 70%),

async function callOutcome(id,k,extra){

  else if(k==="not_interested"){patch.status="Not a fit";patch.nextCallAt=null;patch.followUp={kind:"close_lead",status:"done",requestedAt:t,doneAt:t,by:"calls screen"};msg="Not a fit. No more calls or emails."}
  else if(k==="call_back"){if(!extra.nextAt)return;patch.nextCallAt=extra.nextAt;msg="Call back "+fmtT(extra.nextAt)}

  else if(k==="do_not_call"){patch.status="Suppressed";patch.nextCallAt=null;patch.callDone=true;await setDoc("suppression/"+slug(l.contactEmail||l.businessName),{email:l.contactEmail||"",businessName:l.businessName,reason:"asked on call",by:"grayson",at:t});msg="Suppressed. Never contacted again."}
  if(await updDoc("leads/"+id,patch)){toast(msg);event("Grayson","Call "+label+": "+l.businessName+(extra.email?" ("+extra.email+")":"")+(extra.nextAt?" at "+fmtT(extra.nextAt):""));S.cb={};closeDrawer()}
}

  if(v.hook)h+='<p style="font-family:var(--display);font-weight:800;font-size:17px;margin-bottom:8px">“'+esc(v.hook)+'”</p>';
  if(Array.isArray(v.lines)&&v.lines.length)h+='<div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;min-width:480px;font-size:13.5px"><thead><tr><th style="text-align:left;padding:6px 8px;color:var(--dim)">Sec</th><th style="text-align:left;padding:6px 8px;color:var(--dim)">You say</th><th style="text-align:left;padding:6px 8px;color:var(--dim)">Pop-up</th></tr></thead><tbody>'+v.lines.map(l=>'<tr><td class="mono" style="padding:6px 8px;border-top:1px solid var(--line);white-space:nowrap">'+esc(l.second)+'</td><td style="padding:6px 8px;border-top:1px solid var(--line)">'+esc(l.say)+'</td><td style="padding:6px 8px;border-top:1px solid var(--line);color:var(--ember2);font-weight:700">'+esc(l.popup||"")+'</td></tr>').join("")+'</tbody></table></div>';

  if(d.status==="filmed")h+='<button class="btn sm good" type="button" data-vstatus="posted" data-id="'+esc(d.id)+'">Mark posted</button>';
  if(d.status==="posted")h+='<form class="inline" data-vres="'+esc(d.id)+'"><label class="small" for="vv-'+esc(d.id)+'">Views</label><input id="vv-'+esc(d.id)+'" type="number" inputmode="numeric" min="0" style="width:90px;min-height:32px;padding:4px 8px;border-radius:8px;border:1px solid var(--line2);background:var(--sunk);color:var(--text)" value="'+esc((v.results||{}).views||"")+'"><label class="small" for="vc-'+esc(d.id)+'">Clicks</label><input id="vc-'+esc(d.id)+'" type="number" inputmode="numeric" min="0" style="width:80px;min-height:32px;padding:4px 8px;border-radius:8px;border:1px solid var(--line2);background:var(--sunk);color:var(--text)" value="'+esc((v.results||{}).clicks||"")+'"><button class="btn sm" type="submit">Save numbers</button></form>';
  h+='</div></div>';return h;
}

function rAnalytics(){
  const c=counts();
  const sent=S.drafts.filter(d=>d.status==="sent").length;const replied=S.leads.filter(l=>["Replied","Meeting","Client"].includes(l.status)).length;
  const rate=sent?Math.round(replied/sent*1000)/10:null;
  let h=pageHead("analytics","Counts from the database only. Revenue is clients times their plan; nothing is estimated.");
  h+=dbBanner();
  h+='<div class="grid g4">'+tile(S.leads.length,"Leads found","all time")+tile(sent,"Emails sent","with Gmail proof")+tile(rate==null?"–":rate+"%","Reply rate",sent<20?"needs 20+ sends":"replies ÷ sent")+tile("$"+c.revenue,"Monthly revenue",S.clients.length+" client"+(S.clients.length===1?"":"s"),c.revenue?"hot":"")+'</div>';
  h+='<div class="grid g2" style="margin-top:12px"><div class="card"><h3>Pipeline</h3><div class="list">'+LEAD_STATUS.map(s=>{const n=c.by[s]||0;const max=Math.max(1,...LEAD_STATUS.map(x=>c.by[x]||0));return '<div class="row"><div class="t" style="flex:0 0 96px"><small style="color:var(--mist)">'+esc(s)+'</small></div><div style="flex:1;height:10px;border-radius:5px;background:var(--sunk);overflow:hidden"><div style="height:100%;width:'+(n/max*100)+'%;background:'+(s==="Client"?"var(--good)":s==="Suppressed"||s==="Not a fit"?"var(--dim)":"var(--ember)")+'"></div></div><b class="mono" style="width:30px;text-align:right">'+n+'</b></div>'}).join("")+'</div></div>';
  h+='<div class="card"><h3>Last 14 days <span class="sp">sent · replies</span></h3>'+barsHtml()+'</div></div>';
  h+='<div class="card" style="margin-top:12px"><h3>Clients <span class="sp">'+S.clients.length+'</span></h3>'+(S.clients.length?'<div class="list">'+S.clients.map(k=>{const done=(k.work||[]).filter(w=>w.status==="done").length;return '<div class="row click" data-client="'+esc(k.id)+'"><div class="t"><b>'+esc(k.businessName)+'</b><small>'+esc(k.town||"")+' · $'+esc(k.monthly)+'/mo · since '+esc(fmtT(k.startedAt))+' · reviews '+esc(k.reviewsAtStart==null?"?":k.reviewsAtStart)+' → '+esc(k.reviewsNow==null?"?":k.reviewsNow)+' · '+done+'/'+CLIENT_WORK.length+' done</small></div><span class="pill '+(k.status==="active"?"good":"")+'">'+esc(k.status||"")+'</span></div>'}).join("")+'</div>':'<div class="empty"><b>No clients yet</b>Sage creates a client the moment a Stripe payment lands in the Ridgeline Gmail. You can also add one by hand.</div>')+'<details style="margin-top:10px"><summary class="small muted" style="cursor:pointer">Add a client by hand</summary><form id="addClientForm"><div class="grid g2"><div class="field"><label for="acName">Business</label><input id="acName" required></div><div class="field"><label for="acEmail">Email</label><input id="acEmail" type="email"></div><div class="field"><label for="acTown">Town, ST</label><input id="acTown" placeholder="Cabot, AR"></div><div class="field"><label for="acMonthly">Monthly $</label><input id="acMonthly" type="number" inputmode="numeric" value="147"></div></div><button class="btn sm p" type="submit" style="margin-top:8px">Save client</button></form></details></div>';
  return h;
}
function barsHtml(){
  const days=[];for(let i=13;i>=0;i--){const d=new Date(Date.now()-i*86400000);days.push(dayKey(d))}
  const by={};S.stats.forEach(s=>by[s.day||s.id]=s);
  const sent=days.map(d=>{const s=by[d];if(s&&s.sent!=null)return Number(s.sent)||0;return S.drafts.filter(x=>x.status==="sent"&&x.evidence&&dayKey(x.evidence.sentAt)===d).length});
  const rep=days.map(d=>S.leads.filter(l=>l.repliedAt&&dayKey(l.repliedAt)===d).length);
  const max=Math.max(1,...sent,...rep);const W=420,H=140,pad=24,bw=(W-pad*2)/14;
  if(!sent.some(x=>x)&&!rep.some(x=>x))return '<div class="empty"><b>No sends yet</b>The chart fills in from the first email out.</div>';
  let s='<svg class="bars" viewBox="0 0 '+W+' '+(H+28)+'" role="img" aria-label="Emails sent and replies per day, last 14 days">';
  [0,.5,1].forEach(f=>{const y=pad+(H-pad)*(1-f);s+='<line x1="'+pad+'" x2="'+(W-pad)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-dasharray="3 4"/><text x="'+(pad-4)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="var(--dim)">'+Math.round(max*f)+'</text>'});
  days.forEach((d,i)=>{const x=pad+i*bw;const hs=(H-pad)*(sent[i]/max),hr=(H-pad)*(rep[i]/max);
    s+='<rect x="'+(x+2)+'" y="'+(H-hs)+'" width="'+(bw/2-3)+'" height="'+hs+'" rx="2" fill="var(--ember)"/>';
    s+='<rect x="'+(x+bw/2)+'" y="'+(H-hr)+'" width="'+(bw/2-3)+'" height="'+hr+'" rx="2" fill="var(--signal)"/>';
    if(i%3===0)s+='<text x="'+(x+bw/2)+'" y="'+(H+16)+'" text-anchor="middle" font-size="10" fill="var(--dim)">'+esc(d.slice(5))+'</text>'});
  s+='</svg><div class="legend"><span><i style="background:var(--ember)"></i>sent</span><span><i style="background:var(--signal)"></i>replies</span></div>';
  return s;
}

/* ---------- Drawer ---------- */
function openDrawer(kind,id){S.drawer={kind,id};renderDrawer();$("#drawer").classList.add("on");$("#drawerBg").classList.add("on");document.body.style.overflow="hidden"}
function closeDrawer(){S.drawer=null;$("#drawer").classList.remove("on");$("#drawerBg").classList.remove("on");document.body.style.overflow=""}
function renderDrawer(){
  const d=S.drawer;if(!d)return;const body=$("#dBody");const title=$("#dTitle");
  if(d.kind==="lead"){const l=S.leads.find(x=>x.id===d.id);if(!l){title.textContent="Lead";body.innerHTML='<div class="empty"><b>Lead not found</b></div>';return}title.textContent=l.businessName||"Lead";body.innerHTML=leadDrawer(l)}
  else if(d.kind==="call"){const l=S.leads.find(x=>x.id===d.id);title.textContent=l?(l.businessName||"Call"):"Call";body.innerHTML=l?callDrawer(l):'<div class="empty"><b>Lead not found</b></div>'}
  else if(d.kind==="agent"){const a=AGENTS.find(x=>x.id===d.id);title.textContent=a?a.name+" · "+a.role:"Agent";body.innerHTML=agentDrawer(a)}
  else if(d.kind==="task"){const t=S.tasks.find(x=>x.id===d.id);title.textContent=t?t.title:"Task";body.innerHTML=t?taskDrawer(t):""}
  else if(d.kind==="run"){const r=S.runs.find(x=>x.id===d.id);title.textContent=r?"Run "+(r.day||""):"Run";body.innerHTML=r?runDrawer(r):""}
  else if(d.kind==="addLead"){title.textContent="Add a lead";body.innerHTML=addLeadForm()}
  else if(d.kind==="client"){const k=S.clients.find(x=>x.id===d.id);title.textContent=k?k.businessName:"Client";body.innerHTML=k?clientDrawer(k):'<div class="empty"><b>Client not found</b></div>';if(k&&k.reviewLink){const q=$("#qrBox");if(q){q.innerHTML="";if(window.QRCode){try{new QRCode(q,{text:k.reviewLink,width:200,height:200,correctLevel:QRCode.CorrectLevel.M})}catch(e){q.textContent="QR could not render; copy the link instead"}}else{q.style.color="#15212c";q.textContent="QR maker did not load (no internet?). Reload, or copy the link instead."}}}}
}
function leadDrawer(l){
  const st=settings();const p=l.profile||{};const ai=l.aiCheck||{};const sc=l.searchCheck||{};const drafts=S.drafts.filter(d=>d.leadId===l.id);
  let h='<div class="inline"><span class="score" data-s="'+scoreBand(l.score)+'">'+esc(l.score==null?"–":l.score)+'</span>'+statusPill(l.status)+'<span class="pill">'+esc(l.trade||"")+'</span><span class="pill">'+esc(l.town||"")+', '+esc(l.state||"")+'</span></div>';
  h+='<div class="sec"><h4>Status</h4><div class="field" style="margin:0"><label class="sr" for="lStatus">Status</label><select id="lStatus" data-leadstatus="'+esc(l.id)+'">'+LEAD_STATUS.map(s=>'<option '+(l.status===s?"selected":"")+'>'+esc(s)+'</option>').join("")+'</select></div></div>';
  h+='<div class="sec"><h4>Contact</h4><div class="kv">'
    +'<dt>Email</dt><dd>'+(l.contactEmail?esc(l.contactEmail)+' <button class="copy" type="button" data-copytext="'+esc(l.contactEmail)+'"><svg aria-hidden="true"><use href="#i-copy"/></svg>Copy</button>'+(l.emailSource?'<br><small class="dim">from <a href="'+esc(l.emailSource)+'" target="_blank" rel="noopener">'+esc(l.emailSource.replace(/^https?:\/\//,"").slice(0,48))+'</a></small>':''):'<span class="dim">none published</span>')+'</dd>'

  if(b.dataset.sw){const k=b.dataset.sw;const st=settings();const next=!st[k];if(k==="autoSend"&&next){S.confirm.autoSend=true;renderPage();return}await saveSettings({[k]:next});event("Grayson",(next?"Turned on ":"Turned off ")+k);return}
  if(b.dataset.confirm==="autoSend"){S.confirm.autoSend=false;await saveSettings({autoSend:true});event("Grayson","Turned on autosend");return}
  if(b.dataset.cancelconfirm){S.confirm[b.dataset.cancelconfirm]=false;renderPage();return}
  if(b.dataset.rmtarget!=null){const st=settings();const t=(st.targets||[]).slice();t.splice(Number(b.dataset.rmtarget),1);await saveSettings({targets:t,nextTarget:0});return}

  if(b.dataset.savenotes){const ta=$("#lNotes");if(ta&&await updDoc("leads/"+b.dataset.savenotes,{notes:ta.value}))toast("Notes saved");return}
  if(b.dataset.suppress){const l=S.leads.find(x=>x.id===b.dataset.suppress);if(!l)return;await setDoc("suppression/"+slug(l.contactEmail||l.businessName),{email:l.contactEmail||"",businessName:l.businessName,reason:"marked by Grayson",by:"grayson",at:nowIso()});if(await updDoc("leads/"+l.id,{status:"Suppressed"})){toast("Never contact: "+l.businessName);event("Grayson","Suppressed "+l.businessName)}return}
  if(b.dataset.taskcancel){if(await updDoc("tasks/"+b.dataset.taskcancel,{status:"blocked",error:"cancelled by Grayson"}))toast("Cancelled");return}
  if(b.dataset.taskretry){if(await updDoc("tasks/"+b.dataset.taskretry,{status:"queued",error:""}))toast("Queued again");return}
  if(b.dataset.taskdone){if(await updDoc("tasks/"+b.dataset.taskdone,{status:"done",result:"done by Grayson",finishedAt:nowIso()}))toast("Done");return}
  if(b.dataset.vstatus){if(await updDoc("drafts/"+b.dataset.id,{status:b.dataset.vstatus}))toast("Marked "+b.dataset.vstatus);return}
  if(b.id==="runNow"){await runNow(b);return}
  if(b.id==="dClose"){closeDrawer();return}
});
