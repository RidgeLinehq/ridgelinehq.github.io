name: Ridgeline AI check

# The office pushes office/gw/jobs/<id>.json; this asks ChatGPT and Gemini and pushes
# office/gw/out/<id>.json. Keys come from repo secrets and are never printed.
on:
  push:
    paths:
      - "office/gw/jobs/*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aicheck
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Answer every job without an output yet
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          python office/gw/aicheck.py --selftest
          for f in office/gw/jobs/*.json; do
            [ -e "$f" ] || continue
            [ -e "office/gw/out/$(basename "$f")" ] && continue
            python office/gw/aicheck.py "$f" office/gw/out
          done
      - name: Push the answers
        run: |
          git config user.name "ridgeline-actions"
          git config user.email "actions@users.noreply.github.com"
          git add office/gw/out
          git commit -m "AI check answers [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
