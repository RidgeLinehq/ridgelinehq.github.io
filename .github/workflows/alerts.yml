name: Ridgeline alerts

# When any Ridgeline automation fails, open a GitHub issue (GitHub emails the account owner at
# once) and write office/alerts/<run id>.json, which the reply desk and the Emergency Watch read
# and email to ridgelinemarketinghq@gmail.com. Nothing fails silently.
on:
  workflow_run:
    workflows: ["Ridgeline AI check", "Ridgeline review cards", "Ridgeline Stripe", "Ridgeline lead finder", "Office server tests"]
    types: [completed]

permissions:
  contents: write
  issues: write

jobs:
  alert:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open an issue and write the alert file
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ github.event.workflow_run.name }}
          URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          case "$NAME" in
            "Ridgeline Stripe") FIX="Open the link, tap the failed step to read the error. If it says the key is missing or invalid: GitHub → repo Settings → Secrets and variables → Actions → STRIPE_SECRET_KEY → update it with your Stripe secret key.";;
            "Ridgeline AI check") FIX="Usually the OpenAI credit ran out or a key expired. OpenAI: platform.openai.com → Billing → add credit. Gemini: aistudio.google.com → API keys. Then update the secret in GitHub → Settings → Secrets → Actions.";;
            "Ridgeline lead finder") FIX="Usually the Reddit keys are wrong or expired. GitHub → Settings → Secrets → Actions → REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET.";;
            *) FIX="Open the link and tap the failed step. Or open the Claude app and say: fix the $NAME workflow.";;
          esac
          export FIX
          TITLE="ALERT: $NAME failed"
          BODY="**$NAME** failed at $(date -u +%FT%TZ).

          What to tap: $URL

          How to fix: $FIX"
          gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" || echo "issue create failed"
          mkdir -p office/alerts
          python3 -c "import json,os;json.dump({'id':os.environ['RUN_ID'],'what':os.environ['NAME']+' failed','link':os.environ['URL'],'fix':os.environ['FIX'],'at':__import__('time').strftime('%Y-%m-%dT%H:%M:%SZ',__import__('time').gmtime()),'emailed':False},open('office/alerts/'+os.environ['RUN_ID']+'.json','w'),indent=1)" 
          git config user.name "ridgeline-actions"
          git config user.email "actions@users.noreply.github.com"
          git add office/alerts
          git commit -m "alert: $NAME failed [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
