<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Start your plan — Ridgeline Local</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#04211a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23f6f4eb'/%3E%3Cpath d='M13.5 31V9h7.5a5.5 5.5 0 0 1 0 11H13.5' fill='none' stroke='%23082f28' stroke-width='5.5'/%3E%3Cpath d='M18 20l9.5 11' stroke='%23082f28' stroke-width='5.5'/%3E%3Cpath d='M28.5 13l3.75-6 3.75 6z' fill='%2357f2af'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--forest:#082f28;--deep:#04211a;--ink:#142721;--ivory:#f6f4eb;--white:#fffdf7;--cream:#fbf7ec;--brass:#c9a85c;--brass-text:#866a2c;--mint:#57f2af;--muted:#5c6b63;--muted-dark:#b9c8bf;--line:#e2ddcc;--sage:#e3efe7}
*{box-sizing:border-box}
body{margin:0;background:var(--white);color:var(--ink);font:16.5px/1.65 "Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--forest);text-decoration:underline;text-decoration-color:var(--brass);text-decoration-thickness:2px;text-underline-offset:4px}
a:focus-visible{outline:3px solid #b98f4a;outline-offset:3px;border-radius:4px}
.wrap{width:min(760px,calc(100% - 36px));margin-inline:auto}
.nav{background:var(--deep);color:var(--cream);border-bottom:1px solid rgba(246,244,235,.14)}
.nav .wrap{height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:11px;font:400 1.3rem/1 "Anton","Impact",system-ui,sans-serif;letter-spacing:.02em;text-decoration:none;color:var(--cream)}
.brand em{font-style:normal;color:#e2c87f;margin-left:.28em}
.brand svg{width:34px;height:34px;flex:none}
.back{font-size:.9rem;font-weight:600;padding:10px 0;color:var(--cream)}
header.top{background:var(--deep);color:var(--cream);padding:56px 0 48px}
.kicker{display:block;font-size:.74rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--brass)}
.kicker::after{content:"";display:block;width:44px;height:2px;background:var(--brass);margin-top:12px}
h1{font:400 clamp(2.4rem,7vw,4rem)/1 "Anton","Impact",system-ui,sans-serif;letter-spacing:.005em;margin:22px 0 16px;color:var(--cream)}
h1 em{font-style:normal;color:var(--mint)}
.promise{margin:22px 0 0;padding:18px 20px;background:rgba(246,244,235,.07);border:1px solid rgba(246,244,235,.16);color:var(--cream);border-radius:14px;font-size:1.05rem}
main .promise{background:var(--forest);color:#fff;border-color:transparent}
.meta{margin-top:14px;font-size:.85rem;color:var(--muted)}
header.top .meta{color:var(--muted-dark)}
main{padding:40px 0 64px}
footer{background:var(--deep);color:var(--muted-dark);padding:28px 0 calc(28px + env(safe-area-inset-bottom));font-size:.88rem}
footer a{color:#fff}
.tap{display:flex;justify-content:center;align-items:center;min-height:54px;margin-top:16px;border-radius:10px;background:var(--forest);color:#fff;font-weight:600;text-decoration:none}
.tap.alt{background:var(--white);color:var(--forest);border:1px solid var(--line)}
#wait{display:none}
@media(max-width:420px){.brand{font-size:1.1rem}}
</style>
</head>
<body>
<nav class="nav" aria-label="Site"><div class="wrap">
  <a class="brand" href="./" aria-label="Ridgeline Local home"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#f6f4eb"/><path d="M13.5 31V9h7.5a5.5 5.5 0 0 1 0 11H13.5" fill="none" stroke="#082f28" stroke-width="5.5"/><path d="M18 20l9.5 11" stroke="#082f28" stroke-width="5.5"/><path d="M28.5 13l3.75-6 3.75 6z" fill="#57f2af"/></svg><span>Ridgeline<em>Local</em></span></a>
  <a class="back" href="./#pricing">← Back to pricing</a>
</div></nav>
<header class="top"><div class="wrap">
  <span class="kicker">Start your plan</span>
  <h1 id="title">Opening secure <em>checkout…</em></h1>
  <p class="meta" id="sub">Taking you to Stripe.</p>
</div></header>
<main><div class="wrap">
  <div id="wait">
    <div class="promise" id="planBox"></div>
    <p style="margin-top:18px">Checkout for this plan isn’t open right now. Tap below and we’ll email you a secure Stripe link.</p>
    <a class="tap" id="mail" href="mailto:ridgelinemarketinghq@gmail.com">Email me my checkout link</a>
    <a class="tap alt" href="./#free-check">Get the free AI check first</a>
  </div>
  <noscript><p>Email <a href="mailto:ridgelinemarketinghq@gmail.com">ridgelinemarketinghq@gmail.com</a> with the plan you want and we’ll send your secure checkout link.</p></noscript>
</div></main>
<footer><div class="wrap">© 2026 Ridgeline Local · <a href="./">Home</a> · <a href="terms.html">Terms</a> · <a href="privacy.html">Privacy</a></div></footer>
<script>
(function(){
  "use strict";
  /* ?plan=starter|growth|pro  ?client_reference_id=NAME (or ?ref=NAME)  ?email=you@x.com */
  var q=new URLSearchParams(location.search);
  var names={starter:"Starter · $39.99/month",growth:"Growth · $75/month",pro:"Pro · $125/month"};
  var LINKS={starter:"https://buy.stripe.com/5kQ8wP0OfdCIdzIf0xaEE07",growth:"https://buy.stripe.com/14AbJ168z9msbrAdWtaEE08",pro:"https://buy.stripe.com/8x200jgNd6ag3Z8aKhaEE09"};
  var plan=(q.get("plan")||"growth").toLowerCase();if(!names[plan])plan="growth";
  var label=names[plan];
  var ref=(q.get("client_reference_id")||q.get("ref")||"").replace(/[^A-Za-z0-9_-]/g,"").slice(0,200);
  var email=(q.get("prefilled_email")||q.get("email")||"").trim();
  function go(url){
    var extra=[];
    if(ref)extra.push("client_reference_id="+encodeURIComponent(ref));
    if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))extra.push("prefilled_email="+encodeURIComponent(email));
    if(extra.length)url+=(url.indexOf("?")>-1?"&":"?")+extra.join("&");
    location.replace(url);
  }
  function wait(){
    document.getElementById("title").innerHTML="You picked <em>"+label.split(" · ")[0]+".</em>";
    document.getElementById("sub").textContent=label+". No contract. Cancel anytime.";
    document.getElementById("planBox").textContent=label;
    var subject="Start "+label;
    var body="Hi Ridgeline,\n\nI want to start "+label+".\n\nBusiness name:\nCity and state:\nPhone:\n\nPlease send my checkout link.";
    document.getElementById("mail").href="mailto:ridgelinemarketinghq@gmail.com?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
    document.getElementById("wait").style.display="block";
  }
  var ok=function(u){return /^https:\/\/(buy|checkout)\.stripe\.com\//.test(u||"")};
  fetch("data/stripe-links.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){
    var url=((d.links||{})[plan]||{}).monthly||"";
    if(ok(url))go(url);else if(ok(LINKS[plan]))go(LINKS[plan]);else wait();
  }).catch(function(){if(ok(LINKS[plan]))go(LINKS[plan]);else wait()});
})();
</script>
</body>
</html>
