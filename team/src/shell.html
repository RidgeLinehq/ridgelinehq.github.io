<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#111820">
<title>Ridgeline Wash Co. Team</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ridgeline">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap">
<style>/*__CSS__*/</style>
</head>
<body>

<!-- The app: top bar, status strip, the current screen, tab bar. Shown once someone is signed in. -->
<div class="app" id="app" hidden>
  <header class="topbar">
    <div class="topbar-in">
      <button type="button" class="avatar" id="me-btn" aria-label="Your account"></button>
      <span class="topbar-logo"><!--__LOGO__--></span>
      <button type="button" class="iconbtn bell" id="bell-btn" aria-label="Notifications" hidden></button>
    </div>
    <div class="strip" id="strip" role="status" hidden><p class="strip-in" id="strip-text"></p></div>
  </header>
  <main class="screen" id="screen"></main>
  <nav class="tabbar" aria-label="Main"><div class="tabbar-in" id="tabs"></div></nav>
</div>

<!-- Sign in. Shown when nobody is signed in on this phone. -->
<div class="signin" id="signin" hidden>
  <div class="signin-in">
    <div class="signin-brand">
      <span class="signin-logo"><!--__LOGO__--></span>
      <p class="tagline">A higher standard of clean</p>
    </div>
    <div class="signin-body" id="signin-body"></div>
  </div>
</div>

<!-- Sheets and dialogs slide in here; short messages appear in the toast area. -->
<div id="layers"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<noscript><p class="noscript">This page needs JavaScript. Turn it on in your browser settings, then open the page again.</p></noscript>

<script src="config.js"></script>
<script>/*__JS__*/</script>
</body>
</html>
