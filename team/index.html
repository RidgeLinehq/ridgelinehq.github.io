<!doctype html>

<style>/* ---- app.css ---- */
/*
 * Ridgeline Wash Co. team app: the design system and every shared component.
 * One committed dark theme. Every color comes from the tokens below.
 * Screens should need little or no CSS of their own: find the class here first.
 *
 * Index (search for the name in capitals):
 *   TOKENS, BASE, SHELL (top bar, strip, screen, tab bar), SIGN IN, TYPE, LAYOUT HELPERS,
 *   CARDS, LISTS AND ROWS, LABEL-VALUE ROWS, STAT BLOCKS, PILLS, BUTTONS, FIELDS, CHIPS,
 *   SEGMENTED, SWITCH, CALLOUT, EMPTY STATE, SHEETS, DIALOG, TOASTS, MONTH GRID, SLOT PICKER,
 *   JOB CARD, NOTES, COMPANY STANDARDS, ME SHEET
 */

/* ---------- TOKENS ---------- */
:root {
  color-scheme: dark;
  --bg: #111820;                      /* Charcoal: the page */
  --surface: #1D2A36;                 /* Slate: cards, bars, sheets */
  --raised: #263645;                  /* inputs, quiet buttons, pressed states */
  --line: #2E4152;                    /* hairlines, borders */
  --ink: #F5F8FA;                     /* Off White: text */
  --ink-2: #A9B8C6;                   /* secondary text */
  --ink-3: #7C8D9C;                   /* hints, disabled, blocked days */
  --ice: #67D4F5;                     /* Ice Blue: THE accent. Primary buttons, active tab, links, labels */
  --ice-ink: #0C1822;                 /* text on an ice button */
  --ice-wash: rgba(103, 212, 245, .12);
  --good: #5CCB8F;  --good-wash: rgba(92, 203, 143, .14);    /* done, paid, active */
  --warn: #E9B44C;  --warn-wash: rgba(233, 180, 76, .14);    /* scheduled, not paid, paused, unassigned */
  --bad:  #FF7A6E;  --bad-wash:  rgba(255, 122, 110, .13);   /* overdue, late, failed saves */
  --display: 'Montserrat', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;   /* headings, big numbers */
  --body: 'Figtree', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;         /* everything else */
  --r-card: 16px; --r-ctl: 12px; --r-pill: 999px;
  --tap: 52px;                        /* height of every button and input */
}
/* Two working values that are not brand colors: the dim behind a sheet and the one soft shadow under it. */
:root {
  --scrim: rgba(6, 10, 14, .7);
  --lift: 0 -12px 40px rgba(0, 0, 0, .35);
}

/* ---------- BASE ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.45 var(--body);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
  overflow-wrap: break-word;          /* a very long word from a person wraps instead of running off the edge */
}
h1, h2, h3, p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; margin: 0; }
button { background: none; border: 0; padding: 0; text-align: inherit; cursor: pointer; -webkit-appearance: none; appearance: none; touch-action: manipulation; }
a { color: var(--ice); text-decoration: none; touch-action: manipulation; }
img, svg { display: block; max-width: 100%; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }
::selection { background: var(--ice); color: var(--ice-ink); }
.noscript { padding: 24px 16px; color: var(--ink-2); }

/* .locked on <html>: the page behind an open sheet does not scroll. */
.locked, .locked body { overflow: hidden; }

/* .ico: every icon from App.icon(). Line icons that take the color of their text. */
.ico { flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

/* The side gutters, written once for everything that touches the screen edge. */
.topbar-in, .strip-in, .screen, .tabbar-in, .signin, .sheet-head, .sheet-body, .sheet-foot {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- SHELL ---------- */
/* .app: the signed-in page. One centered column, 560px at most. */
.app { min-height: 100%; display: flex; flex-direction: column; }

/* .topbar: sticky. Initials on the left, logo in the middle, bell on the right. */
.topbar { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.topbar-in { max-width: 560px; margin: 0 auto; height: 64px; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; }
.topbar-logo { justify-self: center; display: block; height: 44px; }
.topbar-logo svg { height: 44px; width: auto; }

/* .avatar: the round initials button (also .avatar-lg in the Me sheet). */
.avatar {
  width: 44px; height: 44px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  background: var(--raised); border: 1px solid var(--line); color: var(--ink);
  font: 700 14px/1 var(--display); letter-spacing: .02em; flex: none;
}
.avatar-lg { width: 56px; height: 56px; font-size: 18px; }
button.avatar:active { opacity: .7; }

/* .iconbtn: a round 44px button that holds one icon (bell, close, month arrows). */
.iconbtn { position: relative; width: 44px; height: 44px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); flex: none; }
.iconbtn:active { opacity: .6; }
.iconbtn[disabled] { color: var(--ink-3); opacity: .45; cursor: default; }
.iconbtn-quiet { background: var(--raised); border: 1px solid var(--line); }
.bell { justify-self: end; }
.bell.has-dot::after { content: ''; position: absolute; top: 9px; right: 10px; width: 10px; height: 10px; border-radius: 50%; background: var(--ice); border: 2px solid var(--bg); }

/* .strip: the one status line under the top bar (sample data, or no connection). */
.strip { position: relative; background: var(--bg); border-top: 1px solid var(--line); }
.strip::before { content: ''; position: absolute; inset: 0; background: var(--warn-wash); }
.strip-in { position: relative; max-width: 560px; margin: 0 auto; padding-top: 7px; padding-bottom: 7px; color: var(--warn); font-size: 14px; line-height: 1.3; font-weight: 500; }

/* .screen: where a screen renders. Children stack with a 16px gap. */
.screen {
  flex: 1 0 auto; width: 100%; max-width: 560px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 16px;
  padding-top: 20px; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
}
.screen > * { min-width: 0; }

/* .tabbar: fixed to the bottom. Icon above a 12px label; the active tab is ice with a short ice bar. */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar-in { max-width: 560px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
.tab {
  position: relative; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  padding-bottom: 6px; color: var(--ink-2); font: 600 12px/1 var(--body); text-align: center;
}
.tab:active { opacity: .7; }
.tab.is-on { color: var(--ice); }
.tab.is-on::after { content: ''; position: absolute; left: 50%; bottom: 5px; width: 28px; height: 3px; margin-left: -14px; border-radius: 3px; background: var(--ice); }

/* ---------- SIGN IN ---------- */
.signin { min-height: 100%; display: flex; padding-top: max(32px, env(safe-area-inset-top, 0px)); padding-bottom: max(32px, env(safe-area-inset-bottom, 0px)); }
.signin-in { width: 100%; max-width: 400px; margin: auto; display: flex; flex-direction: column; gap: 28px; }
.signin-brand { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.signin-logo { display: block; width: 220px; }
.signin-logo svg { width: 220px; height: auto; }
/* .tagline: "A higher standard of clean", set like the brand sheet. */
.tagline { font: italic 600 12px/1.2 var(--body); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-2); text-align: center; }
.signin-body { display: flex; flex-direction: column; gap: 24px; }
.signin-form { display: flex; flex-direction: column; gap: 16px; }
.signin-title { font: 800 22px/1.15 var(--display); }

/* ---------- TYPE ---------- */
/* .title: the screen title. .lead: the quiet line that goes with it. .head wraps the two. */
.head { display: flex; flex-direction: column; gap: 4px; }
.title { font: 800 28px/1.12 var(--display); letter-spacing: -.01em; overflow-wrap: anywhere; }
.lead { color: var(--ink-2); }
/* .label: the tiny uppercase section label ("NEXT JOB"). Add .label-bad / .label-warn / .label-good / .label-mute for a state. */
.label { display: flex; align-items: baseline; gap: 8px; margin: 8px 0 -4px; font: 700 12px/1.3 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--ice); }
.label:first-child { margin-top: 0; }
.label-bad { color: var(--bad); } .label-warn { color: var(--warn); } .label-good { color: var(--good); } .label-mute { color: var(--ink-3); }
.label-count { font-variant-numeric: tabular-nums; }
/* .card-title: a heading inside a card or a sheet (Montserrat 700, 18). */
.card-title { font: 700 18px/1.25 var(--display); overflow-wrap: anywhere; }
/* Small text helpers. */
.muted { color: var(--ink-2); } .hint { color: var(--ink-3); font-size: 14px; } .small { font-size: 14px; }
.good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); } .ice { color: var(--ice); }
.strong { font-weight: 600; }
/* .num: numbers that line up (money, times, counts). .big-num: a big stat number. */
.num { font-variant-numeric: tabular-nums; }
.big-num { font: 800 28px/1.1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

/* ---------- LAYOUT HELPERS ---------- */
/* .stack: a column with even gaps (.stack-xs 4, .stack-sm 8, .stack-md 12, .stack 16, .stack-lg 24). */
.stack, .stack-xs, .stack-sm, .stack-md, .stack-lg { display: flex; flex-direction: column; }
.stack > *, .stack-xs > *, .stack-sm > *, .stack-md > *, .stack-lg > * { min-width: 0; }
.stack-xs { gap: 4px; } .stack-sm { gap: 8px; } .stack-md { gap: 12px; } .stack { gap: 16px; } .stack-lg { gap: 24px; }
/* .between: two things on one line, pushed apart. .cluster: things in a line that wrap. */
.between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.between > * { min-width: 0; }
.cluster { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
/* .cols-2: two equal columns (buttons side by side, short fields). */
.cols-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.grow { flex: 1 1 auto; min-width: 0; }
.divider { height: 1px; background: var(--line); border: 0; margin: 0; }

/* ---------- CARDS ---------- */
/* .card: slate, hairline border, 16px radius, 16px padding. Not every block needs one. */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card > * { min-width: 0; }
.card-flush { padding: 0; gap: 0; overflow: hidden; }
/* Inside a sheet (which is already slate) a card is a darker well. */
.sheet .card { background: var(--bg); }

/* ---------- LISTS AND ROWS ---------- */
/* .list: rows with hairlines between them, straight on the page (or inside .card.card-flush with .list-pad). */
.list { display: flex; flex-direction: column; }
.list-pad { padding: 0 16px; }
/* .row: one line of a list. Lead (icon or time), main (title + sub), right (value, pill, chevron). Use a <button> when it is tappable. */
.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 10px 0; border-bottom: 1px solid var(--line); color: var(--ink); text-align: left; }
.list > .row:last-child { border-bottom: 0; }
button.row:active, a.row:active { opacity: .7; }
.row.is-busy { opacity: .55; }
.row-lead { flex: none; display: flex; flex-direction: column; color: var(--ink-2); }
.row-time { min-width: 84px; font: 700 14px/1.3 var(--display); color: var(--ink); font-variant-numeric: tabular-nums; }
.row-time small { display: block; font: 500 12px/1.3 var(--body); color: var(--ink-2); }
.row-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-title { font-weight: 600; overflow-wrap: anywhere; }
.row-sub { font-size: 14px; color: var(--ink-2); overflow-wrap: anywhere; }
/* .row-clip: keep each line of the row to one line, cut with an ellipsis (compact job rows). */
.row-clip .row-title, .row-clip .row-sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-right { flex: none; display: flex; align-items: center; gap: 8px; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
.row-right-col { flex-direction: column; align-items: flex-end; gap: 2px; }
.row-chev { flex: none; color: var(--ink-3); }
.row.is-off { color: var(--ink-3); }
.row.is-off .row-lead { color: var(--ink-3); }
.row-danger, .row-danger .row-lead { color: var(--bad); }
/* .row.is-you: the viewer's own row in a ranking, tinted ice. */
.row.is-you { background: var(--ice-wash); border-radius: var(--r-ctl); border-bottom-color: transparent; width: auto; margin: 0 -12px; padding-left: 12px; padding-right: 12px; }
/* .rank: the rank numeral in a leaderboard row. */
.rank { min-width: 28px; font: 800 18px/1 var(--display); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.rank.is-top { color: var(--ice); }

/* ---------- LABEL-VALUE ROWS ---------- */
/* .kvs > .kv: "Phone ......... 615-555-0142". The value may be text, a link or a pill. */
.kvs { display: flex; flex-direction: column; }
.kv { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.kvs > .kv:last-child { border-bottom: 0; }
.kv-label { flex: none; max-width: 45%; color: var(--ink-2); font-size: 14px; line-height: 1.65; }
.kv-value { min-width: 0; text-align: right; overflow-wrap: anywhere; }
button.kv { width: 100%; }
button.kv .kv-value { color: var(--ice); font-weight: 600; }

/* ---------- STAT BLOCKS ---------- */
/* .stats: the slim summary card, numbers side by side with hairlines between (App.ui.stats). */
.stats { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); }
.stat { padding: 14px 12px 12px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat:first-child { border-left: 0; padding-left: 16px; }
.stat-num { font: 800 22px/1.1 var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat-num small { font: 700 12px/1 var(--display); margin-left: 3px; color: var(--ink-2); }
.stat-label { font-size: 14px; line-height: 1.25; color: var(--ink-2); }
.stat-num.is-ice { color: var(--ice); } .stat-num.is-good { color: var(--good); } .stat-num.is-bad { color: var(--bad); } .stat-num.is-mute { color: var(--ink-3); }
@media (max-width: 380px) {   /* narrow phones: "12:00 PM" still fits its column */
  .stats .stat { padding-left: 10px; padding-right: 10px; }
  .stats .stat:first-child { padding-left: 14px; }
  .stats .stat-num { font-size: 20px; }
}
/* .stat-grid: plain stat blocks in two columns, no boxes (the Dashboard numbers). */
.stat-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px 16px; }
.stat-grid .stat { padding: 0 0 0 12px; border-left: 2px solid var(--line); }

/* ---------- PILLS ---------- */
/* .pill: a state, always with a word. Tones: -good (done, paid, active), -warn (scheduled, not paid, paused),
   -bad (overdue, late), -ice (new), -mute (cancelled, coming soon). */
.pill { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px; border-radius: var(--r-pill); font: 700 12px/1 var(--body); letter-spacing: .02em; white-space: nowrap; flex: none; }
.pill-good { background: var(--good-wash); color: var(--good); }
.pill-warn { background: var(--warn-wash); color: var(--warn); }
.pill-bad  { background: var(--bad-wash);  color: var(--bad); }
.pill-ice  { background: var(--ice-wash);  color: var(--ice); }
.pill-mute { background: var(--raised);    color: var(--ink-2); }
/* button.pill: a pill you can tap (the owner's amber "Unassigned"). The 44px tap area comes from ::before. */
button.pill { position: relative; height: 28px; padding: 0 10px 0 12px; }
button.pill::before { content: ''; position: absolute; inset: -8px -4px; }
button.pill:active { opacity: .7; }

/* ---------- BUTTONS ---------- */
/* .btn + one of: .btn-primary (ice, one per view), .btn-quiet (slate), .btn-danger (red), .btn-text (ice words).
   Sizes: default 52px, .btn-sm 44px. .btn-block fills the width. */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; flex: none;
  height: var(--tap); padding: 0 18px; border-radius: var(--r-ctl); border: 1px solid transparent;
  font: 700 16px/1 var(--body); text-align: center; white-space: nowrap; user-select: none; -webkit-user-select: none;
  cursor: pointer; text-decoration: none; min-width: 0;
}
.btn:active { opacity: .7; }
.btn[disabled], .btn.is-busy { opacity: .55; cursor: default; }
.btn-label { overflow: hidden; text-overflow: ellipsis; }
.btn-primary { background: var(--ice); color: var(--ice-ink); }
.btn-quiet { background: var(--raised); border-color: var(--line); color: var(--ink); }
.btn-danger { background: var(--bad-wash); color: var(--bad); }
.btn-text { height: 44px; padding: 0 6px; color: var(--ice); font-weight: 600; }
.btn-text.btn-danger { background: none; }
.btn-sm { height: 44px; padding: 0 14px; font-size: 14px; }
.btn-block { display: flex; width: 100%; height: auto; min-height: var(--tap); padding-top: 8px; padding-bottom: 8px; white-space: normal; line-height: 1.2; }
.btn-sm.btn-block { min-height: 44px; }
/* .btn-row: buttons side by side that share the width. */
.btn-row { display: flex; gap: 8px; }
.btn-row > .btn { flex: 1 1 0; padding-left: 10px; padding-right: 10px; }
/* .form-error: the red words right by a button when a save fails. .form-note: quiet words in the same spot. */
.form-error { color: var(--bad); font-size: 14px; line-height: 1.4; }
.form-note { color: var(--ink-2); font-size: 14px; line-height: 1.4; }

/* ---------- FIELDS ---------- */
/* .field: label, control, optional hint, inline error (App.ui.field). .input is the control itself. */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-label { font-weight: 600; font-size: 14px; color: var(--ink-2); }
.field-opt { font-weight: 400; color: var(--ink-3); }
.input {
  display: block; width: 100%; height: var(--tap); padding: 0 14px;
  background: var(--raised); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-ctl);
  font: 400 16px/1.3 var(--body); -webkit-appearance: none; appearance: none; outline: none; min-width: 0;
}
.input::placeholder { color: var(--ink-3); opacity: 1; }
.input:focus { border-color: var(--ice); box-shadow: 0 0 0 1px var(--ice); }
textarea.input { height: auto; min-height: 104px; padding: 12px 14px; line-height: 1.45; resize: vertical; }
select.input { padding-right: 40px; text-overflow: ellipsis; }
.field.has-error .input { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad); }
.field-error { color: var(--bad); font-size: 14px; }
.field-hint { color: var(--ink-3); font-size: 14px; }
/* .input-wrap: a control with something inside it: a "$" in front (.input-prefix) or a select arrow (.input-arrow). */
.input-wrap { position: relative; display: block; }
.input-prefix { position: absolute; left: 14px; top: 0; height: var(--tap); display: flex; align-items: center; color: var(--ink-2); pointer-events: none; }
.input-wrap.has-prefix .input { padding-left: 28px; }
.input-arrow { position: absolute; right: 12px; top: 0; height: var(--tap); display: flex; align-items: center; color: var(--ink-2); pointer-events: none; }
/* .search: a search box with the icon inside. */
.search { position: relative; }
.search .ico { position: absolute; left: 14px; top: 16px; color: var(--ink-3); pointer-events: none; }
.search .input { padding-left: 44px; }

/* ---------- CHIPS ---------- */
/* .chips > .chip: pick one or several (App.ui.chips). .chips-big: large chips for times. .chips-scroll: one line that slides sideways. */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 44px; padding: 0 16px;
  background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-pill); color: var(--ink);
  font: 600 14px/1 var(--body); white-space: nowrap; font-variant-numeric: tabular-nums;
}
.chip:active { opacity: .7; }
.chip.is-on { background: var(--ice); border-color: var(--ice); color: var(--ice-ink); }
.chip-count { font-weight: 500; color: var(--ink-2); }
.chip.is-on .chip-count { color: var(--ice-ink); }
.chip[disabled] { color: var(--ink-3); cursor: default; }
.chips-big { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
.chips-big .chip { height: var(--tap); padding: 0 8px; border-radius: var(--r-ctl); font-size: 16px; }
.chips-scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; margin: 0 -16px; padding: 0 16px; }
.chips-scroll::-webkit-scrollbar { display: none; }
.chips-scroll .chip { flex: none; }
/* .chip-x: a chip with a remove mark (time slots in the Day sheet). */
.chip-x { padding-right: 10px; }
.chip-x .ico { color: var(--ink-2); }

/* ---------- SEGMENTED ---------- */
/* .seg: two to four choices in one bar (App.ui.segmented). */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; height: var(--tap); padding: 3px; background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-ctl); }
.seg-btn { display: flex; align-items: center; justify-content: center; padding: 0 6px; border-radius: 9px; color: var(--ink-2); font: 600 14px/1.1 var(--body); text-align: center; }
.seg-btn:active { opacity: .7; }
.seg-btn.is-on { background: var(--ice); color: var(--ice-ink); font-weight: 700; }

/* ---------- SWITCH ---------- */
/* .switch: a label with an on/off track (App.ui.toggle). */
.switch { display: flex; align-items: center; gap: 16px; width: 100%; min-height: var(--tap); text-align: left; color: var(--ink); }
.switch-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.switch-label { font-weight: 600; }
.switch-hint { font-size: 14px; color: var(--ink-2); }
.switch-track { flex: none; position: relative; width: 52px; height: 32px; border-radius: var(--r-pill); background: var(--raised); border: 1px solid var(--line); }
.switch-track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--ink-3); }
.switch[aria-checked="true"] .switch-track { background: var(--ice); border-color: var(--ice); }
.switch[aria-checked="true"] .switch-track::after { left: 23px; background: var(--ice-ink); }

/* ---------- CALLOUT ---------- */
/* .callout: a boxed message that must not be missed (a new PIN, a warning). Tones: -warn, -bad, -good, -ice. */
.callout { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: var(--r-ctl); background: var(--raised); border: 1px solid var(--line); }
.callout-warn { background: var(--warn-wash); border-color: transparent; }
.callout-bad  { background: var(--bad-wash);  border-color: transparent; }
.callout-good { background: var(--good-wash); border-color: transparent; }
.callout-ice  { background: var(--ice-wash);  border-color: transparent; }
.callout-title { font-weight: 700; }
.callout-big { font: 800 28px/1.15 var(--display); font-variant-numeric: tabular-nums; letter-spacing: .06em; }

/* ---------- EMPTY STATE ---------- */
/* .empty: "Nothing here yet", one helpful next step (App.ui.empty). */
.empty { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 20px 16px; border: 1px dashed var(--line); border-radius: var(--r-card); }
.empty-title { font-weight: 600; }
.empty-text { color: var(--ink-2); }
.empty .btn { margin-top: 10px; }

/* ---------- SHEETS ---------- */
/* .layer: the dimmed backdrop that holds one sheet or dialog. */
/* --vv-top / --vv-h are set by app.js while the on-screen keyboard is up, so a sheet's footer button stays in view. */
.layer { position: fixed; left: 0; right: 0; top: var(--vv-top, 0px); height: var(--vv-h, 100%); z-index: 50; display: flex; justify-content: center; align-items: flex-end; background: var(--scrim); }
/* .sheet: a full-height panel that slides up (App.sheet.open). Header, scrolling body, optional sticky footer. */
.sheet {
  width: 100%; max-width: 560px; height: calc(100% - max(12px, env(safe-area-inset-top, 0px)));
  display: flex; flex-direction: column; background: var(--surface); border-radius: 20px 20px 0 0;
  box-shadow: var(--lift); animation: sheet-up 180ms ease-out; outline: none;
}
/* .sheet-small: only as tall as what is in it (Add note, Assign to). */
.sheet-small { height: auto; max-height: calc(100% - max(48px, env(safe-area-inset-top, 0px))); }
.sheet-head { flex: none; display: flex; align-items: center; gap: 12px; min-height: 64px; padding-top: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.sheet-title { flex: 1 1 auto; min-width: 0; font: 700 18px/1.25 var(--display); overflow-wrap: anywhere; }
.sheet-close { margin-right: -6px; background: var(--raised); border: 1px solid var(--line); }
.sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 16px; padding-top: 20px; padding-bottom: 28px; }
.sheet-body > * { flex: none; min-width: 0; }
.sheet-small .sheet-body { padding-bottom: 20px; }
.sheet-foot { flex: none; display: flex; flex-direction: column; gap: 10px; padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
.sheet-foot.is-bare { border-top: 0; padding-top: 0; }
.sheet-foot.is-bare:not(.has-error) { padding-bottom: env(safe-area-inset-bottom, 0px); }
@keyframes sheet-up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (min-width: 620px) {
  .layer { align-items: center; }
  .sheet { height: min(860px, calc(100% - 48px)); border-radius: 20px; }
  .sheet-small { height: auto; }
}

/* ---------- DIALOG ---------- */
/* .dialog: the in-page "Are you sure?" (App.confirm). */
.layer-center { align-items: center; padding: 24px; z-index: 60; }
.dialog { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 10px; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--lift); outline: none; }
.dialog-title { font: 700 18px/1.25 var(--display); }
.dialog-text { color: var(--ink-2); }
.dialog .cols-2 { margin-top: 10px; }

/* ---------- TOASTS ---------- */
/* .toast: a short message just above the tab bar (App.toast). .toast-bad is the red one, usually with Retry. */
.toasts { position: fixed; z-index: 80; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 12px; pointer-events: none; }
.toast { pointer-events: auto; max-width: 100%; width: max-content; min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 16px; background: var(--ink); color: var(--ice-ink); border-radius: var(--r-ctl); font-weight: 600; font-size: 14px; line-height: 1.35; }
.toast-text { padding: 6px 8px 6px 0; overflow-wrap: anywhere; }
.toast-bad { background: var(--bad); }
.toast-btn { flex: none; height: 36px; padding: 0 12px; border-radius: 8px; background: var(--ice-ink); color: var(--ink); font-weight: 700; font-size: 14px; }
.toast-btn:active { opacity: .7; }

/* ---------- MONTH GRID ---------- */
/* .month: a month of days, Sunday first (App.ui.monthGrid). Day states: .is-open (ice wash), .is-full, .is-blocked,
   .is-past (dimmest), .is-today (ring), .is-selected (solid ice). */
.month { display: flex; flex-direction: column; gap: 8px; }
.month-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.month-title { font: 700 18px/1.2 var(--display); }
.month-nav { display: flex; gap: 8px; }
.month-dow, .month-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.month-dow span { text-align: center; font: 600 12px/1.6 var(--body); color: var(--ink-3); }
.day {
  position: relative; min-height: 48px; padding: 4px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  border-radius: 10px; color: var(--ink-3); font: 600 16px/1.1 var(--body); font-variant-numeric: tabular-nums; text-align: center;
}
.day[disabled] { cursor: default; }
button.day:not([disabled]):active { opacity: .7; }
.day-label { font: 600 12px/1.1 var(--body); color: var(--ink-3); white-space: nowrap; }
.month.has-labels .day { min-height: 54px; }
.day.is-open { background: var(--ice-wash); color: var(--ink); }
.day.is-open .day-label { color: var(--ice); }
.day.is-full { background: var(--warn-wash); color: var(--ink); }
.day.is-full .day-label { color: var(--warn); }
.day.is-blocked { color: var(--ink-3); }
.day.is-past { color: var(--ink-3); opacity: .5; background: none; }
.day.is-today { box-shadow: inset 0 0 0 2px var(--ink-2); }
.day.is-selected { background: var(--ice); color: var(--ice-ink); box-shadow: none; }
.day.is-selected .day-label { color: var(--ice-ink); }
/* .legend: the small key under a month grid. Swatches reuse the day states. */
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; color: var(--ink-2); }
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--line); flex: none; }
.swatch.is-open { background: var(--ice-wash); border-color: transparent; }
.swatch.is-full { background: var(--warn-wash); border-color: transparent; }
.swatch.is-selected { background: var(--ice); border-color: transparent; }
.swatch.is-today { border: 2px solid var(--ink-2); }

/* ---------- SLOT PICKER ---------- */
/* .slotpick: month grid plus the free times of the chosen day (App.ui.slotPicker). */
.slotpick { display: flex; flex-direction: column; gap: 16px; }
.slotpick-times { display: flex; flex-direction: column; gap: 10px; }
.slotpick-day { font-weight: 600; }

/* ---------- JOB CARD ---------- */
/* .job: one visit (App.ui.jobCard). .is-overdue tints it red, .is-done makes it quiet. */
.job { gap: 10px; }
.job-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.job-time { font: 700 18px/1.2 var(--display); font-variant-numeric: tabular-nums; }
.job-due { color: var(--bad); font-size: 14px; font-weight: 600; margin-top: -4px; }
.job-name { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 44px; margin: -6px 0; font: 700 20px/1.2 var(--display); color: var(--ink); text-align: left; }
.job-name span { min-width: 0; overflow-wrap: anywhere; }
.job-name .ico { color: var(--ice); }
.job-name:active { opacity: .7; }
.job-what { color: var(--ink-2); overflow-wrap: anywhere; }
/* .meta > .meta-row: a small icon and one fact (address, phone, who). */
.meta { display: flex; flex-direction: column; gap: 6px; }
.meta-row { display: flex; align-items: flex-start; gap: 10px; min-width: 0; font-size: 14px; line-height: 1.45; color: var(--ink); }
.meta-row .ico { margin-top: 2px; color: var(--ink-3); }
.meta-row > span { min-width: 0; overflow-wrap: anywhere; }
.meta-row.is-note { color: var(--ink-2); }
.meta-row.is-note > span { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.job-actions { display: flex; gap: 8px; margin-top: 4px; }
.job-actions .btn { flex: 1 1 auto; padding: 0 8px; gap: 6px; }
.job-done-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 28px; font-size: 14px; color: var(--ink-2); }
.job-done-line .btn-text { margin: -8px -6px -8px 0; }
.job.is-overdue { position: relative; border-color: var(--bad); }
.job.is-overdue::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: var(--bad-wash); pointer-events: none; }
.job.is-overdue > * { position: relative; }
.job.is-done { background: none; }
.job.is-done .job-time { color: var(--ink-2); }
.job.is-done .job-name { color: var(--ink-2); font-size: 18px; }
.job.is-done .job-name .ico { color: var(--ink-3); }
.job.is-cancelled .job-name, .job.is-cancelled .job-time { color: var(--ink-2); }
/* .remind: the Company standards reminder on Today (small photo, two lines, a button). */
.remind { flex-direction: row; align-items: center; gap: 12px; padding: 12px; }
.remind-photo { width: 56px; height: 56px; flex: none; border-radius: var(--r-ctl); object-fit: cover; background: var(--raised); }
.remind-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.remind-title { font: 700 16px/1.25 var(--display); }
.remind-sub { font-size: 14px; color: var(--ink-2); }

/* ---------- NOTES ---------- */
/* .notes > .note: note history, newest first (who, when, text). */
.notes { display: flex; flex-direction: column; }
.note { display: flex; flex-direction: column; gap: 2px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.notes > .note:first-child { padding-top: 0; }
.notes > .note:last-child { border-bottom: 0; padding-bottom: 0; }
.note-by { font-size: 14px; color: var(--ink-2); }
.note-by b { color: var(--ink); font-weight: 600; }
.note-text { white-space: pre-wrap; overflow-wrap: anywhere; }

/* ---------- COMPANY STANDARDS ---------- */
/* .std-photo: the one photo in the app, with the tagline on a flat strip across its bottom. */
.std-photo { position: relative; height: 170px; border-radius: var(--r-card); overflow: hidden; background: var(--surface); border: 1px solid var(--line); }
.std-photo img { width: 100%; height: 100%; object-fit: cover; object-position: 60% 50%; }
.std-photo-strip { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px; background: var(--bg); font: 700 16px/1.25 var(--display); }
.std-sec { display: flex; flex-direction: column; gap: 12px; }
.std-sec .label { margin: 8px 0 0; }
.std-list { display: flex; flex-direction: column; gap: 12px; }
.std-item { display: flex; align-items: flex-start; gap: 12px; line-height: 1.55; }
.std-item > span:last-child { min-width: 0; overflow-wrap: anywhere; }
.std-mark { flex: none; width: 24px; display: flex; justify-content: center; color: var(--ice); padding-top: 3px; }
.std-num { flex: none; width: 24px; text-align: center; font: 800 16px/1.55 var(--display); color: var(--ice); font-variant-numeric: tabular-nums; }
.std-foot { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; padding-top: 20px; border-top: 1px solid var(--line); }
.std-ok { display: flex; align-items: center; gap: 8px; color: var(--good); font-weight: 600; }

/* ---------- ME SHEET ---------- */
.me-head { display: flex; align-items: center; gap: 14px; }
.me-name { font: 700 20px/1.2 var(--display); overflow-wrap: anywhere; }
.me-foot { display: flex; flex-direction: column; gap: 2px; color: var(--ink-3); font-size: 14px; }

/* ---------- MOTION ---------- */
@media (prefers-reduced-motion: reduce) {
  .sheet { animation: none; }
  * { scroll-behavior: auto !important; }
}
</style>

<script>/* ---- core.js ---- */
/*
 * Ridgeline Wash Co. team system: shared core.
 *
 * One file of plain JavaScript that runs unchanged in two places:
 *   1. the Google Apps Script backend (team/backend/Code.gs), where it is the real server;
 *   2. the page itself, in sample mode, so the app works before a backend is connected.
 * No DOM, no network and no Google APIs in here. The host passes in a `store` and an `env`.
 *
 * store: list(coll) -> array of plain objects, each with a string `id` (fresh copies)
 *        put(coll, doc)            upsert by doc.id
 *        del(coll, id)
 *        getRev() -> number        setRev(n)
 *        cacheGet(key) -> string|null     cachePut(key, string, ttlSeconds)     cacheDel(key)
 * env:   now() -> ms since epoch
 *        dayKey(ms) -> 'YYYY-MM-DD' in the business time zone
 *        hm(ms) -> 'HH:MM' (24 hour) in the business time zone
 *        uuid() -> random string
 *        notify({subject, body})   sends the owner an email; may throw
 *
 * Every request is { action, token?, since?, day?, opId?, ... } and every answer is
 * { ok: true, result, sync } or { ok: false, error: { code, message }, sync? }.
 * Money is always whole cents. Days are 'YYYY-MM-DD' strings, times are 'HH:MM' strings.
 */
var RidgelineCore = (function () {
  'use strict';

  var VERSION = '1.0.0';
  var ROLES = ['owner', 'rep', 'tech'];
  var CLIENT_STATUSES = ['New', 'Active', 'Paused', 'Cancelled'];
  var PAY_STATUSES = ['unpaid', 'paid', 'late'];
  var BILLING = ['once', 'monthly'];
  var COLLECTIONS = ['team', 'sessions', 'settings', 'days', 'clients', 'sales', 'jobs', 'notices', 'problems'];
  var LIMITS = {
    name: 60, line: 160, text: 500, notesKept: 50, noticesKept: 60, problemsKept: 30,
    maxCents: 100000000, sessionDays: 90, loginTries: 5, lockSeconds: 900, globalTries: 40,
    daysPerCall: 62, slotsPerDay: 24, services: 20, standardSections: 12, standardItems: 20, standardLine: 240
  };
  var DEFAULT_SETTINGS = {
    id: 'main',
    businessName: 'Ridgeline Wash Co.',
    services: [
      { id: 'windows', name: 'Window cleaning', priceCents: 0 },
      { id: 'house', name: 'House wash', priceCents: 0 },
      { id: 'pressure', name: 'Pressure wash', priceCents: 0 }
    ],
    firstPct: 30,
    monthlyPct: 10,
    defaultSlots: ['08:00', '09:30', '12:00', '14:00'],
    defaultTechId: null,
    notifyEmail: '',
    emailOnBooking: true,
    /* Company standards: a starting draft built from the job checklist in Grayson's own mockups.
       The owner edits these in the app; everyone else reads them and confirms they have. */
    standards: [
      { id: 'job', title: 'On every job', ordered: true, items: [
        'Arrive on time. If you will be more than 10 minutes late, call the customer before the start time.',
        'Take before photos.',
        'Protect what is nearby. Move or cover furniture, plants, door mats and cars before any water or soap.',
        'Do the whole job that was sold. If part of it cannot be done safely, stop and call Grayson.',
        'Take after photos.',
        'Walk the customer through the finished work before you leave. If nobody is home, add a note to the job.',
        'Leave the property tidier than you found it. Hoses coiled, gates closed, nothing left behind.',
        'Mark the job done and add a note about anything the next person should know.'
      ] },
      { id: 'show', title: 'How we show up', ordered: false, items: [
        'Clean clothes and closed-toe shoes. Ridgeline uniforms are coming soon.',
        'Introduce yourself by name and say you are with Ridgeline Wash Co.',
        'Be polite and patient with every customer, every time.',
        "No smoking, vaping or loud music on a customer's property.",
        'Park where you are not blocking anyone, unless the customer tells you otherwise.'
      ] },
      { id: 'safety', title: 'Safety first', ordered: false, items: [
        'If it is not safe, do not do it. Call Grayson.',
        'Check your ladder and the ground under it before every climb.',
        'Keep water and spray away from outlets, power lines, people and pets.',
        'Wear eye protection and gloves when you use cleaning solution.'
      ] },
      { id: 'selling', title: 'Selling the right way', ordered: false, items: [
        'Be honest about what a service will and will not do.',
        'Quote only the services and prices Grayson has approved.',
        'Enter every sale the same day and book the appointment before you leave.',
        'If someone says no, thank them and move on.'
      ] },
      { id: 'wrong', title: 'When something goes wrong', ordered: false, items: [
        'Damage or a complaint: stop, take a photo, tell the customer we will make it right, and call Grayson right away.',
        'Add a note to the job so nothing is forgotten.'
      ] }
    ],
    standardsUpdatedAt: 0
  };

  /* ---------- small helpers ---------- */

  function AppError(code, message) { this.appCode = code; this.message = message; }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }
  var SHA_K = [
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
  ];

  /* SHA-256 of a string (UTF-8), as lowercase hex. Pure JavaScript so both hosts agree. */
  function sha256(str) {
    str = String(str);
    var bytes = [], i, c;
    for (i = 0; i < str.length; i++) {
      c = str.charCodeAt(i);
      if (c < 0x80) bytes.push(c);
      else if (c < 0x800) bytes.push(0xc0 | (c >> 6), 0x80 | (c & 63));
      else if (c >= 0xd800 && c < 0xdc00 && i + 1 < str.length) {
        var cp = 0x10000 + ((c & 0x3ff) << 10) + (str.charCodeAt(++i) & 0x3ff);
        bytes.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
      } else bytes.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
    }
    var H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
    var bits = bytes.length * 8;
    bytes.push(0x80);
    while (bytes.length % 64 !== 56) bytes.push(0);
    var hi = Math.floor(bits / 0x100000000), lo = bits >>> 0;
    bytes.push((hi >>> 24) & 255, (hi >>> 16) & 255, (hi >>> 8) & 255, hi & 255,
               (lo >>> 24) & 255, (lo >>> 16) & 255, (lo >>> 8) & 255, lo & 255);
    var w = new Array(64), t;
    for (var off = 0; off < bytes.length; off += 64) {
      for (t = 0; t < 16; t++) {
        w[t] = (bytes[off + t * 4] << 24) | (bytes[off + t * 4 + 1] << 16) | (bytes[off + t * 4 + 2] << 8) | bytes[off + t * 4 + 3];
      }
      for (t = 16; t < 64; t++) {
        var s0 = rotr(w[t - 15], 7) ^ rotr(w[t - 15], 18) ^ (w[t - 15] >>> 3);
        var s1 = rotr(w[t - 2], 17) ^ rotr(w[t - 2], 19) ^ (w[t - 2] >>> 10);
        w[t] = (w[t - 16] + s0 + w[t - 7] + s1) | 0;
      }
      var a = H[0], b = H[1], cc = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
      for (t = 0; t < 64; t++) {
        var S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
        var ch = (e & f) ^ (~e & g);
        var t1 = (h + S1 + ch + SHA_K[t] + w[t]) | 0;
        var S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
        var maj = (a & b) ^ (a & cc) ^ (b & cc);
        var t2 = (S0 + maj) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = cc; cc = b; b = a; a = (t1 + t2) | 0;
      }
      H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + cc) | 0; H[3] = (H[3] + d) | 0;
      H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
    }
    var out = '';
    for (i = 0; i < 8; i++) out += ('00000000' + (H[i] >>> 0).toString(16)).slice(-8);
    return out;
  }

  /* ---------- days and times ---------- */

  function daysInMonth(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }

  function isDay(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    var y = +s.slice(0, 4), m = +s.slice(5, 7), d = +s.slice(8, 10);
    return y >= 2000 && y <= 2200 && m >= 1 && m <= 12 && d >= 1 && d <= daysInMonth(y, m);
  }

  function isHM(s) {
    return typeof s === 'string' && /^\d{2}:\d{2}$/.test(s) && +s.slice(0, 2) < 24 && +s.slice(3, 5) < 60;
  }

  function dayOf(y, m, d) { return y + '-' + pad2(m) + '-' + pad2(d); }

  function addDays(day, n) {
    var t = Date.UTC(+day.slice(0, 4), +day.slice(5, 7) - 1, +day.slice(8, 10)) + n * 86400000;
    var dt = new Date(t);
    return dayOf(dt.getUTCFullYear(), dt.getUTCMonth() + 1, dt.getUTCDate());
  }

  /* Same day of the month k months later, clamped to the month's last day (Jan 31 -> Feb 28). */
  function addMonths(day, k) {
    var y = +day.slice(0, 4), m0 = +day.slice(5, 7) - 1 + k, d = +day.slice(8, 10);
    y += Math.floor(m0 / 12);
    var m = ((m0 % 12) + 12) % 12 + 1;
    return dayOf(y, m, Math.min(d, daysInMonth(y, m)));
  }

  /* 0 = Sunday ... 6 = Saturday */
  function weekday(day) {
    return new Date(Date.UTC(+day.slice(0, 4), +day.slice(5, 7) - 1, +day.slice(8, 10))).getUTCDay();
  }

  /* Weeks run Monday to Sunday. */
  function weekStart(day) { return addDays(day, -((weekday(day) + 6) % 7)); }
  function monthStart(day) { return day.slice(0, 8) + '01'; }

  /* ---------- commission ---------- */

  /* The client's status on a given day, from its status log (oldest first). */
  function statusOn(client, day) {
    var log = (client && client.statusLog) || [], status = 'New';
    for (var i = 0; i < log.length; i++) if (log[i].day <= day) status = log[i].status;
    return status;
  }

  /* pct percent of a price in whole cents, half a cent rounding up. Worked in whole numbers,
     because in floating point 5.1% of $15.00 comes out a hair under 76.5 cents and loses a cent. */
  function share(priceCents, pct) { return Math.round(priceCents * Math.round((pct || 0) * 100) / 10000); }

  /*
   * What one sale has earned its rep so far, as dated events.
   * The sale pays firstPct of the price on the day it was sold. A monthly sale also pays
   * monthlyPct of the price on the same day of every following month, for as long as the
   * client is still New or Active on that day (paused and cancelled months pay nothing).
   * The percentages are the ones saved on the sale, so later rate changes never rewrite history.
   */
  function commissionEvents(sale, client, today) {
    var events = [{ day: sale.day, cents: share(sale.priceCents, sale.firstPct), kind: 'first' }];
    if (sale.billing === 'monthly' && client) {
      var each = share(sale.priceCents, sale.monthlyPct);
      for (var k = 1; k <= 600; k++) {
        var due = addMonths(sale.day, k);
        if (due > today) break;
        var st = statusOn(client, due);
        if (st === 'New' || st === 'Active') events.push({ day: due, cents: each, kind: 'monthly' });
      }
    }
    return events;
  }

  /* Total cents of the events dated from..to inclusive (either bound may be omitted). */
  function sumEvents(events, from, to) {
    var total = 0;
    for (var i = 0; i < events.length; i++) {
      var e = events[i];
      if ((!from || e.day >= from) && (!to || e.day <= to)) total += e.cents;
    }
    return total;
  }

  /* ---------- input checks ---------- */

  /* Text from a value a phone sent. A list or an object is not text: it counts as empty.
     (String() throws on an object such as {"toString": 1}, which a stranger could send.) */
  function str(v) { return v == null || typeof v === 'object' || typeof v === 'function' ? '' : String(v); }

  function line(v, max, required, msg) {
    var s = str(v).replace(/[\u0000-\u001f\u007f]/g, ' ').replace(/\s+/g, ' ').trim();
    if (s.length > max) s = s.slice(0, max);
    if (required && !s) throw new AppError('invalid', msg || 'Something is missing.');
    return s;
  }

  function para(v, max, required, msg) {
    var s = str(v).replace(/\r\n?/g, '\n').replace(/[\u0000-\u0008\u000b-\u001f\u007f]/g, '').trim();
    if (s.length > max) s = s.slice(0, max);
    if (required && !s) throw new AppError('invalid', msg || 'Something is missing.');
    return s;
  }

  function cents(v, msg) {
    if (typeof v !== 'number' || !isFinite(v) || v < 0 || v > LIMITS.maxCents || Math.floor(v) !== v) {
      throw new AppError('invalid', msg || 'Enter a price.');
    }
    return v;
  }

  function pct(v) {
    if (typeof v !== 'number' || !isFinite(v) || v < 0 || v > 100) throw new AppError('invalid', 'A percentage must be between 0 and 100.');
    return Math.round(v * 100) / 100;
  }

  function payLink(v) {
    var s = line(v, 301);
    if (s.length > 300) throw new AppError('invalid', 'That payment link is too long.');   /* a link cut short is a broken link */
    if (s && !/^https:\/\/[^\s<>"'`]+$/i.test(s)) throw new AppError('invalid', 'A payment link must start with https://');
    return s;
  }

  function pinOk(v) { return typeof v === 'string' && /^\d{4,6}$/.test(v); }

  function cleanSlots(list) {
    var seen = {}, out = [];
    (Array.isArray(list) ? list : []).forEach(function (s) {
      if (isHM(s) && !seen[s]) { seen[s] = 1; out.push(s); }
    });
    out.sort();
    return out.slice(0, LIMITS.slotsPerDay);
  }

  function normName(s) { return str(s).replace(/\s+/g, ' ').trim().toLowerCase(); }

  /* ---------- the core ---------- */

  function create(store, env) {
    var mem = {};

    function all(coll) { return mem[coll] || (mem[coll] = store.list(coll)); }

    function find(coll, id) {
      var list = all(coll);
      for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
      return null;
    }

    function put(coll, doc) {
      var list = all(coll), hit = false;
      for (var i = 0; i < list.length; i++) if (list[i].id === doc.id) { list[i] = doc; hit = true; break; }
      if (!hit) list.push(doc);
      store.put(coll, doc);
    }

    function del(coll, id) {
      var list = all(coll);
      for (var i = 0; i < list.length; i++) if (list[i].id === id) { list.splice(i, 1); break; }
      store.del(coll, id);
    }

    function newId(prefix) { return prefix + '_' + String(env.uuid()).replace(/[^a-zA-Z0-9]/g, '').slice(0, 14); }
    function today() { return env.dayKey(env.now()); }

    function getSettings() {
      var s = find('settings', 'main'), out = clone(DEFAULT_SETTINGS), k;
      if (s) for (k in s) if (Object.prototype.hasOwnProperty.call(s, k)) out[k] = s[k];
      return out;
    }

    function hashPin(salt, pin) { return sha256(salt + ':' + pin); }
    function randomPin() {
      var n = parseInt(sha256(env.uuid() + ':' + env.now()).slice(0, 8), 16) % 10000;
      return ('0000' + n).slice(-4);
    }

    function trimOldest(coll, keep, field) {
      var list = all(coll).slice().sort(function (a, b) { return a[field] < b[field] ? -1 : a[field] > b[field] ? 1 : 0; });
      for (var i = 0; i < list.length - keep; i++) del(coll, list[i].id);
    }

    function recordProblem(where, message) {
      try {
        put('problems', { id: newId('p'), at: env.now(), where: String(where).slice(0, 60), message: String(message).slice(0, 300) });
        trimOldest('problems', LIMITS.problemsKept, 'at');
        store.setRev(store.getRev() + 1);
      } catch (e) { /* the store itself is down; the caller still gets the error answer */ }
    }

    function tellOwner(type, text, emailSubject, emailBody) {
      put('notices', { id: newId('n'), at: env.now(), type: type, text: text });
      trimOldest('notices', LIMITS.noticesKept, 'at');
      var s = getSettings();
      if (emailSubject && s.emailOnBooking) {
        try { env.notify({ subject: emailSubject, body: emailBody || text, to: s.notifyEmail || '' }); }
        catch (e) { recordProblem('email', 'An email alert could not be sent: ' + (e && e.message ? e.message : e)); }
      }
    }

    function sessionsOf(memberId) { return all('sessions').filter(function (s) { return s.memberId === memberId; }); }

    function dropSessions(memberId, exceptHash) {
      sessionsOf(memberId).forEach(function (s) {
        if (s.id === exceptHash) return;
        store.cacheDel('sess:' + s.id);
        del('sessions', s.id);
      });
    }

    function refreshSessions(m) {
      sessionsOf(m.id).forEach(function (s) {
        if (env.now() - s.createdAt > LIMITS.sessionDays * 86400000) return;   /* expired: leave it signed out */
        store.cachePut('sess:' + s.id, JSON.stringify({ id: m.id, name: m.name, role: m.role }), 21600);
      });
    }

    function auth(token) {
      if (typeof token !== 'string' || token.length < 16 || token.length > 200) return null;
      var hash = sha256(token);
      var cached = store.cacheGet('sess:' + hash);
      if (cached) { try { var c = JSON.parse(cached); c.sess = hash; return c; } catch (e) { /* fall through */ } }
      var sess = find('sessions', hash);
      if (!sess || env.now() - sess.createdAt > LIMITS.sessionDays * 86400000) return null;
      var m = find('team', sess.memberId);
      if (!m || !m.active) return null;
      store.cachePut('sess:' + hash, JSON.stringify({ id: m.id, name: m.name, role: m.role }), 21600);
      return { id: m.id, name: m.name, role: m.role, sess: hash };
    }

    function bumpFail(key) {
      var n = (parseInt(store.cacheGet(key), 10) || 0) + 1;
      store.cachePut(key, String(n), LIMITS.lockSeconds);
      return n;
    }

    function login(req) {
      var name = normName(req.name), pin = str(req.pin);
      var wrong = new AppError('auth', 'That name and PIN do not match. Check both and try again.');
      if ((parseInt(store.cacheGet('fail:all'), 10) || 0) >= LIMITS.globalTries) {
        throw new AppError('locked', 'Sign-in is paused for a few minutes. Try again shortly.');
      }
      if (!name || !pinOk(pin)) { bumpFail('fail:all'); throw wrong; }
      var active = all('team').filter(function (m) { return m.active; });
      var hits = active.filter(function (m) { return normName(m.name) === name; });
      if (!hits.length) hits = active.filter(function (m) { return normName(m.name).split(' ')[0] === name; });
      if (hits.length !== 1) { bumpFail('fail:all'); throw wrong; }
      var m = hits[0], key = 'fail:' + m.id;
      if ((parseInt(store.cacheGet(key), 10) || 0) >= LIMITS.loginTries) {
        throw new AppError('locked', 'Too many wrong tries. Wait 15 minutes, or ask the owner to reset your PIN.');
      }
      if (hashPin(m.salt, pin) !== m.pinHash) { bumpFail(key); bumpFail('fail:all'); throw wrong; }
      store.cacheDel(key);
      var token = String(env.uuid()) + String(env.uuid());
      var hash = sha256(token);
      put('sessions', { id: hash, memberId: m.id, createdAt: env.now() });
      store.cachePut('sess:' + hash, JSON.stringify({ id: m.id, name: m.name, role: m.role }), 21600);
      return { token: token, me: { id: m.id, name: m.name, role: m.role, sess: hash } };
    }

    /* ---------- what each person is allowed to see ---------- */

    function buildSync(me, req) {
      var rev = store.getRev(), day = today();
      if (req && req.since === rev && req.day === day) return { rev: rev, today: day, same: true };
      var owner = me.role === 'owner', rep = me.role === 'rep';
      var settings = getSettings();
      var team = all('team'), clients = all('clients'), sales = all('sales'), jobs = all('jobs');
      var clientById = {}, mine = {};
      clients.forEach(function (c) { clientById[c.id] = c; });

      var myClients = owner ? clients : rep ? clients.filter(function (c) { return c.repId === me.id; }) : [];
      myClients.forEach(function (c) { mine[c.id] = 1; });
      var mySales = owner ? sales : rep ? sales.filter(function (s) { return s.repId === me.id; }) : [];
      var myJobs = owner ? jobs
        : rep ? jobs.filter(function (j) { return mine[j.clientId]; })
        : jobs.filter(function (j) { return j.assignedTo === me.id && j.status !== 'cancelled'; });

      var meDoc = find('team', me.id) || {};
      var out = {
        rev: rev, today: day, same: false,
        me: { id: me.id, name: me.name, role: me.role, noticesSeenAt: meDoc.noticesSeenAt || 0, standardsAckAt: meDoc.standardsAckAt || 0 },
        team: team.map(function (m) {
          var v = { id: m.id, name: m.name, role: m.role, active: !!m.active };
          if (owner) { v.createdAt = m.createdAt; v.standardsAckAt = m.standardsAckAt || 0; }
          return v;
        }),
        settings: owner ? settings : {
          businessName: settings.businessName, services: settings.services,
          firstPct: settings.firstPct, monthlyPct: settings.monthlyPct,
          standards: settings.standards, standardsUpdatedAt: settings.standardsUpdatedAt
        },
        days: me.role === 'tech' ? [] : all('days')
          .filter(function (d) { return d.id >= addDays(day, -45); })
          .map(function (d) { return { date: d.id, open: !!d.open, slots: d.slots || [] }; }),
        taken: me.role === 'tech' ? [] : jobs
          .filter(function (j) { return j.status !== 'cancelled' && j.date >= day; })
          .map(function (j) { return { date: j.date, time: j.time }; }),
        clients: myClients,
        sales: mySales.map(function (s) {
          var v = clone(s), c = clientById[s.clientId];
          v.clientName = c ? c.name : '';
          v.events = commissionEvents(s, c, day);
          return v;
        }),
        jobs: myJobs.map(function (j) {
          var v = clone(j), c = clientById[j.clientId] || {};
          v.client = { name: c.name || '', contact: c.contact || '', phone: c.phone || '', address: c.address || '' };
          return v;
        }),
        board: [],
        notices: owner ? all('notices') : [],
        problems: owner ? all('problems') : []
      };

      if (me.role !== 'tech') {
        var rows = {}, wk = weekStart(day), mo = monthStart(day);
        team.forEach(function (m) {
          if (m.role === 'tech') return;
          rows[m.id] = { id: m.id, name: m.name, role: m.role, active: !!m.active,
            week: { count: 0, cents: 0 }, month: { count: 0, cents: 0 }, all: { count: 0, cents: 0 } };
        });
        sales.forEach(function (s) {
          var r = rows[s.repId];
          if (!r) return;
          r.all.count++; r.all.cents += s.priceCents;
          if (s.day >= mo) { r.month.count++; r.month.cents += s.priceCents; }
          if (s.day >= wk) { r.week.count++; r.week.cents += s.priceCents; }
        });
        Object.keys(rows).forEach(function (id) {
          var r = rows[id];
          if (r.all.count > 0 || (r.active && r.role === 'rep')) out.board.push(r);
        });
      }
      return out;
    }

    /* ---------- booking ---------- */

    function assertSlotFree(date, time, ignoreJobId) {
      if (!isDay(date) || !isHM(time)) throw new AppError('invalid', 'Pick a day and a time.');
      var day = today();
      if (date < day) throw new AppError('slot_closed', 'That day has passed. Pick another day.');
      var d = find('days', date);
      if (!d || !d.open || (d.slots || []).indexOf(time) < 0) {
        throw new AppError('slot_closed', 'That time is not open. Pick another.');
      }
      if (date === day && time <= env.hm(env.now())) {
        throw new AppError('slot_closed', 'That time has already passed today. Pick another.');
      }
      var clash = all('jobs').some(function (j) {
        return j.id !== ignoreJobId && j.status !== 'cancelled' && j.date === date && j.time === time;
      });
      if (clash) throw new AppError('slot_taken', 'That time was just taken. Pick another.');
    }

    function defaultTech() {
      var id = getSettings().defaultTechId, m = id ? find('team', id) : null;
      return m && m.active ? m.id : null;
    }

    function whenText(date, time) {
      var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      var h = +time.slice(0, 2), ampm = h < 12 ? 'AM' : 'PM';
      return days[weekday(date)] + ' ' + months[+date.slice(5, 7) - 1] + ' ' + (+date.slice(8, 10)) + ', ' +
        ((h % 12) || 12) + ':' + time.slice(3, 5) + ' ' + ampm;
    }

    function money(c) { return '$' + (c / 100).toFixed(2); }

    function canTouchClient(me, client) { return me.role === 'owner' || (me.role === 'rep' && client.repId === me.id); }

    function needClient(id) {
      var c = find('clients', id);
      if (!c) throw new AppError('not_found', 'That client is no longer here.');
      return c;
    }

    function needJob(id) {
      var j = find('jobs', id);
      if (!j) throw new AppError('not_found', 'That job is no longer here.');
      return j;
    }

    function pushNote(doc, me, text) {
      doc.notes = (doc.notes || []).concat([{ at: env.now(), by: me.id, text: text }]).slice(-LIMITS.notesKept);
    }

    /* A job going back on the schedule cannot stay with someone who has left the team. */
    function dropGoneAssignee(job) {
      var m = job.assignedTo ? find('team', job.assignedTo) : null;
      if (!m || !m.active) job.assignedTo = null;
    }

    function setStatus(client, status) {
      if (client.status === status) return;
      client.status = status;
      client.statusLog = (client.statusLog || []).concat([{ day: today(), status: status }]).slice(-200);
    }

    /* ---------- actions (who may call each, and what it does) ---------- */

    var ACTIONS = {

      saveMember: { roles: ['owner'], run: function (me, req) {
        var m = req.member || {};
        var name = line(m.name, 40, true, 'Add a name.');
        if (ROLES.indexOf(m.role) < 0) throw new AppError('invalid', 'Pick a role.');
        var clash = all('team').some(function (t) { return t.active && t.id !== m.id && normName(t.name) === normName(name); });
        if (clash) throw new AppError('invalid', 'Someone on the team already has that name. Add a last initial.');
        if (m.id) {
          var cur = find('team', m.id);
          if (!cur || !cur.active) throw new AppError('not_found', 'That person is no longer on the team.');
          if (cur.role === 'owner' && m.role !== 'owner') {
            var owners = all('team').filter(function (t) { return t.active && t.role === 'owner'; }).length;
            if (owners < 2) throw new AppError('invalid', 'There has to be at least one owner.');
          }
          var roleChanged = cur.role !== m.role;
          cur.name = name; cur.role = m.role;
          put('team', cur);
          if (roleChanged && cur.id !== me.id) dropSessions(cur.id); else refreshSessions(cur);
          return { id: cur.id };
        }
        if (m.pin != null && m.pin !== '' && !pinOk(str(m.pin))) throw new AppError('invalid', 'A PIN is 4 to 6 digits.');
        var pin = m.pin ? str(m.pin) : randomPin(), salt = String(env.uuid());
        var doc = { id: newId('m'), name: name, role: m.role, salt: salt, pinHash: hashPin(salt, pin), active: true, createdAt: env.now() };
        put('team', doc);
        return { id: doc.id, pin: pin };
      } },

      removeMember: { roles: ['owner'], run: function (me, req) {
        var m = find('team', req.id);
        if (!m || !m.active) throw new AppError('not_found', 'That person is no longer on the team.');
        if (m.id === me.id) throw new AppError('invalid', 'You cannot remove yourself.');
        m.active = false; m.removedAt = env.now();
        put('team', m);
        dropSessions(m.id);
        all('jobs').filter(function (j) { return j.assignedTo === m.id && j.status === 'scheduled'; })
          .forEach(function (j) { j.assignedTo = null; put('jobs', j); });
        var s = find('settings', 'main');
        if (s && s.defaultTechId === m.id) { s.defaultTechId = null; put('settings', s); }
        return { id: m.id };
      } },

      resetPin: { roles: ['owner'], run: function (me, req) {
        var m = find('team', req.id);
        if (!m || !m.active) throw new AppError('not_found', 'That person is no longer on the team.');
        if (m.id === me.id) throw new AppError('invalid', 'Use Change PIN for your own PIN.');
        if (req.pin != null && req.pin !== '' && !pinOk(str(req.pin))) throw new AppError('invalid', 'A PIN is 4 to 6 digits.');
        var pin = req.pin ? str(req.pin) : randomPin();
        m.salt = String(env.uuid()); m.pinHash = hashPin(m.salt, pin);
        put('team', m);
        dropSessions(m.id);
        store.cacheDel('fail:' + m.id);
        return { id: m.id, pin: pin };
      } },

      changePin: { roles: ROLES, run: function (me, req) {
        var m = find('team', me.id);
        if (!m) throw new AppError('auth', 'Please sign in again.');
        if (hashPin(m.salt, str(req.oldPin)) !== m.pinHash) throw new AppError('invalid', 'Your current PIN is not right.');
        if (!pinOk(str(req.newPin))) throw new AppError('invalid', 'A PIN is 4 to 6 digits.');
        m.salt = String(env.uuid()); m.pinHash = hashPin(m.salt, str(req.newPin));
        put('team', m);
        dropSessions(m.id, me.sess);
        return {};
      } },

      saveSettings: { roles: ['owner'], run: function (me, req) {
        var p = req.settings || {}, s = getSettings();
        if (p.services !== undefined) {
          if (!Array.isArray(p.services) || !p.services.length || p.services.length > LIMITS.services) {
            throw new AppError('invalid', 'Keep at least one service on the list.');
          }
          var seen = Object.create(null);   /* not {}: a service may be named "constructor" */
          s.services = p.services.map(function (x) {
            var name = line(x && x.name, 40, true, 'Every service needs a name.');
            if (seen[normName(name)]) throw new AppError('invalid', 'Two services have the same name.');
            seen[normName(name)] = 1;
            return { id: line(x.id, 30) || newId('s'), name: name, priceCents: cents(x.priceCents == null ? 0 : x.priceCents, 'Check the service prices.') };
          });
        }
        if (p.firstPct !== undefined) s.firstPct = pct(p.firstPct);
        if (p.monthlyPct !== undefined) s.monthlyPct = pct(p.monthlyPct);
        if (p.defaultSlots !== undefined) {
          s.defaultSlots = cleanSlots(p.defaultSlots);
          if (!s.defaultSlots.length) throw new AppError('invalid', 'Keep at least one time slot.');
        }
        if (p.defaultTechId !== undefined) {
          var t = p.defaultTechId ? find('team', p.defaultTechId) : null;
          if (p.defaultTechId && (!t || !t.active)) throw new AppError('invalid', 'Pick someone who is on the team.');
          s.defaultTechId = t ? t.id : null;
        }
        if (p.notifyEmail !== undefined) {
          var em = line(p.notifyEmail, 120);
          if (em && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) throw new AppError('invalid', 'That email address does not look right.');
          s.notifyEmail = em;
        }
        if (p.emailOnBooking !== undefined) s.emailOnBooking = !!p.emailOnBooking;
        if (p.standards !== undefined) {
          if (!Array.isArray(p.standards) || p.standards.length > LIMITS.standardSections) {
            throw new AppError('invalid', 'Keep the standards to ' + LIMITS.standardSections + ' sections or fewer.');
          }
          var next = p.standards.map(function (sec) {
            var items = (Array.isArray(sec && sec.items) ? sec.items : [])
              .map(function (it) { return line(it, LIMITS.standardLine); })
              .filter(function (it) { return it; })
              .slice(0, LIMITS.standardItems);
            return { id: line(sec && sec.id, 30) || newId('st'), title: line(sec && sec.title, 60, true, 'Every section needs a title.'),
              ordered: !!(sec && sec.ordered), items: items };
          });
          if (JSON.stringify(next) !== JSON.stringify(s.standards)) { s.standards = next; s.standardsUpdatedAt = env.now(); }
        }
        s.id = 'main';
        put('settings', s);
        return {};
      } },

      /* Open or block days and set each day's time slots. Existing bookings are never removed. */
      setDays: { roles: ['owner'], run: function (me, req) {
        var list = Array.isArray(req.days) ? req.days : [];
        if (!list.length || list.length > LIMITS.daysPerCall) throw new AppError('invalid', 'Pick at least one day.');
        var defaults = getSettings().defaultSlots;
        var docs = list.map(function (d) {
          if (!d || !isDay(d.date)) throw new AppError('invalid', 'One of those days is not a real date.');
          var cur = find('days', d.date);
          var slots = d.slots !== undefined ? cleanSlots(d.slots) : (cur && cur.slots && cur.slots.length ? cur.slots : defaults.slice());
          if (d.open && !slots.length) slots = defaults.slice();
          return { id: d.date, open: !!d.open, slots: slots };
        });
        docs.forEach(function (doc) { put('days', doc); });
        return { count: docs.length };
      } },

      /* A sale, and (normally) its appointment, saved together or not at all. */
      createSale: { roles: ['owner', 'rep'], run: function (me, req) {
        var day = today(), now = env.now(), settings = getSettings();
        var service = line(req.service, 60, true, 'Pick what was sold.');
        var price = cents(req.priceCents, 'Enter the price.');
        var billing = BILLING.indexOf(req.billing) >= 0 ? req.billing : 'once';
        var notes = para(req.notes, LIMITS.text);
        var repId = me.id;
        if (me.role === 'owner' && req.repId) {
          var r = find('team', req.repId);
          if (!r || !r.active || r.role === 'tech') throw new AppError('invalid', 'Pick a sales rep who is on the team.');
          repId = r.id;
        }
        var client, isNew = !req.clientId;
        if (isNew) {
          var c = req.client || {};
          client = {
            id: newId('c'), name: line(c.name, LIMITS.name, true, 'Add the customer or business name.'),
            contact: line(c.contact, LIMITS.name), phone: line(c.phone, 30), email: line(c.email, 120),
            address: line(c.address, LIMITS.line), status: 'New', statusLog: [{ day: day, status: 'New' }],
            service: service, priceCents: price, billing: billing, startDate: day, repId: repId,
            stripeLink: payLink(req.stripeLink), payStatus: 'unpaid', notes: [], createdAt: now
          };
        } else {
          client = needClient(req.clientId);
          if (!canTouchClient(me, client)) throw new AppError('forbidden', 'That client belongs to another rep.');
        }
        var appt = req.appointment || null;
        if (appt) assertSlotFree(appt.date, appt.time);
        var what = line(req.what, LIMITS.line) || service;

        var sale = {
          id: newId('s'), clientId: client.id, repId: repId, service: service, priceCents: price, billing: billing,
          notes: notes, soldAt: now, day: day, firstPct: settings.firstPct, monthlyPct: settings.monthlyPct, jobId: null
        };
        var job = null;
        if (appt) {
          job = {
            id: newId('j'), clientId: client.id, saleId: sale.id, date: appt.date, time: appt.time, what: what,
            assignedTo: defaultTech(), status: 'scheduled', doneAt: null, doneBy: null, notes: [], createdBy: me.id, createdAt: now
          };
          sale.jobId = job.id;
        }
        if (!isNew) {
          client.service = service; client.priceCents = price; client.billing = billing;
          if (client.status === 'Cancelled' || client.status === 'Paused') setStatus(client, 'Active');
        }
        if (notes) pushNote(client, me, notes);
        put('clients', client);
        put('sales', sale);
        if (job) put('jobs', job);

        if (me.role !== 'owner') {
          var head = me.name + ' sold ' + service + ' to ' + client.name + ' for ' + money(price) + (billing === 'monthly' ? ' a month' : '');
          var text = job ? head + '. Booked ' + whenText(job.date, job.time) + '.' : head + '. No appointment booked yet.';
          tellOwner(job ? 'booking' : 'sale', text,
            job ? 'Appointment booked: ' + client.name + ', ' + whenText(job.date, job.time) : 'New sale, no appointment yet: ' + client.name,
            text + '\n\n' + (client.address ? 'Address: ' + client.address + '\n' : '') + (client.phone ? 'Phone: ' + client.phone + '\n' : '') +
              (job && !job.assignedTo ? '\nNobody is assigned to this job yet.' : ''));

    job.doneBy = done ? me.id : null;
    changed();
    opId = opId || newId();
    send('setJobDone', { jobId: jobId, done: done }, { opId: opId }).then(function (res) {
      if (res.ok) return;
      var now = App.job(jobId);
      if (now && now.status === (done ? 'done' : 'scheduled') && now.doneAt === stamp) {
        now.status = before.status; now.doneAt = before.doneAt; now.doneBy = before.doneBy;
        changed();

      App.toast(res.error.message, { bad: true, retry: res.error.code === 'network' ? function () { setDone(jobId, done, opId); } : null });
