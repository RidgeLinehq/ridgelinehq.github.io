 * same actions the app calls (core.handle), with a clock that is moved through the last two
 * months. So every sample sale, job, note and alert is something the real system could hold.
 *
 *   RidgelineSample.PEOPLE                 the sample team with their sign-in PINs
 *   RidgelineSample.build(clock) -> dump   a memoryStore dump ({ rev, data }) for "now"
 *     clock: { now: ms, dayKey(ms) -> 'YYYY-MM-DD', hm(ms) -> 'HH:MM', uuid() -> string }
 *
 * Everything is placed relative to today, so today always has four jobs (8:00 done, 9:30,
 * 12:00, 2:00 with nobody assigned), yesterday has one job that was never marked done, one
 * client is late paying, one is paused and one has cancelled, and the next three weeks have
 * open days with a few times taken.
 */
var RidgelineSample = (function () {
  'use strict';

  var PEOPLE = [
    { name: 'Grayson', role: 'owner', pin: '1234' },
    { name: 'Mason', role: 'rep', pin: '2222' },
    { name: 'Avery', role: 'rep', pin: '3333' },
    { name: 'Cole', role: 'tech', pin: '4444' }
  ];
  var TOWN = ', Smithville, TN 37166';

  function build(clock) {
    var Core = RidgelineCore, D = Core.dates;
    var t = clock.now, today = clock.dayKey(clock.now);
    var store = Core.memoryStore();
    store.setClock(function () { return t; });
    var core = Core.create(store, {
      now: function () { return t; }, dayKey: clock.dayKey, hm: clock.hm, uuid: clock.uuid, notify: function () {}
    });

    /* ----- moving the clock ----- */
    function minutes(hm) { return +hm.slice(0, 2) * 60 + +hm.slice(3, 5); }
    function dayNumber(day) { return Date.UTC(+day.slice(0, 4), +day.slice(5, 7) - 1, +day.slice(8, 10)) / 86400000; }
    /* The moment that reads as `day` at `hm` on this phone (a few passes settle clock changes). */
    function moment(day, hm) {
      var ms = clock.now;
      for (var i = 0; i < 4; i++) {
        var off = (dayNumber(day) - dayNumber(clock.dayKey(ms))) * 1440 + minutes(hm) - minutes(clock.hm(ms));
        if (!off) break;
        ms += off * 60000;
      }
      return ms;
    }
    function day(offset) { return D.addDays(today, offset); }
    /* Set the clock to `offset` days from today at `hm`, but never later than right now. */
    function at(offset, hm) { t = Math.min(moment(day(offset), hm), clock.now); }

    /* ----- calling the core like the app does ----- */
    function call(token, action, fields) {
      var req = { action: action, token: token }, k;
      for (k in fields || {}) req[k] = fields[k];
      var res = core.handle(req);
      if (!res.ok) throw new Error('Sample data could not be built (' + action + '): ' + res.error.message);
      return res.result;
    }
    function signIn(person) { return call(null, 'login', { name: person.name, pin: person.pin }).token; }

    /* ----- the team ----- */
    at(-66, '08:00');
    core.bootstrap({ name: PEOPLE[0].name, pin: PEOPLE[0].pin });
    var owner = signIn(PEOPLE[0]);
    var ids = {}, tokens = { Grayson: owner };
    PEOPLE.slice(1).forEach(function (p) {
      ids[p.name] = call(owner, 'saveMember', { member: { name: p.name, role: p.role, pin: p.pin } }).id;
      tokens[p.name] = signIn(p);
    });
    call(owner, 'saveSettings', { settings: { services: [
      { id: 'windows', name: 'Window cleaning', priceCents: 15000 },
      { id: 'house', name: 'House wash', priceCents: 30000 },
      { id: 'pressure', name: 'Pressure wash', priceCents: 20000 }
    ] } });

    /* ----- availability: every past day was open; the next three weeks are weekdays, short Saturdays ----- */
    var past = [], i;
    for (i = -66; i < 0; i++) past.push({ date: day(i), open: true });
    call(owner, 'setDays', { days: past.slice(0, 40) });
    call(owner, 'setDays', { days: past.slice(40) });
    var ahead = [], openAhead = [], blockedOne = false;
    for (i = 0; i <= 21; i++) {
      var wd = D.weekday(day(i)), open = i === 0 || (wd >= 1 && wd <= 6);
      if (!blockedOne && i >= 9 && wd >= 2 && wd <= 4) { open = false; blockedOne = true; }   /* one day off */
      var entry = { date: day(i), open: open };
      if (open && wd === 6 && i !== 0) entry.slots = ['09:30', '12:00'];
      ahead.push(entry);
      if (open && wd >= 1 && wd <= 5) openAhead.push(i);
    }
    call(owner, 'setDays', { days: ahead });
    /* The first open weekday that is at least `min` days away. */
    function openDay(min) {
      for (var n = 0; n < openAhead.length; n++) if (openAhead[n] >= min) return day(openAhead[n]);
      return day(openAhead[openAhead.length - 1]);
    }

    /* ----- small helpers for the story below ----- */
    function sell(rep, client, service, cents, billing, what, visit, notes) {
      client.address += TOWN;
      return call(tokens[rep], 'createSale', {
        client: client, service: service, priceCents: cents, billing: billing, what: what, notes: notes || '',
        appointment: visit ? { date: visit[0], time: visit[1] } : null
      });
    }
    function assign(jobId) { call(owner, 'updateJob', { jobId: jobId, patch: { assignedTo: ids.Cole } }); }
    function finish(jobId) { call(tokens.Cole, 'setJobDone', { jobId: jobId, done: true }); }
    function paid(clientId, status) { call(owner, 'updateClient', { clientId: clientId, patch: { payStatus: status || 'paid' } }); }
    function visit(clientId, date, time, what) { return call(owner, 'bookJob', { clientId: clientId, date: date, time: time, what: what }).jobId; }

    /* ----- two months of business, oldest first ----- */
    at(-64, '10:15');
    var main = sell('Mason', { name: 'Main Street Storefront', contact: 'Dana Whitfield', phone: '615-555-0112', email: 'dana@example.com', address: '104 W Main St' },
      'Window cleaning', 15000, 'monthly', 'Storefront windows, inside and out', [day(-60), '08:00'], 'Wants the first slot of the day, before the shop opens.');
    assign(main.jobId);
    at(-60, '08:50'); finish(main.jobId);
    at(-59, '09:00'); paid(main.clientId);

    at(-55, '14:30');
    var pine = sell('Avery', { name: 'Pine Ridge Lake House', contact: 'Hank Sutton', phone: '615-555-0118', email: '', address: '9 Pine Ridge Rd' },
      'Window cleaning', 14000, 'monthly', 'Lake-side windows and the sunroom', [day(-52), '09:30']);
    assign(pine.jobId);
    at(-52, '10:50'); finish(pine.jobId);
    at(-51, '09:00'); paid(pine.clientId);

    at(-47, '13:10');
    var maple = sell('Mason', { name: 'Maple Court Rental', contact: 'Gail Norris', phone: '615-555-0176', email: '', address: '31 Maple Ct' },
      'Pressure wash', 9000, 'monthly', 'Walkways and the shared patio', [day(-45), '12:00']);
    assign(maple.jobId);
    at(-45, '13:25'); finish(maple.jobId);
    at(-44, '09:00'); paid(maple.clientId);

    at(-41, '11:05');
    var cafe = sell('Mason', { name: 'Hilltop Cafe', contact: 'Luis Ortega', phone: '615-555-0127', email: '', address: '36 Hilltop Ave' },
      'Window cleaning', 12000, 'monthly', 'Front windows and the patio doors', [day(-38), '08:00']);
    assign(cafe.jobId);
    at(-38, '08:45'); finish(cafe.jobId);

    at(-34, '09:10');
    var mainSecond = visit(main.clientId, day(-30), '08:00', 'Storefront windows, inside and out');
    assign(mainSecond);
    at(-33, '15:40');
    var feed = sell('Avery', { name: 'County Line Feed Store', contact: 'Ray Dalton', phone: '615-555-0164', email: '', address: '2301 County Line Rd' },
      'Pressure wash', 40000, 'once', 'Loading dock and front walk', [day(-31), '12:00']);
    assign(feed.jobId);
    at(-31, '13:35'); finish(feed.jobId);
    at(-30, '08:55'); finish(mainSecond); paid(feed.clientId);

    /* One client on hold and one who has left, both before their second month came due. */
    at(-28, '10:20');
    call(owner, 'updateClient', { clientId: pine.clientId, patch: { status: 'Paused' } });
    call(owner, 'addNote', { kind: 'client', id: pine.clientId, text: 'Away for a few months. Paused until they call us to start again.' });

    at(-27, '13:20');
    var miller = sell('Avery', { name: 'Miller Family Home', contact: 'Beth Miller', phone: '615-555-0139', email: 'beth@example.com', address: '905 Miller Rd' },
      'House wash', 32500, 'once', 'Whole house wash, vinyl siding', [day(-24), '09:30'], 'Asked us to skip the back deck. It was just stained.');
    assign(miller.jobId);
    at(-24, '11:10'); finish(miller.jobId);
    at(-23, '09:00'); paid(miller.clientId);

    at(-21, '15:00');
    call(owner, 'updateClient', { clientId: maple.clientId, patch: { status: 'Cancelled' } });
    call(owner, 'addNote', { kind: 'client', id: maple.clientId, text: 'The owner sold the property, so the monthly service ended.' });

    at(-20, '08:05'); call(tokens.Avery, 'ackStandards', {});

    at(-10, '09:00');
    var cafeSecond = visit(cafe.clientId, day(-8), '08:00', 'Front windows and the patio doors');
    assign(cafeSecond);
    var mainToday = visit(main.clientId, day(0), '08:00', 'Storefront windows, inside and out');
    assign(mainToday);
    var cafeNext = visit(cafe.clientId, openDay(5), '08:00', 'Front windows and the patio doors');
    assign(cafeNext);

    at(-9, '14:10');
    var dental = sell('Avery', { name: 'Lakeview Dental Office', contact: 'Priya Nair', phone: '615-555-0171', email: '', address: '1250 Lakeview Dr' },
      'Window cleaning', 18000, 'monthly', 'Lobby windows and the glass entry', [day(-1), '14:00']);
    assign(dental.jobId);
    call(tokens.Avery, 'addNote', { kind: 'job', id: dental.jobId, text: 'The front desk asked us to come after 1 PM.' });
    at(-8, '08:40'); finish(cafeSecond);

    at(-6, '16:30');
    var parker = sell('Mason', { name: 'Parker Residence', contact: 'Jamie Parker', phone: '615-555-0142', email: '', address: '218 Parker Ln' },
      'Window cleaning', 15000, 'once', 'Exterior window cleaning', [day(0), '09:30']);
    assign(parker.jobId);
    call(tokens.Mason, 'addNote', { kind: 'job', id: parker.jobId, text: 'The side gate sticks. Lift it and push.' });
    at(-5, '10:00'); paid(cafe.clientId, 'late');

    at(-4, '12:45');
    var cedar = sell('Avery', { name: 'Cedar Lane Home', contact: 'Tom Reyes', phone: '615-555-0158', email: '', address: '412 Cedar Ln' },
      'House wash', 30000, 'once', 'House wash', [day(0), '12:00']);
    assign(cedar.jobId);

    at(-3, '12:00'); call(owner, 'readNotices', {});
    var feedNext = visit(feed.clientId, openDay(8), '12:00', 'Parking lot pressure wash');
    assign(feedNext);

    at(-2, '17:15');
    sell('Mason', { name: 'Oak Hill Driveway', contact: 'Sam Carter', phone: '615-555-0183', email: '', address: '77 Oak Hill Rd' },
      'Pressure wash', 22500, 'once', 'Driveway and front walk', [day(0), '14:00']);   /* nobody assigned yet */

    at(-1, '16:20');
    sell('Avery', { name: 'Walnut Street Duplex', contact: 'Chris Lane', phone: '615-555-0196', email: '', address: '64 Walnut St' },
      'House wash', 26000, 'once', 'House wash', null, 'They will call back with a day that works.');

    at(0, '08:52'); finish(mainToday);

    t = clock.now - 10 * 60000;
    var cabin = sell('Mason', { name: 'Dry Creek Cabin', contact: 'Nora Bell', phone: '615-555-0105', email: '', address: '18 Dry Creek Rd' },
      'House wash', 28000, 'once', 'Cabin wash, wood siding, low pressure', [openDay(2), '09:30']);
    assign(cabin.jobId);

    /* Leave nobody signed in. */
    t = clock.now;
    PEOPLE.forEach(function (p) { call(tokens[p.name], 'logout', {}); });
    return store.dump();
  }

  return { PEOPLE: PEOPLE, build: build };
})();

/*
 * Ridgeline Wash Co. team app: the foundation.
 * Sample or real mode, talking to the system, staying live, the router and tab bar, sheets,
 * toasts, the shared UI pieces, sign-in, Today, Company standards and the Me sheet.
 *
 * ============================ WHAT OTHER FILES MAY USE ============================
 * Everything hangs on the one global `App`. Wrap your file in an IIFE and register at load time;
 * the app itself starts on DOMContentLoaded, after every file has registered.
 *
 * SCREENS AND ROUTES
 *   App.screen(route, { roles, title, render(root) })   register a screen. `roles` omitted = everyone.
 *       App.screen('sales', { roles: ['owner', 'rep'], title: 'Sales', render: function (root) { root.appendChild(App.ui.title('Sales')); } });
 *       `root` is emptied before every render and stacks its children with a 16px gap. Keep your own
 *       view state (filters, the month shown) in variables in your file and render from them: render
 *       runs again whenever the data changes. Scroll position is kept, and so is any text typed
 *       into an input that has a `name` (give App.ui.field a name: App.ui.field({ name: 'find' })).
 *   App.go(route)                 switch screen (closes any open sheet first).      App.go('calendar');
 *   App.route                     the current route name, for example 'today'.
 *   App.actions                   cross-screen entry points. Register yours:        App.actions.openClient = function (id) { ... };
 *       Names in use: newSale({date, clientId}), openClient(id), bookVisit(clientId), openTeam(),
 *       openSettings(), openNotices(), editStandards().
 *   App.act(name, arg)            call one if it exists (says "coming soon" if not). App.act('newSale', { date: '2026-11-19' });
 *
 * THE DATA (always the latest answer from the system; never keep your own copy)
 *   App.data                      the snapshot from brief-product.md: me, team, settings, days, taken, clients, sales, jobs, board, notices, problems.
 *   App.mode                      'sample' or 'live'.                               if (App.mode === 'sample') ...
 *   App.me()                      who is signed in: { id, name, role, ... }.        App.me().name
 *   App.role()                    'owner' | 'rep' | 'tech'.                         if (App.role() === 'owner') ...
 *   App.today()                   the business day, 'YYYY-MM-DD' (from the system, not the phone).
 *   App.member(id)                a team member or null.                            App.member(sale.repId)
 *   App.nameOf(id, fallback)      a team member's name.                             App.nameOf(job.assignedTo, 'Unassigned')
 *   App.people(roles)             active team members, optionally only some roles.  App.people(['rep'])
 *   App.client(id), App.job(id), App.sale(id)        find one thing in the data, or null.
 *   App.jobsOn(date)              that day's jobs you can see (not cancelled), in time order.
 *   App.isOverdue(job)            still scheduled and its day has passed.
 *   App.dayOf(date)               the owner's setting for a day: { date, open, slots } or null (not listed = blocked).
 *   App.freeSlots(date)           the times still free that day.                    App.freeSlots('2026-11-19') -> ['09:30', '14:00']
 *   App.freeDays()                every day from today on that still has a free time, in order.
 *   App.needsStandards()          true while I still have to confirm the company standards.
 *   App.hasRead(member)           has this person confirmed the current standards (owner's view of the team).
 *
 * TALKING TO THE SYSTEM
 *   App.api.send(action, fields, opts) -> Promise of the answer { ok, result, error: { code, message } }.
 *       Adds token, since, day and a fresh opId; applies the returned data (which re-renders); never rejects.
 *       A failed call (no signal, time-out, not our JSON) answers { ok: false, error: { code: 'network', message } }.
 *       Pass opts.opId to retry the same action without saving twice.
 *       App.api.send('addNote', { kind: 'client', id: c.id, text: text }).then(function (res) { if (res.ok) ... });
 *       error.message is already plain words for the team: show it as it is. The codes worth a branch are
 *       'slot_taken' / 'slot_closed' (the time is gone: picker.setError(res.error.message)) and 'network'.
 *       An 'auth' answer signs the phone out and shows sign-in by itself.
 *   App.ui.save(button, action, fields, opts) -> Promise of the answer. The whole save pattern for any button:
 *       disables it and shows "Saving...", sends, re-uses the opId when tapped again after a failure, and shows
 *       the message in opts.errorEl (or a red toast). opts: { errorEl, quiet, busyText }.
 *       App.ui.save(btn, 'updateClient', { clientId: id, patch: { payStatus: 'paid' } }, { errorEl: err });
 *   Inside a sheet use sheet.send(action, fields) instead (see SHEETS): same thing on the footer button.
 *       Both answer { ok: false, skipped: true } when the button is already busy saving, so a double tap does nothing.
 *
 * RE-RENDERING WHEN DATA CHANGES
 *   App.refresh()                 re-render the current screen and tell open sheets and live pieces. Call it after
 *                                 you change your own view state.                   filter = 'Active'; App.refresh();
 *   App.on(event, fn) -> off()    'data' (new data applied), 'route' (screen changed), 'tick' (every 20 seconds).
 *   App.live(el, fn)              call fn on every data change and tick for as long as el is on the page.
 *       App.live(listEl, function () { drawList(listEl); });
 *
 * SHEETS, TOASTS, CONFIRM
 *   App.sheet.open({ title, small, body(el, sheet), footer: { label, onTap(sheet), kind }, update(sheet), onClose() }) -> sheet
 *       A panel that slides up. `body` builds the scrolling part once. `footer` adds one sticky button.
 *       `update` runs when new data arrives while the sheet is open: change only what needs changing, so
 *       nothing typed is lost (or call sheet.rebuild() when the sheet holds no input). small: true = only as
 *       tall as its content. The phone's back button closes the top sheet.
 *       var sh = App.sheet.open({ title: 'Add note', small: true, body: function (el) { el.appendChild(box); },
 *         footer: { label: 'Save note', onTap: function (sh) { sh.send('addNote', {...}).then(function (res) { if (res.ok) sh.close(); }); } } });
 *     sheet.el, sheet.body, sheet.button     the panel, the scrolling body, the footer button (or null)
 *     sheet.setTitle(text)                   sheet.setButton(label, disabled)     (setButton(null) hides the footer button)
 *     sheet.note(text)                       a quiet line just above the footer button ("You earn $45.00 on this sale.")
 *     sheet.error(message)                   red words just above the footer button ('' clears them)
 *     sheet.send(action, fields, opts)       save from the footer button: "Saving...", same opId on a retry, shows the
 *                                            message on failure, resolves with the answer. opts: { button, quiet, busyText }
 *     sheet.rebuild()                        run `body` again, keeping the scroll position
 *     sheet.reveal(el)                       scroll the body to an element (the first missing field)
 *     sheet.close()                          close it (and anything opened on top of it)
 *   App.sheet.closeAll()
 *   App.toast(text, opts)         a short message. opts: { bad: true, retry: fn, action: { label, onTap }, ms }.
 *       App.toast('Sale saved.');     App.toast(res.error.message, { bad: true, retry: tryAgain });
 *   App.confirm({ title, text, yes, no, danger }) -> Promise of true or false. In-page, never the browser's own.
 *       App.confirm({ title: 'Delete this client?', text: 'Their sales and jobs go too.', yes: 'Delete client', danger: true }).then(function (ok) { ... });
 *
 * BUILDING THINGS (text from people is always safe: strings become text nodes, never HTML)
 *   Classes for everything (cards, lists, rows, label-value rows, stat blocks, pills, buttons, fields, chips,
 *   callouts, legends) are in app.css, each with a comment naming it; its index is at the top of that file.
 *   Inside a sheet (which is slate already) a .card turns into a darker well by itself.
 *   App.h(tag, attrs, ...children) -> element. attrs: class, text, on<event>, anything else is an attribute.
 *       App.h('p', { class: 'muted' }, 'Sold by ', App.h('b', null, name))
 *   App.esc(text)                 escape &<>"' for the rare case you must build an HTML string.
 *   App.icon(name, size) -> <svg> Names: today sales calendar clients dashboard leaders schedule standards bell close
 *       chevron-left chevron-right chevron-down phone directions note edit check check-circle plus minus search user
 *       team settings key shirt signout reset clock pin alert info copy external trash mail repeat dollar
 *
 * FORM HELPERS (each returns an element with a few methods on it)
 *   App.ui.field({ label, name, type, value, placeholder, hint, optional, prefix, options, rows, inputmode, autocomplete,
 *                  maxlength, autocapitalize, onInput }) -> el with el.input, el.val() (trimmed), el.setError(message)
 *       type: 'text' (default), 'tel', 'email', 'password', 'date', 'time', 'textarea', 'select' (options: [{ value, label }]).
 *       var price = App.ui.field({ label: 'Price', name: 'price', inputmode: 'decimal', prefix: '$' });  price.setError('Enter the price.');
 *   App.ui.segmented({ options: [{ value, label }], value, onChange, label }) -> el with el.get(), el.set(value)
 *       App.ui.segmented({ options: [{ value: 'once', label: 'One-time' }, { value: 'monthly', label: 'Monthly' }], value: 'once', onChange: fn })
 *   App.ui.chips({ options: [{ value, label, count }], value, multi, big, scroll, onChange }) -> el with el.get(), el.set(v), el.setOptions(list)
 *       One choice by default (value), several with multi: true (value is an array). big: large chips (times). scroll: one sliding line.
 *       canClear: true lets a tap on the chosen chip clear it (el.get() is then null).
 *       App.ui.chips({ options: [{ value: '', label: 'All', count: 9 }, { value: 'New', label: 'New', count: 3 }], value: '', scroll: true, onChange: fn })
 *   App.ui.toggle({ label, hint, checked, onChange }) -> el with el.get(), el.set(bool)      (also App.ui['switch'])
 *       App.ui.toggle({ label: 'Open for appointments', checked: day.open, onChange: function (on) { ... } })
 *   App.ui.button(label, { kind, icon, small, block, href, newTab, onTap }) -> <button> or <a>
 *       kind: 'primary' | 'quiet' (default) | 'danger' | 'text'.       App.ui.button('New sale', { kind: 'primary', block: true, onTap: fn })
 *
 * DISPLAY HELPERS
 *   App.ui.title(text, lead)      the screen title with an optional quiet line under it.
 *   App.ui.label(text, { count, tone })     the tiny uppercase section label. tone: 'bad' | 'warn' | 'good' | 'mute'.
 *   App.ui.pill(text, tone)       tone: 'good' | 'warn' | 'bad' | 'ice' | 'mute'.
 *   App.ui.jobPill(job)           Scheduled / Done / Overdue / Cancelled.
 *   App.ui.clientPill(status)     New / Active / Paused / Cancelled.
 *   App.ui.payPill(payStatus)     Not paid yet / Paid / Late.
 *   App.ui.row({ lead, icon, title, sub, right, chevron, onTap, cls }) -> one list row (a button when onTap is given). Put rows in App.h('div', { class: 'list' }).
 *       lead, title, sub, right: text or elements. sub may be a list of lines. cls: 'is-you' (my row in a ranking), 'row-clip' (one line each), 'is-off', 'row-danger'.
 *       App.ui.row({ title: c.name, sub: 'Window cleaning, $150.00 a month', right: App.ui.clientPill(c.status), onTap: function () { App.act('openClient', c.id); } })
 *   App.ui.kv(label, value)       one label-value row; put them in App.h('div', { class: 'kvs' }). value: text or an element.
 *   App.ui.stats([{ value, unit, label, tone }])     the slim summary card of numbers side by side.
 *   App.ui.empty({ title, text, button: { label, onTap, kind } })     an empty state with one next step.
 *   App.ui.notes(list)            note history, newest first (who, when, text).
 *   App.ui.addNote(kind, id)      open the small "Add note" sheet. kind: 'job' | 'client'.
 *   App.ui.jobCard(job, { showDate })       the full job card with its actions (Call, Directions, Add note, Mark done).
 *   App.ui.jobRow(job, { showDate, sub, pill })   a compact row (time, client, what, address) that opens the Job sheet. pill: false hides the status.
 *   App.ui.openJob(jobId)         open the Job sheet (details, notes, and for the owner assign, move, change, cancel).
 *   App.ui.monthGrid({ month, min, max, day(date), onPick(date), onMonth(ym) }) -> el with el.refresh(), el.setMonth(ym), el.getMonth()
 *       A month of days, Sunday first, with arrows. For each day your `day(date)` returns
 *       { state: 'open' | 'full' | 'blocked' | 'past', label: '3 left', disabled: bool, selected: bool }.

  ui.slotPicker = function (o) {

        return;

      if (!free.length) { times.appendChild(h('p', { class: 'muted' }, 'No times left on this day. Pick another day.')); return; }

    rep: 'Enters their own sales and books the appointments.',
    tech: 'Sees the jobs given to them and marks them done.',
    owner: 'Sees and controls everything, like you.'
  };
  var ROLE_ORDER = ['rep', 'tech', 'owner'];
  var NAME_TAKEN = 'Someone on the team already has that name. Add a last initial.';

  /* ================= small helpers ================= */

  function clear(el) { el.textContent = ''; return el; }
  function byWhen(a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.time < b.time ? -1 : a.time > b.time ? 1 : 0; }
  function byName(a, b) {
    var x = String(a.name || '').toLowerCase(), y = String(b.name || '').toLowerCase();
    return x < y ? -1 : x > y ? 1 : 0;
  }
  function norm(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim().toLowerCase(); }
  /* One line of text the way the system will store it. */
  function oneLine(s) { return String(s == null ? '' : s).replace(/[\u0000-\u001f\u007f]/g, ' ').replace(/\s+/g, ' ').trim(); }
  function sum(list, pick) { var t = 0; list.forEach(function (x) { t += pick(x); }); return t; }

  /* "A", "A and B", "A, B and 2 more" */
  function names(list) {
    if (list.length <= 2) return list.join(' and ');
    return list[0] + ', ' + list[1] + ' and ' + (list.length - 2) + ' more';
  }
  function priceLine(service, cents, billing) {
    return (service || 'Service') + ', ' + fmt.money(cents) + (billing === 'monthly' ? ' a month' : ' one-time');
  }
  function whenWords(job) {
    return job.date === App.today() ? 'today at ' + fmt.time(job.time) : fmt.when(job.date, job.time);
  }
  function pctText(n) { return String(Math.round((+n || 0) * 100) / 100) + '%'; }
  /* The same sum the system does: pct percent of a price, in whole cents. */
  function share(cents, pct) { return Math.round(cents * Math.round((pct || 0) * 100) / 10000); }

  function openClient(id) {
    if (typeof App.actions.openClient === 'function') App.act('openClient', id);
    else App.go('clients');
  }

  /* A small sheet that lists a few things, each of which opens something. It stays current. */
  function openList(title, build) {
    App.sheet.open({
      title: title, small: true,
      update: function (sh) { sh.rebuild(); },
      body: function (el) {
        var rows = build();
        if (!rows.length) { el.appendChild(h('p', { class: 'muted' }, 'Nothing left here.')); return; }
        var list = h('div', { class: 'list' });
        rows.forEach(function (row) { list.appendChild(row); });
        el.appendChild(list);
      }
    });
  }

  /* A field with something at its right edge (the "%" in Commission). */
  function withSuffix(field, text) {
    var wrap = h('span', { class: 'input-wrap has-suffix' });
    field.insertBefore(wrap, field.input);
    wrap.appendChild(field.input);
    wrap.appendChild(h('span', { class: 'input-suffix', 'aria-hidden': 'true' }, text));
    return field;
  }

  /* ================= Dashboard: needs attention ================= */

  function lateClients() {
    return App.data.clients.filter(function (c) { return c.payStatus === 'late'; }).sort(byName);
  }
  function overdueJobs() { return App.data.jobs.filter(App.isOverdue).sort(byWhen); }
  function looseJobs() {
    return App.data.jobs.filter(function (j) { return j.status === 'scheduled' && !j.assignedTo; }).sort(byWhen);
  }
  /* A sale is waiting while nothing was booked for it: not with the sale, and not for that client since. */
  function waitingSales() {
    var d = App.data;
    return d.sales.filter(function (s) {
      if (s.jobId) return false;
      var c = App.client(s.clientId);
      if (c && c.status === 'Cancelled') return false;
      return !d.jobs.some(function (j) {
        return j.clientId === s.clientId && j.status !== 'cancelled' && !j.saleId && (j.createdAt || 0) >= (s.soldAt || 0);
      });
    }).sort(function (a, b) { return (a.soldAt || 0) - (b.soldAt || 0); });
  }

  function lateRows() {
    return lateClients().map(function (c) {
      return ui.row({ title: c.name, sub: priceLine(c.service, c.priceCents, c.billing), right: ui.payPill('late'),
        onTap: function () { openClient(c.id); } });
    });
  }
  function jobRows(pick) {
    /* Only an overdue job carries its pill here: the sheet's title already says what the rest are. */
    return function () {
      return pick().map(function (j) { return ui.jobRow(j, App.isOverdue(j) ? { showDate: true } : { showDate: true, pill: false }); });
    };
  }
  function waitingRows() {
    return waitingSales().map(function (s) {
      return ui.row({ title: s.clientName || 'Client',
        sub: [priceLine(s.service, s.priceCents, s.billing), 'Sold ' + fmt.dayShort(s.day) + ' by ' + App.nameOf(s.repId, 'someone')],
        onTap: function () { openClient(s.clientId); } });
    });
  }

  /* The count that leads a row, in the color of its state (the words beside it say what it is). */
  function count(n, tone) { return h('span', { class: 'rank' }, h('span', { class: tone }, String(n))); }

  function problemsRow(problems) {
    var shown = problems.slice(0, 3), more = problems.length - shown.length;
    var lines = h('span', { class: 'stack-sm' });
    shown.forEach(function (p) {
      lines.appendChild(h('span', { class: 'stack-xs' }, h('span', null, p.message), h('span', { class: 'hint' }, fmt.stamp(p.at))));
    });
    if (more > 0) lines.appendChild(h('span', { class: 'hint' }, 'And ' + fmt.plural(more, 'older one') + '.'));
    var clearBtn = ui.button('Clear', { kind: 'text', small: true, onTap: function (e, btn) {
      ui.save(btn, 'clearProblems', {}, { busyText: 'Clearing...' }).then(function (res) { if (res.ok) App.toast('Cleared.'); });
    } });
    return ui.row({ lead: count(problems.length, 'bad'), title: problems.length === 1 ? 'System problem' : 'System problems',
      sub: lines, right: clearBtn, chevron: false, cls: 'row-top' });
  }

  function attentionRows() {
    var d = App.data, today = d.today, rows = [];
    var late = lateClients(), overdue = overdueJobs(), loose = looseJobs(), waiting = waitingSales();

    if (late.length) {
      rows.push(ui.row({ lead: count(late.length, 'bad'), title: late.length === 1 ? 'Late payment' : 'Late payments',
        sub: names(late.map(function (c) { return c.name; })),
        onTap: function () { if (late.length === 1) openClient(late[0].id); else openList('Late payments', lateRows); } }));
    }
    if (overdue.length) {
      rows.push(ui.row({ lead: count(overdue.length, 'bad'), title: overdue.length === 1 ? 'Overdue job' : 'Overdue jobs',
        sub: overdue.length === 1
          ? ((overdue[0].client || {}).name || 'A job') + ', was due ' + fmt.day(overdue[0].date)
          : names(overdue.map(function (j) { return (j.client || {}).name || 'A job'; })),
        onTap: function () { if (overdue.length === 1) ui.openJob(overdue[0].id); else openList('Overdue jobs', jobRows(overdueJobs)); } }));
    }
    if (loose.length) {
      rows.push(ui.row({ lead: count(loose.length, 'warn'), title: loose.length === 1 ? 'Job with nobody assigned' : 'Jobs with nobody assigned',
        sub: loose.length === 1
          ? ((loose[0].client || {}).name || 'A job') + ', ' + whenWords(loose[0])
          : names(loose.map(function (j) { return (j.client || {}).name || 'A job'; })),
        onTap: function () { if (loose.length === 1) ui.openJob(loose[0].id); else openList('Nobody assigned', jobRows(looseJobs)); } }));
    }
    if (waiting.length) {
      rows.push(ui.row({ lead: count(waiting.length, 'warn'), title: waiting.length === 1 ? 'Sale waiting for an appointment' : 'Sales waiting for an appointment',
        sub: names(waiting.map(function (s) { return s.clientName || 'A client'; })),
        onTap: function () { if (waiting.length === 1) openClient(waiting[0].clientId); else openList('Waiting for an appointment', waitingRows); } }));
    }

    var end = D.addDays(today, 6);
    var free = App.freeDays().filter(function (date) { return date <= end; });
    if (!free.length) {
      var anyOpen = (d.days || []).some(function (x) { return x.open && x.date >= today && x.date <= end; });
      rows.push(ui.row({ lead: count(0, 'warn'),
        title: anyOpen ? 'Free times in the next 7 days' : 'Open days in the next 7 days',
        sub: anyOpen ? 'Every open day is full. Open more so your reps can book.' : 'Your reps cannot book until you open some.',
        onTap: function () { App.go('calendar'); } }));
    }

    var problems = (d.problems || []).slice().sort(function (a, b) { return (b.at || 0) - (a.at || 0); });
    if (problems.length) rows.push(problemsRow(problems));

    if (!rows.length) {
      rows.push(ui.row({ lead: h('span', { class: 'good' }, App.icon('check-circle', 24)), title: 'All clear.' }));
    }
    return rows;
  }

  /* ================= Dashboard: numbers, leaderboard, coming up ================= */

  function statGrid(items) {
    var el = h('div', { class: 'stat-grid' });
    items.forEach(function (it) {
      el.appendChild(h('div', { class: 'stat' }, h('span', { class: 'stat-num' }, it.value), h('span', { class: 'stat-label' }, it.label)));
    });
    return el;
  }

  function numbers() {
    var d = App.data, wk = D.weekStart(d.today), mo = D.monthStart(d.today);
    var week = d.sales.filter(function (s) { return s.day >= wk; });
    var month = d.sales.filter(function (s) { return s.day >= mo; });
    var price = function (s) { return s.priceCents || 0; };
    var owed = sum(d.sales, function (s) { return Core.calc.sumEvents(s.events || [], mo, null); });
    var active = d.clients.filter(function (c) { return c.status === 'Active'; }).length;
    return statGrid([
      { value: String(week.length), label: 'Sales this week' },
      { value: fmt.moneyShort(sum(week, price)), label: 'Revenue this week' },
      { value: String(month.length), label: 'Sales this month' },
      { value: fmt.moneyShort(sum(month, price)), label: 'Revenue this month' },
      { value: String(active), label: 'Active clients' },
      { value: fmt.moneyShort(owed), label: 'Commission owed this month' }
    ]);
  }

  /* The leaderboard belongs to the Sales screens. If that part is not here, a plain ranked list stands in. */
  var boardPeriod = 'week';
  var PERIODS = [{ value: 'week', label: 'This week' }, { value: 'month', label: 'This month' }, { value: 'all', label: 'All time' }];

  function simpleBoard(box) {
    var d = App.data, me = d.me;
    var from = boardPeriod === 'week' ? D.weekStart(d.today) : boardPeriod === 'month' ? D.monthStart(d.today) : null;
    var earned = {};
    d.sales.forEach(function (s) { earned[s.repId] = (earned[s.repId] || 0) + Core.calc.sumEvents(s.events || [], from, null); });

    box.appendChild(ui.segmented({ label: 'Leaderboard for', options: PERIODS, value: boardPeriod,
      onChange: function (v) { boardPeriod = v; App.refresh(); } }));
    var rows = (d.board || []).slice().sort(function (a, b) {
      var x = a[boardPeriod], y = b[boardPeriod];
      return (y.cents - x.cents) || (y.count - x.count) || byName(a, b);
    });
    if (!rows.length) {
      box.appendChild(h('p', { class: 'muted' }, 'No sales reps yet. Add your people from the menu at the top left.'));
      return;
    }
    var list = h('div', { class: 'list' });
    rows.forEach(function (r, i) {
      var p = r[boardPeriod], you = r.id === me.id;
      list.appendChild(ui.row({
        lead: h('span', { class: 'rank' + (i === 0 && p.cents > 0 ? ' is-top' : '') }, String(i + 1)),
        title: you ? h('span', { class: 'cluster' }, r.name, ui.pill('You', 'ice')) : r.name,
        sub: fmt.plural(p.count, 'sale') + (r.active ? '' : ', no longer on the team'),
        right: h('span', { class: 'stack-xs' },
          h('span', { class: 'board-amt' }, fmt.money(p.cents)),
          h('span', { class: 'small' }, fmt.money(earned[r.id] || 0) + ' commission')),
        cls: you ? 'is-you' : ''
      }));
    });
    box.appendChild(list);
  }

  function drawLeaderboard(box) {
    if (typeof ui.leaderboard === 'function') {
      try {
        var made = ui.leaderboard(box, { showCommission: true });
        if (!box.firstChild && made && made.nodeType && made !== box) box.appendChild(made);
      } catch (e) {
        if (window.console && console.error) console.error(e);
        clear(box);
      }
    }
    if (!box.firstChild) simpleBoard(box);
  }

  function comingUp() {
    var d = App.data, end = D.addDays(d.today, 7);
    var jobs = d.jobs.filter(function (j) { return j.status === 'scheduled' && j.date > d.today && j.date <= end; }).sort(byWhen);
    if (!jobs.length) return h('p', { class: 'muted' }, 'Nothing is booked in the next 7 days.');
    var list = h('div', { class: 'list' });
    jobs.forEach(function (j) {
      var who = j.assignedTo ? App.nameOf(j.assignedTo, 'Someone') : h('span', { class: 'warn' }, 'Nobody assigned');
      list.appendChild(ui.jobRow(j, { showDate: true, sub: [j.what, who], pill: false }));
    });
    return list;
  }

  function renderDashboard(root) {
    root.appendChild(ui.title('Dashboard'));

    root.appendChild(ui.label('Needs attention'));
    var attention = h('div', { class: 'list' });
    attentionRows().forEach(function (row) { attention.appendChild(row); });
    root.appendChild(attention);

    root.appendChild(ui.label('Numbers'));
    root.appendChild(numbers());

    root.appendChild(ui.label('Leaderboard'));
    var board = h('div', { class: 'stack' });
    root.appendChild(board);
    drawLeaderboard(board);

    root.appendChild(ui.label('Coming up'));
    root.appendChild(comingUp());
  }

  /* ================= Schedule (techs) ================= */

  function renderSchedule(root) {
    var d = App.data, today = d.today, tomorrow = D.addDays(today, 1);
    var ahead = d.jobs.filter(function (j) { return j.status === 'scheduled' && j.date > today; }).sort(byWhen);
    var done = d.jobs.filter(function (j) { return j.status === 'done'; })
      .sort(function (a, b) { return (b.doneAt || 0) - (a.doneAt || 0); }).slice(0, 10);

    root.appendChild(ui.title('Schedule', 'Your jobs from tomorrow on.'));

    if (!ahead.length) {
      var left = App.jobsOn(today).filter(function (j) { return j.status === 'scheduled'; }).length;
      root.appendChild(ui.empty(left
        ? { title: 'No jobs coming up.', text: 'You still have ' + fmt.plural(left, 'job') + ' to do today.', button: { label: 'Go to Today', onTap: function () { App.go('today'); } } }
        : { title: 'No jobs coming up.', text: 'New jobs show up here as soon as they are given to you.' }));
    }
    var list = null, day = '';
    ahead.forEach(function (j) {
      if (j.date !== day) {
        day = j.date;
        root.appendChild(ui.label((day === tomorrow ? 'Tomorrow, ' : '') + fmt.day(day)));
        list = h('div', { class: 'list' });
        root.appendChild(list);
      }
      list.appendChild(ui.jobRow(j, { pill: false }));
    });

    if (done.length) {
      root.appendChild(ui.label('Recently done'));
      var doneList = h('div', { class: 'list' });
      done.forEach(function (j) { doneList.appendChild(ui.jobRow(j, { showDate: true })); });
      root.appendChild(doneList);
    }
  }

  /* ================= Notifications ================= */

  /* The Me sheet is not redrawn when data changes, so its "4 new" would outlive the reading. */
  function clearNewPill() {
    var rows = document.querySelectorAll('.sheet .row');
    for (var i = 0; i < rows.length; i++) {
      var title = rows[i].querySelector('.row-title'), pill = rows[i].querySelector('.row-right');
      if (title && pill && title.textContent === 'Notifications' && pill.parentNode) pill.parentNode.removeChild(pill);
    }
  }

  App.actions.openNotices = function () {
    var me = App.me();
    if (!me || me.role !== 'owner') return;
    var seenAt = me.noticesSeenAt || 0, marking = false;   /* what was new when the sheet opened stays marked while it is open */

    function markRead() {
      var now = App.me();
      if (marking || !now) return;
      var unread = (App.data.notices || []).some(function (n) { return n.at > (now.noticesSeenAt || 0); });
      if (!unread) return;
      marking = true;
      App.api.send('readNotices', {}).then(function (res) {
        marking = false;
        if (res.ok) clearNewPill();
      });
    }

    var sheet = App.sheet.open({
      title: 'Notifications',
      update: function (sh) { sh.rebuild(); markRead(); },
      onClose: function () { if (stopClock) stopClock(); },
      body: function (el) {
        var list = ((App.data && App.data.notices) || []).slice().sort(function (a, b) { return (b.at || 0) - (a.at || 0); });
        if (!list.length) {
          el.appendChild(ui.empty({ title: 'No notifications yet.', text: 'New sales, bookings and finished jobs show up here.' }));
          return;
        }
        var rows = h('div', { class: 'list' });
        list.forEach(function (n) {
          var fresh = n.at > seenAt;
          rows.appendChild(ui.row({
            lead: h('span', { class: 'notice-dot' + (fresh ? ' is-new' : ''), role: fresh ? 'img' : null, 'aria-label': fresh ? 'New' : null }),
            title: n.text,
            sub: fmt.ago(n.at),
            cls: 'notice' + (fresh ? ' is-new' : '')
          }));
        });
        el.appendChild(rows);
      }
    });
    var stopClock = App.on('tick', function () { sheet.rebuild(); });   /* "5 min ago" keeps up while the sheet is open */
    markRead();
  };

  /* ================= Team ================= */

  function readLine(m) {
    if (!m || m.role === 'owner') return null;
    if (App.hasRead(m)) return h('span', { class: 'good' }, 'Read the standards ' + fmt.date(m.standardsAckAt));
    return h('span', { class: 'warn' }, m.standardsAckAt ? 'Has not read the changed standards yet' : 'Standards not read yet');
  }

  function nameProblem(name, exceptId) {
    if (!name) return 'Add a name.';
    var clash = App.people().some(function (t) { return t.id !== exceptId && norm(t.name) === norm(name); });
    return clash ? NAME_TAKEN : '';
  }

  /* The new PIN, shown once. */
  function pinBox(name, pin) {
    return h('div', { class: 'callout callout-ice' },
      h('p', { class: 'callout-title' }, 'PIN for ' + name),
      h('p', { class: 'callout-big' }, pin),
      h('p', { class: 'small muted' }, 'Tell them in person. It is not shown again.'));
  }

  function drawTeam(el) {
    var me = App.me();
    [['owner', 'Owners'], ['rep', 'Sales reps'], ['tech', 'Techs']].forEach(function (group) {
      var people = App.people([group[0]]).sort(byName);
      el.appendChild(ui.label(group[1]));
      if (!people.length) { el.appendChild(h('p', { class: 'muted' }, 'Nobody yet.')); return; }
      var list = h('div', { class: 'list' });
      people.forEach(function (m) {
        list.appendChild(ui.row({
          lead: h('span', { class: 'avatar' }, fmt.initials(m.name)),
          title: m.name, sub: readLine(m),
          right: m.id === me.id ? ui.pill('You', 'ice') : null,
          onTap: function () { openPerson(m.id); }
        }));
      });
      el.appendChild(list);
    });
  }

  App.actions.openTeam = function () {
    if (App.role() !== 'owner') return;
    App.sheet.open({
      title: 'Team',
      update: function (sh) { sh.rebuild(); },
      body: drawTeam,
      footer: { label: 'Add person', onTap: function () { openAddPerson(); } }
    });
  };

  function openAddPerson() {
    var name, pin, role, roleHint, added = null;

    function form(el, sh) {
      role = 'rep';
      name = ui.field({ label: 'Name', name: 'new-name', maxlength: 40, autocapitalize: 'words', hint: 'This is the name they type to sign in.' });
      roleHint = h('p', { class: 'field-hint' }, ROLE_HELP[role]);
      var seg = ui.segmented({ label: 'Role', value: role,
        options: ROLE_ORDER.map(function (r) { return { value: r, label: ROLE_WORDS[r] }; }),
        onChange: function (v) { role = v; roleHint.textContent = ROLE_HELP[v]; } });
      pin = ui.field({ label: 'PIN', name: 'new-pin', optional: true, inputmode: 'numeric', maxlength: 6,
        hint: '4 to 6 digits. Leave it blank and one is made for them.' });
      clear(el);
      el.appendChild(name);
      el.appendChild(h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'Role'), seg, roleHint));
      el.appendChild(pin);
      sh.setTitle('Add person');
      sh.setButton('Add person');
    }

    function done(el, sh) {
      clear(el);
      el.appendChild(h('div', { class: 'stack-xs' },
        h('p', { class: 'std-ok' }, App.icon('check-circle', 20), h('span', null, added.name + ' is on the team.')),
        h('p', { class: 'muted' }, 'They sign in with the name ' + added.name + ' and this PIN.')));
      el.appendChild(pinBox(added.name, added.pin));
      el.appendChild(ui.button('Add another person', { block: true, icon: 'plus', onTap: function () { added = null; form(el, sh); } }));
      sh.setTitle('Person added');
      sh.setButton('Done');
      sh.body.scrollTop = 0;
    }

    App.sheet.open({
      title: 'Add person',
      body: function (el, sh) { form(el, sh); },
      footer: { label: 'Add person', onTap: function (sh) {
        if (added) { sh.close(); return; }
        var n = oneLine(name.val()), p = pin.val();
        var problem = nameProblem(n, null);
        if (problem) { name.setError(problem); sh.reveal(name); return; }
        if (p && !/^\d{4,6}$/.test(p)) { pin.setError('A PIN is 4 to 6 digits.'); sh.reveal(pin); return; }
        sh.send('saveMember', { member: { name: n, role: role, pin: p } }).then(function (res) {
          if (!res.ok) return;
          added = { name: n, pin: String((res.result && res.result.pin) || p) };
          done(sh.body, sh);
        });
      } }
    });
  }

  function openPin(name, pin) {
    App.sheet.open({
      title: 'New PIN', small: true,
      body: function (el) {
        el.appendChild(h('p', { class: 'muted' }, 'The old PIN no longer works. ' + name + ' signs in again with this one.'));
        el.appendChild(pinBox(name, pin));
      },
      footer: { label: 'Done', onTap: function (sh) { sh.close(); } }
    });
  }

  function resetPin(m, rowEl, errorEl) {
    App.confirm({
      title: 'Reset the PIN for ' + m.name + '?',
      text: 'Their old PIN stops working and they are signed out. You get a new one to give them.',
      yes: 'Reset PIN'
    }).then(function (yes) {
      if (!yes) return;
      ui.save(rowEl, 'resetPin', { id: m.id }, { errorEl: errorEl }).then(function (res) {
        if (res.ok && res.result && res.result.pin) openPin(m.name, String(res.result.pin));
      });
    });
  }

  function removePerson(m, btn, errorEl, sh) {
    var open = App.data.jobs.filter(function (j) { return j.assignedTo === m.id && j.status === 'scheduled'; }).length;
    App.confirm({
      title: 'Remove ' + m.name + ' from the team?',
      text: 'They can no longer sign in. Their sales history stays. ' + (open
        ? 'Their ' + fmt.plural(open, 'open job') + (open === 1 ? ' becomes' : ' become') + ' unassigned.'
        : 'Any open jobs they have become unassigned.'),
      yes: 'Remove', danger: true
    }).then(function (yes) {
      if (!yes) return;
      ui.save(btn, 'removeMember', { id: m.id }, { errorEl: errorEl }).then(function (res) {

  /* ----- Services: one line each (name, usual price, remove) ----- */

  function openServices() {
    var draft = (App.data.settings.services || []).map(function (s) {
      return { id: s.id, name: s.name, price: s.priceCents ? (s.priceCents / 100).toFixed(2) : '' };
    });
    var rows = [], listEl = h('div', { class: 'stack-sm' });
    var addBtn = ui.button('Add a service', { icon: 'plus', block: true, onTap: function () {
      read();
      draft.push({ name: '', price: '' });
      draw();
      var last = rows[rows.length - 1];
      try { last.name.input.focus(); } catch (e) { /* fine */ }
    } });

    function read() {
      rows.forEach(function (r) { r.item.name = r.name.input.value; r.item.price = r.price.input.value; });
    }
    function draw() {
      clear(listEl);
      rows = [];
      draft.forEach(function (item, i) {
        var name = ui.field({ name: 'svc-name-' + i, value: item.name, maxlength: 40, placeholder: 'Service name', autocapitalize: 'sentences' });
        var price = ui.field({ name: 'svc-price-' + i, value: item.price, prefix: '$', inputmode: 'decimal', maxlength: 10 });
        name.input.setAttribute('aria-label', 'Service name');
        price.input.setAttribute('aria-label', 'Usual price');
        var remove = h('button', { type: 'button', class: 'iconbtn', 'aria-label': 'Remove ' + (oneLine(item.name) || 'this service'),
          disabled: draft.length < 2, onclick: function () {
            read();
            draft.splice(draft.indexOf(item), 1);
            draw();
          } }, App.icon('trash', 20));
        rows.push({ item: item, name: name, price: price });
        listEl.appendChild(h('div', { class: 'svc-row' }, name, price, remove));
      });
      addBtn.hidden = draft.length >= LIMITS.services;
    }

    App.sheet.open({
      title: 'Services',
      body: function (el) {
        el.appendChild(h('p', { class: 'muted' }, 'These are the choices on a new sale. The usual price fills in when a rep picks one. Leave it blank if the price changes from job to job.'));
        el.appendChild(h('div', { class: 'stack-sm' },
          h('div', { class: 'svc-row svc-head', 'aria-hidden': 'true' }, h('span', null, 'Service'), h('span', null, 'Usual price'), h('span')),
          listEl));
        el.appendChild(addBtn);
        draw();
      },
      footer: { label: 'Save', onTap: function (sh) {
        read();
        var seen = Object.create(null), bad = null, out = [];   /* not {}: a service may be called "constructor" */
        rows.forEach(function (r) {
          var name = oneLine(r.item.name), text = String(r.item.price || '').trim(), cents = text ? fmt.toCents(text) : 0;
          if (!name) { r.name.setError('Add a name.'); bad = bad || r.name; }
          else if (seen[norm(name)]) { r.name.setError('Already on the list.'); bad = bad || r.name; }
          seen[norm(name)] = true;
          if (cents == null || cents > LIMITS.maxCents) { r.price.setError('Check the price.'); bad = bad || r.price; }
          var item = { name: name, priceCents: cents };
          if (r.item.id) item.id = r.item.id;
          out.push(item);
        });
        if (bad) { sh.reveal(bad); return; }
        sh.send('saveSettings', { settings: { services: out } }).then(function (res) {
          if (!res.ok) return;
          sh.close();
          App.toast('Services saved.');
        });
      } }
    });
  }

  /* ----- Commission ----- */

  var PCT_HELP = 'Enter a number from 0 to 100, like 30 or 12.5.';

  function parsePct(text) {
    var s = String(text == null ? '' : text).replace(/[%\s]/g, '');
    if (!/^(\d{1,3}(\.\d{0,2})?|\.\d{1,2})$/.test(s)) return null;
    var n = parseFloat(s);
    return n >= 0 && n <= 100 ? n : null;
  }

  function openCommission() {
    var s = App.data.settings;
    var example = h('p', { class: 'muted' });
    function paint() {
      var a = parsePct(first.val()), b = parsePct(monthly.val());
      example.hidden = a == null || b == null;
      if (a == null || b == null) return;
      example.textContent = 'On a $200.00 monthly sale a rep earns ' + fmt.money(share(20000, a)) + ', then ' +
        fmt.money(share(20000, b)) + ' every month the client stays.';
    }
    var first = withSuffix(ui.field({ label: 'On a new sale', name: 'pct-first', value: String(s.firstPct), inputmode: 'decimal', maxlength: 6, onInput: paint }), '%');
    var monthly = withSuffix(ui.field({ label: 'Each month after, for monthly clients', name: 'pct-monthly', value: String(s.monthlyPct), inputmode: 'decimal', maxlength: 6, onInput: paint }), '%');
    paint();
    App.sheet.open({
      title: 'Commission', small: true,
      body: function (el) {
        el.appendChild(first);
        el.appendChild(monthly);
        el.appendChild(example);
        el.appendChild(h('p', { class: 'hint' }, 'Sales already made keep the rates they were sold at.'));
      },
      footer: { label: 'Save', onTap: function (sh) {
        var a = parsePct(first.val()), b = parsePct(monthly.val());
        if (a == null) { first.setError(PCT_HELP); sh.reveal(first); return; }
        if (b == null) { monthly.setError(PCT_HELP); sh.reveal(monthly); return; }
        sh.send('saveSettings', { settings: { firstPct: a, monthlyPct: b } }).then(function (res) {
          if (!res.ok) return;
          sh.close();
          App.toast('Commission saved.');
        });
      } }
    });
  }

  /* ----- Usual appointment times ----- */

  function openTimes() {
    var draft = (App.data.settings.defaultSlots || []).slice().sort();
    var chips = h('div', { class: 'chips', role: 'group', 'aria-label': 'Usual times' });
    var error = h('p', { class: 'form-error', role: 'alert', hidden: true });
    var box = ui.field({ label: 'Add a time', name: 'slot-new', type: 'time', onInput: function () { say(''); } });

    function say(message) { error.textContent = message || ''; error.hidden = !message; }
    function draw() {
      clear(chips);
      draft.forEach(function (t) {
        chips.appendChild(h('button', { type: 'button', class: 'chip chip-x', 'aria-label': 'Remove ' + fmt.time(t), onclick: function () {
          draft.splice(draft.indexOf(t), 1);
          say('');
          draw();
        } }, fmt.time(t), App.icon('close', 16)));
      });
      if (!draft.length) chips.appendChild(h('p', { class: 'muted' }, 'No times yet. Add at least one.'));
    }
    /* Returns false when what is in the box cannot be added. */
    function add(quiet) {
      var t = box.val();
      if (!t) { if (!quiet) say('Pick a time first.'); return !!quiet; }
      if (!D.isHM(t)) { say('That is not a time.'); return false; }
      if (draft.indexOf(t) >= 0) { if (!quiet) say(fmt.time(t) + ' is already on the list.'); box.input.value = ''; return !!quiet; }
      if (draft.length >= LIMITS.slotsPerDay) { say('That is the most times a day can hold.'); return false; }
      draft.push(t);
      draft.sort();
      box.input.value = '';
      say('');
      draw();
      return true;
    }

    App.sheet.open({
      title: 'Usual appointment times', small: true,
      body: function (el) {
        el.appendChild(h('p', { class: 'muted' }, 'A day you open starts with these times. Days you have already set up keep their own.'));
        el.appendChild(chips);
        el.appendChild(h('div', { class: 'add-row' }, box, ui.button('Add', { onTap: function () { add(false); } })));
        el.appendChild(error);
        draw();
      },
      footer: { label: 'Save', onTap: function (sh) {
        if (!add(true)) return;                     /* a time typed but not added yet goes in too */
        if (!draft.length) { say('Keep at least one time.'); return; }
        sh.send('saveSettings', { settings: { defaultSlots: draft.slice() } }).then(function (res) {
          if (!res.ok) return;
          sh.close();
          App.toast('Usual times saved.');
        });
      } }
    });
  }

  /* ----- Give new jobs to ----- */

          list.appendChild(ui.row({
            lead: h('span', { class: 'avatar' }, fmt.initials(m.name)), title: m.name, sub: ROLE_WORDS[m.role] || '',

  /* ================= Edit standards ================= */

  function itemsOf(text) {
    return String(text == null ? '' : text).split(/\r\n?|\n/).map(oneLine).filter(function (x) { return x; });
  }
  function grow(box) {
    box.style.height = 'auto';
    box.style.height = (box.scrollHeight + 2) + 'px';
  }

  function openStandardsEditor(start) {
    var draft = start || (App.data.settings.standards || []).map(function (s) {
      return { id: s.id, title: s.title, ordered: !!s.ordered, text: (s.items || []).join('\n') };
    });
    var blocks = [], saved = false, listEl = h('div', { class: 'stack' });

    function read() {
      blocks.forEach(function (b) { b.sec.title = b.title.input.value; b.sec.text = b.box.input.value; b.sec.ordered = b.toggle.get(); });
    }
    function cleaned() {
      return draft.map(function (s) {
        var out = { title: oneLine(s.title), ordered: !!s.ordered, items: itemsOf(s.text) };
        if (s.id) out.id = s.id;
        return out;
      });
    }
    function changed() {
      if (!App.data) return false;
      var now = (App.data.settings.standards || []).map(function (s) {
        return { title: s.title, ordered: !!s.ordered, items: s.items || [], id: s.id };
      });
      return JSON.stringify(cleaned()) !== JSON.stringify(now);
    }
    function draw() {
      clear(listEl);
      blocks = [];
      draft.forEach(function (sec, i) {
        var title = ui.field({ label: 'Section title', name: 'std-title-' + i, value: sec.title, maxlength: 60, autocapitalize: 'sentences' });
        var toggle = ui.toggle({ label: 'Numbered steps', hint: 'For things done in order', checked: sec.ordered });
        var box = ui.field({ label: 'One standard per line', name: 'std-items-' + i, type: 'textarea', rows: 4, value: sec.text });
        box.input.classList.add('std-edit');
        box.input.addEventListener('input', function () { grow(box.input); });
        var remove = ui.button('Remove section', { kind: 'text', small: true, onTap: function () { removeSection(sec); } });
        remove.classList.add('btn-danger');
        var block = { sec: sec, title: title, toggle: toggle, box: box, el: h('div', { class: 'card' }, title, toggle, box, h('div', { class: 'std-remove' }, remove)) };
        blocks.push(block);
        listEl.appendChild(block.el);
      });
      if (!draft.length) listEl.appendChild(h('p', { class: 'muted' }, 'No sections yet. Add the first one.'));
      blocks.forEach(function (b) { grow(b.box.input); });
      addBtn.hidden = draft.length >= LIMITS.standardSections;
    }
    function removeSection(sec) {
      read();
      var count = itemsOf(sec.text).length, name = oneLine(sec.title);
      function go() {
        read();
        var i = draft.indexOf(sec);
        if (i >= 0) draft.splice(i, 1);
        draw();
      }
      if (!name && !count) { go(); return; }
      App.confirm({
        title: 'Remove this section?',
        text: (name ? '"' + name + '"' : 'This section') + (count ? ' and its ' + fmt.plural(count, 'standard') : '') + ' will be gone once you save.',
        yes: 'Remove section', danger: true
      }).then(function (yes) { if (yes) go(); });
    }
    var addBtn = ui.button('Add a section', { icon: 'plus', block: true, onTap: function () {
      read();
      draft.push({ title: '', ordered: false, text: '' });
      draw();
      var last = blocks[blocks.length - 1];
      sheet.reveal(last.el);
      try { last.title.input.focus({ preventScroll: true }); } catch (e) { /* fine */ }
    } });

    var sheet = App.sheet.open({
      title: 'Edit standards',
      body: function (el) {
        el.appendChild(listEl);
        el.appendChild(addBtn);
        draw();
      },
      onClose: function () {
        if (saved) return;
        read();
        if (!changed()) return;
        App.toast('Your changes were not saved.', { action: { label: 'Keep editing', onTap: function () { openStandardsEditor(draft); } } });
      },
      footer: { label: 'Save', onTap: function (sh) {
        read();
        var bad = null;
        blocks.forEach(function (b) {
          var items = itemsOf(b.sec.text);
          if (!oneLine(b.sec.title)) { b.title.setError('Every section needs a title.'); bad = bad || b.title; }
          if (!items.length) { b.box.setError('Add at least one standard, or remove this section.'); bad = bad || b.box; }
          else if (items.length > LIMITS.standardItems) { b.box.setError('Keep a section to ' + LIMITS.standardItems + ' lines or fewer.'); bad = bad || b.box; }
          else if (items.some(function (it) { return it.length > LIMITS.standardLine; })) {
            b.box.setError('One of these lines is too long. Keep each under ' + LIMITS.standardLine + ' letters.');
            bad = bad || b.box;
          }
        });
        if (bad) { sh.reveal(bad); return; }
        if (!changed()) { saved = true; sh.close(); App.toast('Nothing was changed.'); return; }
        sh.send('saveSettings', { settings: { standards: cleaned() } }).then(function (res) {
          if (!res.ok) return;
          saved = true;
          sh.close();
          App.toast(App.people(['rep', 'tech']).length ? 'Standards saved. Your team will be asked to read them again.' : 'Standards saved.');
        });
      } }
    });
    /* The promise that goes with Save sits under the button, where the brief puts it. */
    if (sheet.button && sheet.button.parentNode) {
      sheet.button.parentNode.appendChild(h('p', { class: 'form-note' }, 'Saving a change asks everyone to read these again and confirm.'));
    }
    return sheet;
  }

  App.actions.editStandards = function () {
    if (App.role() !== 'owner') return;
    openStandardsEditor(null);

  /* ================= Sales ================= */

  function renderSales(root) {
    var d = App.data, me = d.me, owner = me.role === 'owner', today = d.today;
    var wk = D.weekStart(today), mo = D.monthStart(today);
    var all = (d.sales || []).slice().sort(newestFirst), list = all, who = '';

    root.appendChild(ui.title('Sales'));
    root.appendChild(ui.button('New sale', { kind: 'primary', block: true, onTap: function () { openNewSale({}); } }));

    if (owner) {
      var seen = {}, sellers = [];
      all.forEach(function (s) { seen[s.repId] = 1; });
      App.people(['rep']).forEach(function (m) { seen[m.id] = 1; });
      Object.keys(seen).forEach(function (id) { sellers.push({ id: id, name: App.nameOf(id, 'Someone who has left') }); });
      sellers.sort(byName);
      if (repFilter && !seen[repFilter]) repFilter = '';
      if (sellers.length > 1) {
        var chips = ui.chips({
          label: 'Sold by', scroll: true, value: repFilter,
          options: [{ value: '', label: 'Everyone' }].concat(sellers.map(function (s) { return { value: s.id, label: s.name }; })),
          onChange: function (v) {
            chipScroll = chips.scrollLeft;
            repFilter = v || '';
            shown = PAGE;
            App.refresh();
          }
        });
        root.appendChild(chips);
        chips.scrollLeft = chipScroll;
      } else repFilter = '';
      if (repFilter) {
        list = all.filter(function (s) { return s.repId === repFilter; });
        who = App.nameOf(repFilter, 'Someone who has left');
      }
    }

    var week = { count: 0, cents: 0 }, month = { count: 0, cents: 0 }, fromNew = 0, fromMonthly = 0;
    list.forEach(function (s) {
      if (s.day >= wk) { week.count++; week.cents += s.priceCents; }
      if (s.day >= mo) { month.count++; month.cents += s.priceCents; }
      fromNew += earned(s, mo, null, 'first');
      fromMonthly += earned(s, mo, null, 'monthly');
    });
    root.appendChild(ui.label(!owner ? 'My numbers' : who ? owned(who) + ' numbers' : 'Business numbers'));
    root.appendChild(numbersCard(
      [{ cents: week.cents, words: fmt.plural(week.count, 'sale') + ' this week' },
       { cents: month.cents, words: fmt.plural(month.count, 'sale') + ' this month' }],
      owner ? 'Commission owed this month' : 'Commission this month',
      fromNew + fromMonthly,
      [['From new sales', fromNew], ['From monthly clients', fromMonthly]]));

    root.appendChild(ui.label(!owner ? 'My sales' : who ? owned(who) + ' sales' : 'All sales', { count: list.length || null }));
    if (!list.length) {
      root.appendChild(ui.empty(who
        ? { title: who + ' has no sales yet.' }
        : { title: 'No sales yet.', text: 'Every sale shows up here as soon as it is saved, with what it earned.' }));
      return;
    }
    var rows = h('div', { class: 'list' });
    list.slice(0, shown).forEach(function (s) { rows.appendChild(saleRow(s, owner && !repFilter)); });
    root.appendChild(rows);
    if (list.length > shown) {
      root.appendChild(ui.button('Show older sales', { block: true, onTap: function () { shown += PAGE; App.refresh(); } }));
    }

  /* ================= one sale: details, commission by date, Remove sale ================= */

  /* The next day a monthly sale pays again: the same day of the month, the first one after today. */
  function nextDue(day, today) {
    for (var k = 1; k <= 600; k++) {
      var due = D.addMonths(day, k);
      if (due > today) return due;
    }
    return '';
  }

  function removeSale(saleId, btn, errorEl, sh, st) {
    var sale = App.sale(saleId);
    if (!sale) return;
    var job = sale.jobId ? App.job(sale.jobId) : null;
    var text = (sale.clientName || 'This client') + ', ' + sale.service + ', ' + priceWords(sale) + '.';
    if (job && job.status === 'scheduled') text += ' The visit on ' + fmt.when(job.date, job.time) + ' has not happened yet, so it is removed too.';
    else if (job && job.status === 'done') text += ' The visit is already done, so it stays on the schedule.';
    text += ' The commission on this sale goes with it. The client stays in Clients.';
    App.confirm({ title: 'Remove this sale?', text: text, yes: 'Remove sale', no: 'Keep it', danger: true }).then(function (yes) {
      if (!yes) return;
      st.removing = true;
      ui.save(btn, 'deleteSale', { saleId: saleId }, { errorEl: errorEl }).then(function (res) {
        if (res.skipped) return;
        if (!res.ok) { st.removing = false; return; }
        sh.close();
        App.toast('Sale removed.');
      });
    });
  }

    else {

      list.appendChild(ui.row({

      } else if (client && (client.status === 'New' || client.status === 'Active')) {

      } else if (client) {

      el.appendChild(err);

  function openSale(saleId) {
    var sale = App.sale(saleId), st = { removing: false };
    if (!sale) { App.toast('That sale is no longer here.'); return null; }
    return App.sheet.open({

        if (st.removing) return;       /* its own save is on the way: leave the button and its message alone */
        var now = App.sale(saleId);

        sh.setTitle(now.clientName || 'Sale');

      }

  /* Book the visit for a sale that was saved with "Book later". */
  function openBook(saleId) {
    var sale = App.sale(saleId), picker;
    if (!sale) return;
    var idle = 'Pick a time';
    var sh = App.sheet.open({
      title: 'Book the appointment',
      body: function (el, sheet) {
        el.appendChild(h('p', { class: 'muted' }, (sale.clientName || 'This client') + ', ' + sale.service + '.'));
        picker = ui.slotPicker({ onChange: function (v) { sheet.setButton(v ? 'Book ' + fmt.when(v.date, v.time) : idle, !v); } });
        el.appendChild(picker);
      },
      footer: { label: idle, onTap: function (sheet) {
        var v = picker.get();
        if (!v) return;
        sheet.send('bookJob', { clientId: sale.clientId, saleId: sale.id, date: v.date, time: v.time, what: sale.service }).then(function (res) {
          if (res.ok) {
            sheet.close();
            App.toast('Booked for ' + fmt.when(v.date, v.time) + '.');
          } else if (res.error.code === 'slot_taken' || res.error.code === 'slot_closed') {
            sheet.error('');
            picker.set(null);
            picker.setError(res.error.message);
            sheet.setButton(idle, true);
          }
        });
      } }
    });
    sh.setButton(idle, true);
