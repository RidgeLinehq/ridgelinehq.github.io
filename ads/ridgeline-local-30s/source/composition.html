<html><head><meta charset="utf-8"><title>Ridgeline Local 30s</title>
<style>

<body><div id="stage">
<div id="scenes"></div>
<div class="aurora"><div class="blob b1"></div><div class="blob b2"></div></div>
<div id="capbg"></div>
<div id="cap"></div>
<div id="vignette"></div>

</div>
<script src="timing.js"></script>
<script>
const $ = (sel,root=document)=>root.querySelector(sel);
const el = (cls, html='', tag='div')=>{const d=document.createElement(tag); if(cls) d.className=cls; d.innerHTML=html; return d;};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eoc=p=>1-Math.pow(1-p,3);
const eic=p=>p*p*p;
const eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const eob=(p,s=1.7)=>{const c3=s+1;return 1+c3*Math.pow(p-1,3)+s*Math.pow(p-1,2);};
const eoe=p=>p>=1?1:1-Math.pow(2,-10*p);
const stage=$('#stage'), scenesRoot=$('#scenes');
const LOGO='<svg viewBox="0 0 40 40" width="100%" height="100%"><path d="M2 31 13.5 11l6 9.5 5-7.5L38 31Z" fill="#F8FAFF"/><path d="M13.5 11 19.5 20.5 16.4 24.9 9.6 17.7Z" fill="#FFC43D"/></svg>';
const IMG={street:'../assets/01-main-street.jpg',bakery:'../assets/02-bakery.jpg',reviews:'../assets/03-reviews.jpg',shop:'../assets/04-phone-shop.jpg',salon:'../assets/05-salon.jpg',ridge:'../assets/06-ridge.jpg'};
const SX=1080/941, SY=1920/1672;
function photo(src,{tint='rgba(10,16,32,.55)',tint2=null,blur=0,bright=1}={}){
  const root=el('photo'); const kb=el('kb'); const img=document.createElement('img'); img.src=src; img.decoding='sync';
  if(blur||bright!==1) img.style.filter=`${blur?`blur(${blur}px) `:''}brightness(${bright})`;
  const tintEl=el('tint'); tintEl.style.background=tint2?`linear-gradient(180deg,${tint} 0%,${tint2} 100%)`:tint;
  kb.appendChild(img); root.appendChild(kb); root.appendChild(tintEl);
  return {root,kb,img,set(s,ox,oy){kb.style.transformOrigin=`${ox}px ${oy}px`;kb.style.transform=`scale(${s})`;}};
}
function homography(src,dst){const A=[],b=[];for(let i=0;i<4;i++){const [x,y]=src[i],[u,v]=dst[i];A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v);}
  const n=8,M=A.map((r,i)=>[...r,b[i]]);for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;[M[c],M[p]]=[M[p],M[c]];for(let r=0;r<n;r++){if(r===c)continue;const f=M[r][c]/M[c][c];for(let k=c;k<=n;k++)M[r][k]-=f*M[c][k];}}
  const h=M.map((r,i)=>r[n]/r[i]);return [...h,1];}
const m3d=h=>`matrix3d(${h[0]},${h[3]},0,${h[6]},${h[1]},${h[4]},0,${h[7]},0,0,1,0,${h[2]},${h[5]},0,${h[8]})`;
function showTok(tok,t,s,dur=.16,slam=false){const p=seg(t,s,s+dur);if(p<=0){tok.style.opacity=0;tok.style.transform='translateY(16px) scale(.92)';return false;}
  const e=slam?eob(p,2.2):eoc(p); tok.style.opacity=Math.min(1,p*2); tok.style.transform=slam?`translateY(0) scale(${lerp(1.35,1,e)})`:`translateY(${lerp(16,0,e)}px) scale(${lerp(.92,1,e)})`; return true;}
/* ---------- CAPTIONS ---------- */
const capEl=$('#cap'), capBg=$('#capbg');
const CAP_CFG={L1:{mode:'band',hero:true,gold:['competitor.'],br:[2]},L2:{mode:'band',br:[5]},L3:{mode:'center',hero:true,rename:{'your':'YOUR'},gold:['YOUR'],br:[2,5]},L4a:{mode:'band',br:[2]},L4b:{mode:'band',br:[4]},L4c:{mode:'band',br:[3]},L5a:{mode:'band',hero:true,gold:['One','new','customer'],br:[2]},L5b:{mode:'none'},L5c:{mode:'none'},L6:{mode:'band',br:[4]}};
const HOLD={L1:2.98,L2:5.9,L3:10.98,L4a:13.98,L4b:16.98,L4c:19.98,L5a:22.55,L6:30.5};
const STATIC=[{s:5.93,e:6.98,text:'You never even knew.',mode:'band',hero:true},{s:25.4,e:26.48,text:'You literally can’t lose.',mode:'band',hero:true,gold:['can’t','lose.'],low:true}];
const capLines={};
function buildCap(id,tokens,cfg){const line=el('cap-line '+(cfg.hero?(cfg.mode==='center'?'center':''):'normal'));
  tokens.forEach((tk,i)=>{let w=tk.w; if(cfg.rename&&cfg.rename[w.replace(/[^a-z]/gi,'').toLowerCase()]) w=cfg.rename[w.replace(/[^a-z]/gi,'').toLowerCase()]+w.replace(/^[a-z]+/i,'');
    const sp=el('tok'+((cfg.gold||[]).includes(w)?' gold':''),w,'span'); sp.dataset.s=tk.s; sp.dataset.e=tk.e; line.appendChild(sp); if((cfg.br||[]).includes(i)) line.appendChild(el('br'));});
  return line;}
VO.lines.forEach(L=>{const cfg=CAP_CFG[L.id]; if(cfg.mode==='none')return; capLines[L.id]={line:buildCap(L.id,L.tokens,cfg),cfg,L};});
STATIC.forEach((st,i)=>{const toks=st.text.split(' ').map((w,j)=>({w,s:st.s+j*.03,e:st.s+j*.03+.3})); st.id='S'+i; capLines[st.id]={line:buildCap(st.id,toks,{hero:st.hero,mode:st.mode,gold:st.gold}),cfg:{mode:st.mode,hero:st.hero,slam:true,low:st.low},L:{start:st.s,end:st.e,tokens:toks},hold:st.e};});
let capCur=null;
function updateCaptions(t){
  let active=null;
